name: Fix grade report font sizes

on:
  push:
    branches:
      - fix/dedupe-grade-report-css

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/dedupe-grade-report-css
          fetch-depth: 0

      - name: Apply scoped grade-report readability changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/_styles.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  ".page-class-report .form-grid-table {\n      font-size: 12px;\n      line-height: 1.05;",
                  ".page-class-report .form-grid-table {\n      font-size: 13px;\n      line-height: 1.05;",
                  "general report grid 12px -> 13px",
              ),
              (
                  ".page-class-report .score-grid-table .rot-text {\n      font-size: 10px;\n    }",
                  ".page-class-report .score-grid-table .rot-text {\n      font-size: 11px;\n    }",
                  "rotated score headers 10px -> 11px",
              ),
              (
                  ".page-class-report .cover-page .form-meta { font-size: 13px; }",
                  ".page-class-report .cover-page .form-meta { font-size: 14px; }",
                  "cover metadata 13px -> 14px",
              ),
              (
                  ".page-class-report .cover-page .form-summary-table { font-size: 12px; }",
                  ".page-class-report .cover-page .form-summary-table { font-size: 13px; }",
                  "cover summary table 12px -> 13px",
              ),
              (
                  ".page-class-report .cover-page .approval-layout { font-size: 13px; margin-top: 3mm; }",
                  ".page-class-report .cover-page .approval-layout { font-size: 14px; margin-top: 3mm; }",
                  "cover approval text 13px -> 14px",
              ),
              (
                  ".page-class-report .attendance-table {\n      font-size: 9.5px;\n      line-height: 1.12;",
                  ".page-class-report .attendance-table {\n      font-size: 10.5px;\n      line-height: 1.12;",
                  "attendance table 9.5px -> 10.5px",
              ),
              (
                  ".page-class-report .attendance-table th:nth-child(3),\n.page-class-report .attendance-table td:nth-child(3) {\n      font-size: 11.5px;",
                  ".page-class-report .attendance-table th:nth-child(3),\n.page-class-report .attendance-table td:nth-child(3) {\n      font-size: 12.5px;",
                  "attendance student names 11.5px -> 12.5px",
              ),
              (
                  ".page-class-report .description-block {\n      width: 122mm;\n      margin: 18mm auto 0;\n      font-size: 13px;",
                  ".page-class-report .description-block {\n      width: 122mm;\n      margin: 18mm auto 0;\n      font-size: 15px;",
                  "description/activity text 13px -> 15px",
              ),
              (
                  ".page-class-report .rubric-explanation {\n      margin-top: 3mm;\n      padding: 2mm 3mm;\n      border: 1px solid var(--report-line);\n      font-size: 11px;",
                  ".page-class-report .rubric-explanation {\n      margin-top: 3mm;\n      padding: 2mm 3mm;\n      border: 1px solid var(--report-line);\n      font-size: 12px;",
                  "rubric explanation 11px -> 12px",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {label}, found {count}')
              text = text.replace(old, new, 1)
              print(label)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          git diff -- src/_styles.html

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-grade-report-fonts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_styles.html .github/workflows/fix-grade-report-fonts.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: improve grade report print readability"
          git push origin HEAD:fix/dedupe-grade-report-css

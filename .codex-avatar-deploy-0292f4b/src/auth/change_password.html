<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เปลี่ยนรหัสผ่าน — PopoWebApp</title>
  <?!= include('_styles') ?>
</head>
<body class="page-change-password">
<div class="pw-card">
  <h2>เปลี่ยนรหัสผ่าน</h2>
  <p class="pw-subtitle">กรุณาตั้งรหัสผ่านใหม่ก่อนเข้าใช้งาน</p>
  <div class="error" id="errBox"></div>
  <div class="form-group">
    <label>รหัสผ่านเดิม</label>
    <input type="password" id="oldPassword" placeholder="รหัสผ่านปัจจุบัน">
  </div>
  <div class="form-group">
    <label>รหัสผ่านใหม่</label>
    <input type="password" id="newPassword" placeholder="รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)">
  </div>
  <div class="form-group">
    <label>ยืนยันรหัสผ่านใหม่</label>
    <input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่านใหม่">
  </div>
  <button class="pw-btn" id="changeBtn" onclick="doChange()">เปลี่ยนรหัสผ่าน</button>
</div>

<script>
var TOKEN = '<?= data.token || '' ?>';

function doChange() {
  var oldPw = document.getElementById('oldPassword').value;
  var newPw = document.getElementById('newPassword').value;
  var confirmPw = document.getElementById('confirmPassword').value;
  var errBox = document.getElementById('errBox');

  if (!oldPw || !newPw || !confirmPw) {
    errBox.textContent = 'กรุณากรอกข้อมูลให้ครบถ้วน';
    errBox.className = 'error show';
    return;
  }
  if (newPw.length < 4) {
    errBox.textContent = 'รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร';
    errBox.className = 'error show';
    return;
  }
  if (newPw !== confirmPw) {
    errBox.textContent = 'รหัสผ่านใหม่ไม่ตรงกัน';
    errBox.className = 'error show';
    return;
  }

  var btn = document.getElementById('changeBtn');
  btn.disabled = true;
  errBox.className = 'error';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) {
        errBox.textContent = result.error;
        errBox.className = 'error show';
        return;
      }
      localStorage.setItem('popo_token', TOKEN);
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { window.top.location.reload(); })
        .getPageHtml(TOKEN, 'dashboard');
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      errBox.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      errBox.className = 'error show';
    })
    .serverChangePassword(TOKEN, oldPw, newPw);
}
</script>
</body>
</html>

  <style>
    /* Two-panel layout fills viewport below navbar */
    .container { display: flex; height: calc(100vh - 52px); max-width: none; margin: 0; padding: 0; }

    /* Left panel */
    .teacher-panel { width: 280px; min-width: 220px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .panel-header { padding: 14px 16px; background: var(--bg-table-head); border-bottom: 1px solid var(--border); font-weight: bold; font-size: 14px; }
    .tab-bar { display: flex; border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 10px; cursor: pointer; border: none; background: white; font-size: 13px; color: var(--text-muted); border-bottom: 2px solid transparent; font-family: inherit; }
    .tab-btn.active { border-bottom-color: var(--brand); color: var(--brand); font-weight: bold; }
    .teacher-list { flex: 1; overflow-y: auto; }
    .teacher-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .teacher-item:hover { background: var(--brand-hover); }
    .teacher-item.selected { background: #e3ecf8; border-left: 3px solid var(--brand); }
    .pair-badge { background: var(--brand); color: white; border-radius: var(--radius-pill); padding: 2px 8px; font-size: 12px; min-width: 28px; text-align: center; }

    /* Right panel */
    .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .right-content { flex: 1; overflow-y: auto; padding: 20px; }
    .right-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 15px; }
    .all-pairs-panel { flex: 1; overflow-y: auto; padding: 20px; }

    /* Inner cards */
    .add-pair-form { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 20px; }
    .add-pair-form h3 { font-size: 14px; margin-bottom: 12px; color: var(--text); }
    .form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
    .form-group label { font-size: 12px; color: var(--text-muted); }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 14px; color: var(--brand); }
    .teacher-detail-header { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 16px; }
    .teacher-name-big { font-size: 18px; font-weight: bold; }
    .pair-count { color: var(--text-muted); font-size: 14px; }
    .no-data { color: var(--text-muted); font-size: 14px; padding: 20px 0; }
    .badge-unassigned { color: var(--text-muted); font-style: italic; }
    .btn-danger { background: var(--red); color: white; padding: 5px 12px; font-size: 12px; }
    .btn-danger:hover { background: var(--red-dark); }

    /* Bulk panel */
    .bulk-panel { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 20px; }
    .bulk-panel h3 { font-size: 14px; margin-bottom: 12px; color: var(--text); }
    .bulk-mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .bulk-mode-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; background: white; font-family: inherit; }
    .bulk-mode-btn.active { background: var(--brand); color: white; border-color: var(--brand); }
    .bulk-result { margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; background: #e8f5e9; color: #2e7d32; display: none; }
    .bulk-result.show { display: block; }
    select[multiple] { min-height: 100px; }
  </style>
</head>

<div id="toast"></div>

<script>
var TOKEN = '<?= data.token ?>';

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { alert('เกิดข้อผิดพลาด: ' + err.message); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

var allData = null;
var selectedTeacherId = null;
var pendingReassign = null;

// ---- Init ----
loadData();

function loadData() {
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error) { showToast(data.error, 'error'); return; }
      allData = data;
      renderTeacherList();
      renderAllPairs();
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .clientGetEnrollmentsData(TOKEN);
}

// ---- Tab switching ----
function switchTab(tab) {
  document.getElementById('tab-teacher').classList.toggle('active', tab === 'teacher');
  document.getElementById('tab-allpairs').classList.toggle('active', tab === 'allpairs');
  document.getElementById('tab-bulk').classList.toggle('active', tab === 'bulk');
  document.getElementById('teacherTab').style.display = tab === 'teacher' ? '' : 'none';
  document.getElementById('allPairsTab').style.display = tab === 'allpairs' ? '' : 'none';
  document.getElementById('bulkAssignTab').style.display = tab === 'bulk' ? '' : 'none';
  if (tab === 'bulk') populateBulkDropdowns();
}

// ---- Teacher list ----
function renderTeacherList() {
  var el = document.getElementById('teacherList');
  if (!allData || !allData.teachers || allData.teachers.length === 0) {
    el.innerHTML = '<div style="padding:16px;color:#888;font-size:13px">ไม่พบครูในระบบ</div>';
    return;
  }
  el.innerHTML = allData.teachers.map(function(t) {
    return '<div class="teacher-item" id="ti-' + t.user_id + '" onclick="selectTeacher(\'' + t.user_id + '\')">' +
      '<span class="teacher-name">' + escHtml(t.full_name) + '</span>' +
      '<span class="pair-badge" id="badge-' + t.user_id + '">' + t.pair_count + '</span>' +
    '</div>';
  }).join('');
}

function selectTeacher(userId) {
  selectedTeacherId = userId;
  // Highlight
  document.querySelectorAll('.teacher-item').forEach(function(el) {
    el.classList.remove('selected');
  });
  var item = document.getElementById('ti-' + userId);
  if (item) item.classList.add('selected');

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('teacherDetail').style.display = '';
  renderTeacherDetail(userId);
}

function renderTeacherDetail(userId) {
  var teacher = allData.teachers.find(function(t) { return t.user_id === userId; });
  if (!teacher) return;

  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error) { showToast(data.error, 'error'); return; }
      renderDetailPanel(teacher, data.enrollments || []);
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .clientGetTeacherEnrollments(TOKEN, userId);
}

function renderDetailPanel(teacher, enrollments) {
  var detail = document.getElementById('teacherDetail');

  // Build class & subject dropdowns from allData
  var classOptions = (allData.classes || []).map(function(c) {
    return '<option value="' + escAttr(c.class_id) + '">' + escHtml(c.level + '/' + c.section) + '</option>';
  }).join('');
  var subjectOptions = (allData.subjects || []).map(function(s) {
    return '<option value="' + escAttr(s.subject_id) + '">' + escHtml(s.subject_name) + '</option>';
  }).join('');

  var tableRows = enrollments.length === 0
    ? '<tr><td colspan="3" class="no-data">ยังไม่มีคู่ที่กำหนด</td></tr>'
    : enrollments.map(function(en) {
        return '<tr>' +
          '<td>' + escHtml(en.class_label) + '</td>' +
          '<td>' + escHtml(en.subject_name) + '</td>' +
          '<td><button class="btn btn-danger" onclick="removeEnrollment(\'' + en.enrollment_id + '\')" data-eid="' + en.enrollment_id + '">ลบ</button></td>' +
        '</tr>';
      }).join('');

  detail.innerHTML =
    '<div class="teacher-detail-header">' +
      '<div>' +
        '<div class="teacher-name-big">' + escHtml(teacher.full_name) + '</div>' +
        '<div class="pair-count" id="pairCountLabel">' + enrollments.length + ' คู่ที่กำหนด</div>' +
      '</div>' +
    '</div>' +

    '<div class="add-pair-form">' +
      '<h3>เพิ่มคู่ (ชั้น, วิชา)</h3>' +
      '<div class="form-row">' +
        '<div class="form-group">' +
          '<label>ชั้นเรียน</label>' +
          '<select id="addClassId">' + classOptions + '</select>' +
        '</div>' +
        '<div class="form-group">' +
          '<label>วิชา</label>' +
          '<select id="addSubjectId">' + subjectOptions + '</select>' +
        '</div>' +
        '<button class="btn btn-primary" id="addPairBtn" onclick="addPair()">เพิ่ม</button>' +
      '</div>' +
    '</div>' +

    '<div class="section-title">คู่ที่กำหนดให้ครู</div>' +
    '<table id="enrollmentTable">' +
      '<thead><tr><th>ชั้น</th><th>วิชา</th><th></th></tr></thead>' +
      '<tbody id="enrollmentBody">' + tableRows + '</tbody>' +
    '</table>';
}

function addPair() {
  if (!selectedTeacherId) return;
  var classId = document.getElementById('addClassId').value;
  var subjectId = document.getElementById('addSubjectId').value;
  var btn = document.getElementById('addPairBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(function(data) {
      btn.disabled = false;
      btn.textContent = 'เพิ่ม';
      if (data.error) { showToast(data.error, 'error'); return; }

      if (data.status === 'conflict') {
        pendingReassign = {
          existing_enrollment_id: data.existing_enrollment_id,
          new_teacher_user_id: selectedTeacherId,
          class_id: classId,
          subject_id: subjectId,
          other_teacher_name: data.other_teacher_name
        };
        var teacher = allData.teachers.find(function(t) { return t.user_id === selectedTeacherId; });
        var teacherName = teacher ? teacher.full_name : selectedTeacherId;
        document.getElementById('reassignMsg').textContent =
          'วิชานี้สอนโดย ' + data.other_teacher_name + ' อยู่แล้ว — ต้องการเปลี่ยนเป็น ' + teacherName + ' ใช่ไหม?';
        document.getElementById('reassignDialog').classList.add('open');
        return;
      }

      if (data.status === 'unchanged') {
        showToast('คู่นี้ถูกกำหนดให้ครูนี้อยู่แล้ว', 'success');
        return;
      }

      showToast('เพิ่มสำเร็จ', 'success');
      refreshEnrollments(data.enrollments);
      updatePairCount(selectedTeacherId, data.enrollments ? data.enrollments.length : null);
      loadData();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false; btn.textContent = 'เพิ่ม';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .clientAddEnrollment(TOKEN, selectedTeacherId, classId, subjectId);
}

function removeEnrollment(enrollmentId) {
  if (!confirm('ต้องการลบคู่นี้ออกใช่ไหม?')) return;
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error) { showToast(data.error, 'error'); return; }
      showToast('ลบสำเร็จ', 'success');
      refreshEnrollments(data.enrollments);
      updatePairCount(selectedTeacherId, data.enrollments ? data.enrollments.length : null);
      loadData();
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .clientRemoveEnrollment(TOKEN, enrollmentId, selectedTeacherId);
}

function refreshEnrollments(enrollments) {
  if (!enrollments) return;
  var teacher = allData.teachers.find(function(t) { return t.user_id === selectedTeacherId; });
  if (!teacher) return;
  var tableRows = enrollments.length === 0
    ? '<tr><td colspan="3" class="no-data">ยังไม่มีคู่ที่กำหนด</td></tr>'
    : enrollments.map(function(en) {
        return '<tr>' +
          '<td>' + escHtml(en.class_label) + '</td>' +
          '<td>' + escHtml(en.subject_name) + '</td>' +
          '<td><button class="btn btn-danger" onclick="removeEnrollment(\'' + en.enrollment_id + '\')" data-eid="' + en.enrollment_id + '">ลบ</button></td>' +
        '</tr>';
      }).join('');
  var tbody = document.getElementById('enrollmentBody');
  if (tbody) tbody.innerHTML = tableRows;
  var label = document.getElementById('pairCountLabel');
  if (label) label.textContent = enrollments.length + ' คู่ที่กำหนด';
}

function updatePairCount(userId, count) {
  var badge = document.getElementById('badge-' + userId);
  if (badge && count !== null) badge.textContent = count;
  // Also update allData
  if (allData && allData.teachers) {
    var t = allData.teachers.find(function(x) { return x.user_id === userId; });
    if (t && count !== null) t.pair_count = count;
  }
}

// ---- Reassign dialog ----
document.getElementById('confirmReassignBtn').addEventListener('click', function() {
  if (!pendingReassign) return;
  this.disabled = true;
  this.textContent = 'กำลังดำเนินการ...';
  var self = this;
  var pr = pendingReassign;
  google.script.run
    .withSuccessHandler(function(data) {
      self.disabled = false;
      self.textContent = 'ยืนยัน';
      closeReassignDialog();
      if (data.error) { showToast(data.error, 'error'); return; }
      showToast('เปลี่ยนครูผู้สอนสำเร็จ', 'success');
      refreshEnrollments(data.enrollments);
      loadData();
    })
    .withFailureHandler(function(err) {
      self.disabled = false; self.textContent = 'ยืนยัน';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .clientConfirmReassign(TOKEN, pr.existing_enrollment_id, pr.new_teacher_user_id, pr.class_id, pr.subject_id);
});

function closeReassignDialog() {
  document.getElementById('reassignDialog').classList.remove('open');
  pendingReassign = null;
}

// ---- All pairs tab ----
function renderAllPairs() {
  var el = document.getElementById('allPairsContent');
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error || !data.rows) {
        el.innerHTML = '<div class="no-data">ไม่สามารถโหลดข้อมูลได้</div>';
        return;
      }
      if (data.rows.length === 0) {
        el.innerHTML = '<div class="no-data">ยังไม่มีข้อมูลชั้นเรียนหรือวิชา</div>';
        return;
      }
      el.innerHTML = '<table>' +
        '<thead><tr><th>ชั้น</th><th>วิชา</th><th>ครูผู้สอน</th></tr></thead>' +
        '<tbody>' + data.rows.map(function(r) {
          var teacherCell = r.teacher_name === 'ยังไม่ได้กำหนด'
            ? '<span class="badge-unassigned">ยังไม่ได้กำหนด</span>'
            : escHtml(r.teacher_name);
          return '<tr>' +
            '<td>' + escHtml(r.class_label) + '</td>' +
            '<td>' + escHtml(r.subject_name) + '</td>' +
            '<td>' + teacherCell + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table>';
    })
    .withFailureHandler(function(err) {
      el.innerHTML = '<div class="no-data">เกิดข้อผิดพลาด: ' + err.message + '</div>';
    })
    .clientGetAllPairsMatrix(TOKEN);
}

// ---- US-019: Bulk assign ----
var bulkMode = 'A';

function populateBulkDropdowns() {
  if (!allData) return;
  var classOptions = (allData.classes || []).map(function(c) {
    return '<option value="' + escAttr(c.class_id) + '">' + escHtml(c.level + '/' + c.section) + '</option>';
  }).join('');
  var subjectOptions = (allData.subjects || []).map(function(s) {
    return '<option value="' + escAttr(s.subject_id) + '">' + escHtml(s.subject_name) + '</option>';
  }).join('');
  var teacherOptions = (allData.teachers || []).map(function(t) {
    return '<option value="' + escAttr(t.user_id) + '">' + escHtml(t.full_name) + '</option>';
  }).join('');

  // Mode A dropdowns
  document.getElementById('bulkAClassId').innerHTML = classOptions;
  document.getElementById('bulkASubjectIds').innerHTML = subjectOptions;
  document.getElementById('bulkATeacherId').innerHTML = teacherOptions;

  // Mode B dropdowns
  document.getElementById('bulkBSubjectId').innerHTML = subjectOptions;
  document.getElementById('bulkBClassIds').innerHTML = classOptions;
  document.getElementById('bulkBTeacherId').innerHTML = teacherOptions;
}

function switchBulkMode(mode) {
  bulkMode = mode;
  document.getElementById('bulkModeABtn').classList.toggle('active', mode === 'A');
  document.getElementById('bulkModeBBtn').classList.toggle('active', mode === 'B');
  document.getElementById('bulkModeA').style.display = mode === 'A' ? '' : 'none';
  document.getElementById('bulkModeB').style.display = mode === 'B' ? '' : 'none';
  document.getElementById('bulkResult').classList.remove('show');
}

function submitBulkAssign(mode) {
  var params = { mode: mode };
  var btn;

  if (mode === 'A') {
    var classId = document.getElementById('bulkAClassId').value;
    var teacherId = document.getElementById('bulkATeacherId').value;
    var subjectSelect = document.getElementById('bulkASubjectIds');
    var subjectIds = Array.from(subjectSelect.selectedOptions).map(function(o) { return o.value; });
    if (!classId || !teacherId || subjectIds.length === 0) {
      showToast('กรุณาเลือกชั้นเรียน ครู และวิชาอย่างน้อย 1 รายการ', 'error');
      return;
    }
    params.class_id = classId;
    params.teacher_user_id = teacherId;
    params.subject_ids = subjectIds.join(',');
    btn = document.getElementById('bulkABtn');
  } else {
    var subjectId = document.getElementById('bulkBSubjectId').value;
    var teacherId2 = document.getElementById('bulkBTeacherId').value;
    var classSelect = document.getElementById('bulkBClassIds');
    var classIds = Array.from(classSelect.selectedOptions).map(function(o) { return o.value; });
    if (!subjectId || !teacherId2 || classIds.length === 0) {
      showToast('กรุณาเลือกวิชา ครู และชั้นเรียนอย่างน้อย 1 รายการ', 'error');
      return;
    }
    params.subject_id = subjectId;
    params.teacher_user_id = teacherId2;
    params.class_ids = classIds.join(',');
    btn = document.getElementById('bulkBBtn');
  }

  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';
  document.getElementById('bulkResult').classList.remove('show');

  var classIdArg = mode === 'A' ? params.class_id : '';
  var subjectIdArg = mode === 'B' ? params.subject_id : '';
  var classIdsArg = mode === 'B' ? params.class_ids : '';
  var subjectIdsArg = mode === 'A' ? params.subject_ids : '';

  google.script.run
    .withSuccessHandler(function(data) {
      btn.disabled = false;
      btn.textContent = 'กำหนดครู';
      if (data.error) { showToast(data.error, 'error'); return; }
      var msg = data.created + ' เพิ่มใหม่, ' + data.reassigned + ' เปลี่ยนครู, ' + data.unchanged + ' ไม่เปลี่ยน';
      var resultEl = document.getElementById('bulkResult');
      resultEl.textContent = msg;
      resultEl.classList.add('show');
      showToast('กำหนดครูแบบกลุ่มสำเร็จ', 'success');
      loadData();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false; btn.textContent = 'กำหนดครู';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .clientBulkAssign(TOKEN, params.mode, params.teacher_user_id, classIdArg, subjectIdArg, classIdsArg, subjectIdsArg);
}


// ---- Toast ----
var toastTimer = null;
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type || '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.className = ''; }, 3000);
}

// ---- Helpers ----
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s || '').replace(/"/g,'&quot;');
}
</script>

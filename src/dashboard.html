    .pair-link.formative { background: #fff8e1; color: #b8860b; border-color: rgba(184,134,11,0.15); }
    .pair-link.formative:hover { background: #fff0c2; }
    .pair-link.summative { background: #e8f0fe; color: var(--brand); border-color: rgba(26,86,160,0.15); }
    .pair-link.summative:hover { background: #d5e5f5; }
    .pair-link.characteristics { background: #f3e8fe; color: #7b2d9e; border-color: rgba(123,45,158,0.15); }

    .pair-link.readthinkwrite { background: #fef0e8; color: #c0392b; border-color: rgba(192,57,43,0.15); }
    .pair-link.readthinkwrite:hover { background: #fde0d0; }
    .pair-link.report { background: #e8f4ec; color: #1a7a4a; border-color: rgba(26,122,74,0.15); }
    .pair-link.report:hover { background: #d0e8d8; }
    .pair-link.students { background: #f5f5f5; color: #555; border-color: rgba(85,85,85,0.15); }

<script>
var TOKEN = '<?= data.token || '' ?>';
var ROLE = '<?= data.session ? data.session.role : "" ?>';
if (TOKEN) localStorage.setItem('popo_token', TOKEN);

<? if (data.session && data.session.role !== 'admin') { ?>
loadTeacherClasses();
<? } ?>

function loadTeacherClasses() {
  google.script.run
    .withSuccessHandler(function(result) {
      document.getElementById('teacherLoading').style.display = 'none';
      if (result && result.error) {
        document.getElementById('teacherPairs').innerHTML = '<p style="color:var(--red)">' + escHtml(result.error) + '</p>';
        return;
      }
      renderTeacherPairs(result.pairs || []);
    })
    .withFailureHandler(function(err) {
      document.getElementById('teacherLoading').style.display = 'none';
      document.getElementById('teacherPairs').innerHTML = '<p style="color:var(--red)">เกิดข้อผิดพลาด: ' + escHtml(err.message) + '</p>';
    })
    .clientGetTeacherOwnClasses(TOKEN);
}

function renderTeacherPairs(pairs) {
  if (pairs.length === 0) {
    document.getElementById('teacherPairs').innerHTML = '<p style="color:var(--text-muted)">ยังไม่มีรายวิชาที่สอน — กรุณาติดต่อผู้ดูแลระบบ</p>';
    return;
  }
  document.getElementById('teacherSection').style.display = 'block';
  var container = document.getElementById('teacherPairs');
  var html = '';
  pairs.forEach(function(p) {
    var cid = encodeURIComponent(p.class_id);
    var sid = encodeURIComponent(p.subject_id);
    html += '<div class="pair-card">' +
      '<div class="pair-card-header">' +
        '<h3>' + escHtml(p.class_label) + ' — ' + escHtml(p.subject_name) + '</h3>' +
        '<span class="student-count">' + p.student_count + ' คน</span>' +
      '</div>' +
      '<div class="pair-links">' +
        '<a class="pair-link students" href="#" onclick="goPage(\'class_students\',\'' + escAttr(p.class_id) + '\'); return false;">ข้อมูลนักเรียน</a>' +
        '<a class="pair-link attendance" href="#" onclick="goPage(\'class_attendance\',\'' + escAttr(p.class_id) + '\',\'' + escAttr(p.subject_id) + '\'); return false;">เช็คชื่อ</a>' +
        '<a class="pair-link formative" href="#" onclick="goPage(\'class_formative\',\'' + escAttr(p.class_id) + '\',\'' + escAttr(p.subject_id) + '\'); return false;">คะแนน1 ตัวชี้วัด</a>' +
        '<a class="pair-link summative" href="#" onclick="goPage(\'class_summative\',\'' + escAttr(p.class_id) + '\',\'' + escAttr(p.subject_id) + '\'); return false;">คะแนน2 ผลการเรียน</a>' +
        '<a class="pair-link characteristics" href="#" onclick="goPage(\'class_characteristics\',\'' + escAttr(p.class_id) + '\',\'' + escAttr(p.subject_id) + '\'); return false;">คุณลักษณะ</a>' +
        '<a class="pair-link readthinkwrite" href="#" onclick="goPage(\'class_readthinkwrite\',\'' + escAttr(p.class_id) + '\',\'' + escAttr(p.subject_id) + '\'); return false;">อ่านคิดเขียน</a>' +
        '<a class="pair-link report" href="#" onclick="goPage(\'class_report\',\'' + escAttr(p.class_id) + '\',\'' + escAttr(p.subject_id) + '\'); return false;">รายงานผลการเรียน</a>' +
      '</div>' +
    '</div>';
  });
  container.innerHTML = html;
}

function goPage(page, classId, subjectId) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { alert('เกิดข้อผิดพลาด: ' + err.message); })
    .getPageHtmlWithParams(TOKEN, page, classId || '', subjectId || '');
}

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { alert('เกิดข้อผิดพลาด: ' + err.message); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
</script>
</body>
</html>

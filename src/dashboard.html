        <a class="menu-item" href="#" onclick="navigate('admin_enrollments'); return false;">จัดการผู้สอน</a>

<script>
var TOKEN = '<?= data.token || '' ?>';
// Persist token to localStorage so it survives page refreshes
if (TOKEN) localStorage.setItem('popo_token', TOKEN);

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { alert('เกิดข้อผิดพลาด: ' + err.message); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}
</script>
</body>
</html>

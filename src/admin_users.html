<script>
var TOKEN = '<?= data.token || '' ?>';
var resetUserId = null;

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })

}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  var rows = [], row = [''], inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i], next = text[i + 1];
    if (c === '"') {
      if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) row.push('');
    else if ((c === '\r' || c === '\n') && !inQuotes) {
      if (c === '\r' && next === '\n') i++;
      rows.push(row); row = [''];
    } else row[row.length - 1] += c;
  }
  if (row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}

function normalizeCSVHeader(header) {
  return String(header || '').trim().replace(/\s*\*$/, '').trim();
}

function csvEscape(value) {
  var s = String(value == null ? '' : value);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCSVFile(filename, rows) {
  var csv = rows.map(function(row) { return row.map(csvEscape).join(','); }).join('\r\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

function downloadUsersCSVTemplate() {
  downloadCSVFile('users_import_template.csv', [
    ['user_id', 'username*', 'prefix', 'first_name*', 'last_name*', 'full_name', 'role*', 'initial_password*', 'must_change_pwd'],
    ['', 'teacher01', 'นาย', 'สมชาย', 'ใจดี', '', 'teacher', 'ChangeMe123', 'true'],
    ['', 'admin02', 'นางสาว', 'สมหญิง', 'ดูแลระบบ', '', 'admin', 'ChangeMe123', '']
  ]);
}

function importUsersCSV() {
  var input = document.getElementById('usersCsvInput');
  if (!input.files || input.files.length === 0) { showToast('กรุณาเลือกไฟล์ CSV', 'error'); return; }
  var btn = document.getElementById('importUsersCsvBtn');
  btn.disabled = true; btn.textContent = 'กำลังนำเข้า...';
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var csvRows = parseCSV(e.target.result);
      var headers = (csvRows[0] || []).map(normalizeCSVHeader);
      var idIdx = headers.indexOf('user_id');
      var usernameIdx = headers.indexOf('username');
      var prefixIdx = headers.indexOf('prefix');
      var firstIdx = headers.indexOf('first_name');
      var lastIdx = headers.indexOf('last_name');
      var fullIdx = headers.indexOf('full_name');
      var roleIdx = headers.indexOf('role');
      var passwordIdx = headers.indexOf('initial_password');
      var mustIdx = headers.indexOf('must_change_pwd');
      if (usernameIdx === -1 || roleIdx === -1 || (fullIdx === -1 && (firstIdx === -1 || lastIdx === -1))) {
        showToast('หัวตาราง CSV ไม่ถูกต้อง กรุณาใช้แม่แบบ CSV', 'error');
        btn.disabled = false; btn.textContent = 'นำเข้า CSV';
        return;
      }
      var rows = [];
      for (var i = 1; i < csvRows.length; i++) {
        var r = csvRows[i];
        var username = r[usernameIdx] ? r[usernameIdx].trim() : '';
        if (!username) continue;
        var fullName = fullIdx !== -1 && r[fullIdx] ? r[fullIdx].trim() : '';
        if (!fullName) {
          var prefix = prefixIdx !== -1 && r[prefixIdx] ? r[prefixIdx].trim() : '';
          var first = firstIdx !== -1 && r[firstIdx] ? r[firstIdx].trim() : '';
          var last = lastIdx !== -1 && r[lastIdx] ? r[lastIdx].trim() : '';
          fullName = ((prefix ? prefix : '') + first + ' ' + last).trim();
        }
        rows.push({
          user_id: idIdx !== -1 && r[idIdx] ? r[idIdx].trim() : '',
          username: username,
          full_name: fullName,
          role: r[roleIdx] || 'teacher',
          initial_password: passwordIdx !== -1 && r[passwordIdx] ? r[passwordIdx] : '',
          must_change_pwd: mustIdx !== -1 && r[mustIdx] ? r[mustIdx].trim() : ''
        });
      }
      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false; btn.textContent = 'นำเข้า CSV';
          if (result && result.error) { showToast(result.error, 'error'); return; }
          var msg = 'นำเข้า ' + result.success_count + ' รายการ (เพิ่มใหม่ ' + (result.created_count || 0) + ', อัปเดต ' + (result.updated_count || 0) + ')';
          if (result.warnings && result.warnings.length) msg += ' พบข้อควรระวัง ' + result.warnings.length + ' รายการ';
          showToast(msg, result.warnings && result.warnings.length ? 'error' : 'success');
          input.value = '';
          document.getElementById('usersLoading').style.display = 'block';
          document.getElementById('usersTable').style.display = 'none';
          loadUsers();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.textContent = 'นำเข้า CSV';
          showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
        })
        .serverImportUsersCSV(TOKEN, rows);
    } catch (err) {
      btn.disabled = false; btn.textContent = 'นำเข้า CSV';
      showToast('อ่านไฟล์ CSV ไม่สำเร็จ: ' + err.message, 'error');
    }
  };
  reader.onerror = function() {
    btn.disabled = false; btn.textContent = 'นำเข้า CSV';
    showToast('ไม่สามารถอ่านไฟล์ CSV ได้', 'error');
  };
  reader.readAsText(input.files[0], 'UTF-8');
}

function loadUsers() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      renderUsers((result && result.users) ? result.users : []);
    })
    .withFailureHandler(function(err) {
      showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    })
    .getUsersListForPage(TOKEN);
}

function renderUsers(users) {
  document.getElementById('usersLoading').style.display = 'none';
  var tbody = document.getElementById('usersBody');
  tbody.innerHTML = '';
  users.forEach(function(u) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-user-id', u.user_id);
    tr.setAttribute('data-username', u.username);
    tr.innerHTML =
      '<td>' + escHtml(u.username) + '</td>' +
      '<td>' + escHtml(u.full_name) + '</td>' +
      '<td><span class="role-badge ' + u.role + '">' + (u.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ครู') + '</span></td>' +
      '<td><button class="btn-secondary" onclick="openEditModal(\'' + escHtml(u.user_id) + '\', \'' + escHtml(u.username) + '\', \'' + escHtml(u.full_name) + '\', \'' + escHtml(u.role) + '\')" style="margin-right:6px;font-size:12px;padding:5px 12px">แก้ไข</button> ' +
      '<button class="btn-secondary" onclick="openResetModal(\'' + escHtml(u.user_id) + '\', \'' + escHtml(u.full_name) + '\')" style="margin-right:6px;font-size:12px;padding:5px 12px">รีเซตรหัสผ่าน</button> ' +
      '<button class="btn-danger" onclick="deleteUser(\'' + escHtml(u.user_id) + '\', \'' + escHtml(u.full_name) + '\')" style="font-size:12px;padding:5px 12px">ลบ</button></td>';
    tbody.appendChild(tr);
  });
  document.getElementById('usersTable').style.display = 'table';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function addUser() {
  var username = document.getElementById('newUsername').value.trim();
  var prefix = document.getElementById('newPrefix').value.trim();
  var firstName = document.getElementById('newFirstName').value.trim();
  var lastName = document.getElementById('newLastName').value.trim();
  var full_name = ((prefix ? prefix : '') + firstName + ' ' + lastName).trim();
  var role = document.getElementById('newRole').value;
  var password = document.getElementById('newPassword').value;

  if (!username || !firstName || !lastName || !password) {
    showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
    return;
  }

  var btn = document.getElementById('addUserBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มผู้ใช้ ' + username + ' สำเร็จ', 'success');
      document.getElementById('newUsername').value = '';
      document.getElementById('newPrefix').value = '';
      document.getElementById('newFirstName').value = '';
      document.getElementById('newLastName').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('usersLoading').style.display = 'block';
      document.getElementById('usersTable').style.display = 'none';
      loadUsers();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddUser(username, full_name, role, password);
}

function openResetModal(userId, fullName) {
  resetUserId = userId;
  document.getElementById('resetTargetName').textContent = fullName;
  document.getElementById('resetNewPwd').value = '';
  document.getElementById('resetModal').classList.add('open');
  document.getElementById('confirmResetBtn').disabled = false;
}

function closeResetModal() {
  resetUserId = null;
  document.getElementById('resetModal').classList.remove('open');
}

function confirmReset() {
  var newPwd = document.getElementById('resetNewPwd').value;
  if (!newPwd) { showToast('กรุณากรอกรหัสผ่านใหม่', 'error'); return; }

  var btn = document.getElementById('confirmResetBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('รีเซตรหัสผ่านสำเร็จ', 'success');
      closeResetModal();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverResetPassword(resetUserId, newPwd);
}

function openEditModal(userId, username, fullName, role) {
  editUserId = userId;
  document.getElementById('editTargetUsername').textContent = username;
  document.getElementById('editRole').value = role;
  var knownPrefixes = ['เด็กชาย','เด็กหญิง','นาย','นาง','นางสาว'];
  var prefix = '', firstName = '', lastName = '';
  var found = false;
  for (var i = 0; i < knownPrefixes.length; i++) {
    if (fullName.indexOf(knownPrefixes[i]) === 0) {
      prefix = knownPrefixes[i];
      var rest = fullName.substring(knownPrefixes[i].length);
      var parts = rest.trim().split(/\s+/);
      firstName = parts[0] || '';
      lastName = parts.slice(1).join(' ');
      found = true;
      break;
    }
  }
  if (!found) {
    var parts = fullName.trim().split(/\s+/);
    firstName = parts[0] || '';
    lastName = parts.slice(1).join(' ');
  }
  document.getElementById('editPrefix').value = prefix;
  document.getElementById('editFirstName').value = firstName;
  document.getElementById('editLastName').value = lastName;
  document.getElementById('editModal').classList.add('open');
  document.getElementById('confirmEditBtn').disabled = false;
}

function closeEditModal() {
  editUserId = null;
  document.getElementById('editModal').classList.remove('open');
}

function confirmEdit() {
  var prefix = document.getElementById('editPrefix').value.trim();
  var firstName = document.getElementById('editFirstName').value.trim();
  var lastName = document.getElementById('editLastName').value.trim();
  var fullName = ((prefix ? prefix : '') + firstName + ' ' + lastName).trim();
  var role = document.getElementById('editRole').value;
  if (!firstName || !lastName) { showToast('กรุณากรอกชื่อและนามสกุล', 'error'); return; }

  var btn = document.getElementById('confirmEditBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('แก้ไขข้อมูลผู้ใช้สำเร็จ', 'success');
      closeEditModal();
      document.getElementById('usersLoading').style.display = 'block';
      document.getElementById('usersTable').style.display = 'none';
      loadUsers();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverEditUser(editUserId, fullName, role);
}

function deleteUser(userId, fullName) {
  if (!confirm('ยืนยันการลบผู้ใช้ "' + fullName + '"?')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('ลบผู้ใช้สำเร็จ', 'success');
      document.getElementById('usersLoading').style.display = 'block';
      document.getElementById('usersTable').style.display = 'none';
      loadUsers();
    })
    .withFailureHandler(function(err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverDeleteUser(TOKEN, userId);
}

// Load users on page open
loadUsers();

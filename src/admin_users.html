<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการผู้ใช้ — PopoWebApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f5f5f5; color: #333; }
    .navbar { background: #1a56a0; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .navbar-title { font-size: 18px; font-weight: bold; }
    .navbar a { color: white; text-decoration: none; font-size: 14px; cursor: pointer; }
    .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
    h2 { font-size: 20px; color: #1a56a0; margin-bottom: 20px; }

    /* Add user card */
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { font-size: 15px; color: #444; margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
    .form-group label { font-size: 12px; color: #555; }
    input[type="text"], input[type="password"], select {
      padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 13px; font-family: inherit; min-width: 140px;
    }
    input:focus, select:focus { outline: none; border-color: #1a56a0; }
    button {
      padding: 8px 18px; border: none; border-radius: 4px; font-size: 13px;
      font-family: inherit; cursor: pointer;
    }
    .btn-primary { background: #1a56a0; color: white; }
    .btn-primary:hover { background: #154880; }
    .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
    .btn-secondary { background: #e9f0fa; color: #1a56a0; border: 1px solid #b3ccee; }
    .btn-secondary:hover { background: #dae6f8; }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed; top: 20px; right: 20px; padding: 12px 20px;
      border-radius: 6px; font-size: 14px; z-index: 1000;
      display: none; max-width: 320px;
    }
    .toast.success { background: #27ae60; color: white; }
    .toast.error { background: #c0392b; color: white; }

    /* User table */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f0f4fa; padding: 10px 12px; text-align: left; border-bottom: 2px solid #ddd; }
    td { padding: 10px 12px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #fafcff; }

    /* Reset password modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 500;
    }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 8px; padding: 28px; width: 360px; }
    .modal h3 { font-size: 16px; margin-bottom: 16px; color: #1a56a0; }
    .modal .form-group { margin-bottom: 12px; width: 100%; }
    .modal .form-group input { width: 100%; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }

    .role-badge {
      padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;
    }
    .role-badge.admin { background: #e8f4fd; color: #1a56a0; }
    .role-badge.teacher { background: #eafaf1; color: #27ae60; }

    .loading-msg { color: #888; font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>
<div class="navbar">
  <span class="navbar-title">PopoWebApp</span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <a href="#" onclick="navigate('admin_enrollments')">จัดการผู้สอน</a>
  <span style="margin-left:auto;font-size:13px"><?= data.session ? data.session.full_name : '' ?></span>
</div>

<div class="container">
  <h2 id="pageHeading">จัดการผู้ใช้</h2>

  <!-- Add user form -->
  <div class="card">
    <h3>เพิ่มผู้ใช้ใหม่</h3>
    <div class="form-row">
      <div class="form-group">
        <label>ชื่อผู้ใช้ (username)</label>
        <input type="text" id="newUsername" placeholder="username">
      </div>
      <div class="form-group">
        <label>ชื่อ-สกุล</label>
        <input type="text" id="newFullName" placeholder="ชื่อ-สกุล">
      </div>
      <div class="form-group">
        <label>บทบาท</label>
        <select id="newRole">
          <option value="teacher">ครู</option>
          <option value="admin">ผู้ดูแลระบบ</option>
        </select>
      </div>
      <div class="form-group">
        <label>รหัสผ่านเริ่มต้น</label>
        <input type="password" id="newPassword" placeholder="รหัสผ่าน">
      </div>
      <div class="form-group" style="justify-content:flex-end">
        <button class="btn-primary" id="addUserBtn" onclick="addUser()">เพิ่มผู้ใช้</button>
      </div>
    </div>
  </div>

  <!-- User list -->
  <div class="card">
    <h3>รายชื่อผู้ใช้ทั้งหมด</h3>
    <p class="loading-msg" id="usersLoading">กำลังโหลด...</p>
    <table id="usersTable" style="display:none">
      <thead>
        <tr>
          <th>ชื่อผู้ใช้</th>
          <th>ชื่อ-สกุล</th>
          <th>บทบาท</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<!-- Reset password modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>รีเซตรหัสผ่าน — <span id="resetTargetName"></span></h3>
    <div class="form-group">
      <label>รหัสผ่านใหม่</label>
      <input type="password" id="resetNewPwd" placeholder="รหัสผ่านใหม่">
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="confirmResetBtn" onclick="confirmReset()">บันทึก</button>
      <button class="btn-secondary" onclick="closeResetModal()">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var resetUserId = null;

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function loadUsers() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      renderUsers((result && result.users) ? result.users : []);
    })
    .withFailureHandler(function(err) {
      showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    })
    .getUsersListForPage(TOKEN);
}

function renderUsers(users) {
  document.getElementById('usersLoading').style.display = 'none';
  var tbody = document.getElementById('usersBody');
  tbody.innerHTML = '';
  users.forEach(function(u) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-user-id', u.user_id);
    tr.setAttribute('data-username', u.username);
    tr.innerHTML =
      '<td>' + escHtml(u.username) + '</td>' +
      '<td>' + escHtml(u.full_name) + '</td>' +
      '<td><span class="role-badge ' + u.role + '">' + (u.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ครู') + '</span></td>' +
      '<td><button class="btn-secondary" onclick="openResetModal(\'' + escHtml(u.user_id) + '\', \'' + escHtml(u.full_name) + '\')">รีเซตรหัสผ่าน</button></td>';
    tbody.appendChild(tr);
  });
  document.getElementById('usersTable').style.display = 'table';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function addUser() {
  var username = document.getElementById('newUsername').value.trim();
  var full_name = document.getElementById('newFullName').value.trim();
  var role = document.getElementById('newRole').value;
  var password = document.getElementById('newPassword').value;

  if (!username || !full_name || !password) {
    showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
    return;
  }

  var btn = document.getElementById('addUserBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มผู้ใช้ ' + username + ' สำเร็จ', 'success');
      document.getElementById('newUsername').value = '';
      document.getElementById('newFullName').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('usersLoading').style.display = 'block';
      document.getElementById('usersTable').style.display = 'none';
      loadUsers();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddUser(username, full_name, role, password);
}

function openResetModal(userId, fullName) {
  resetUserId = userId;
  document.getElementById('resetTargetName').textContent = fullName;
  document.getElementById('resetNewPwd').value = '';
  document.getElementById('resetModal').classList.add('open');
  document.getElementById('confirmResetBtn').disabled = false;
}

function closeResetModal() {
  resetUserId = null;
  document.getElementById('resetModal').classList.remove('open');
}

function confirmReset() {
  var newPwd = document.getElementById('resetNewPwd').value;
  if (!newPwd) { showToast('กรุณากรอกรหัสผ่านใหม่', 'error'); return; }

  var btn = document.getElementById('confirmResetBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('รีเซตรหัสผ่านสำเร็จ', 'success');
      closeResetModal();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverResetPassword(resetUserId, newPwd);
}

// Load users on page open
loadUsers();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการผู้ใช้ — PopoWebApp</title>
  <?!= include('_styles') ?>
</head>
<body>
<div class="navbar">
  <span class="navbar-title">PopoWebApp</span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <a href="#" onclick="navigate('admin_enrollments')">จัดการผู้สอน</a>
  <div class="navbar-user">
    <span><?= data.session ? data.session.full_name : '' ?></span>
    <button id="logoutBtn" class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
  </div>
</div>

<div class="container">
  <h2 class="page-title">จัดการผู้ใช้</h2>

  <!-- Add user form -->
  <div class="card">
    <h3>เพิ่มผู้ใช้ใหม่</h3>
    <div class="form-row">
      <div class="form-group">
        <label>ชื่อผู้ใช้ (username)</label>
        <input type="text" id="newUsername" placeholder="username">
      </div>
      <div class="form-group">
        <label>ชื่อ-สกุล</label>
        <input type="text" id="newFullName" placeholder="ชื่อ-สกุล">
      </div>
      <div class="form-group">
        <label>บทบาท</label>
        <select id="newRole">
          <option value="teacher">ครู</option>
          <option value="admin">ผู้ดูแลระบบ</option>
        </select>
      </div>
      <div class="form-group">
        <label>รหัสผ่านเริ่มต้น</label>
        <input type="password" id="newPassword" placeholder="รหัสผ่าน">
      </div>
      <div class="form-group" style="justify-content:flex-end">
        <button class="btn-primary" id="addUserBtn" onclick="addUser()">เพิ่มผู้ใช้</button>
      </div>
    </div>
  </div>

  <!-- User list -->
  <div class="card">
    <h3>รายชื่อผู้ใช้ทั้งหมด</h3>
    <div class="loading-msg" id="usersLoading">
      <div class="skeleton-table">
        <div class="skeleton-table-row skeleton-table-head"><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:35%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:35%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:35%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:35%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:35%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
      </div>
    </div>
    <table id="usersTable" style="display:none">
      <thead>
        <tr>
          <th>ชื่อผู้ใช้</th>
          <th>ชื่อ-สกุล</th>
          <th>บทบาท</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<!-- Edit user modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>แก้ไขผู้ใช้ — <span id="editTargetUsername"></span></h3>
    <div class="form-group">
      <label>ชื่อ-สกุล</label>
      <input type="text" id="editFullName" placeholder="ชื่อ-สกุล">
    </div>
    <div class="form-group">
      <label>บทบาท</label>
      <select id="editRole">
        <option value="teacher">ครู</option>
        <option value="admin">ผู้ดูแลระบบ</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="confirmEditBtn" onclick="confirmEdit()">บันทึก</button>
      <button class="btn-secondary" onclick="closeEditModal()">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- Reset password modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>รีเซตรหัสผ่าน — <span id="resetTargetName"></span></h3>
    <div class="form-group">
      <label>รหัสผ่านใหม่</label>
      <input type="password" id="resetNewPwd" placeholder="รหัสผ่านใหม่">
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="confirmResetBtn" onclick="confirmReset()">บันทึก</button>
      <button class="btn-secondary" onclick="closeResetModal()">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var resetUserId = null;
var editUserId = null;

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function loadUsers() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      renderUsers((result && result.users) ? result.users : []);
    })
    .withFailureHandler(function(err) {
      showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    })
    .getUsersListForPage(TOKEN);
}

function renderUsers(users) {
  document.getElementById('usersLoading').style.display = 'none';
  var tbody = document.getElementById('usersBody');
  tbody.innerHTML = '';
  users.forEach(function(u) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-user-id', u.user_id);
    tr.setAttribute('data-username', u.username);
    tr.innerHTML =
      '<td>' + escHtml(u.username) + '</td>' +
      '<td>' + escHtml(u.full_name) + '</td>' +
      '<td><span class="role-badge ' + u.role + '">' + (u.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ครู') + '</span></td>' +
      '<td><button class="btn-secondary" onclick="openEditModal(\'' + escHtml(u.user_id) + '\', \'' + escHtml(u.username) + '\', \'' + escHtml(u.full_name) + '\', \'' + escHtml(u.role) + '\')">แก้ไข</button> ' +
      '<button class="btn-secondary" onclick="openResetModal(\'' + escHtml(u.user_id) + '\', \'' + escHtml(u.full_name) + '\')">รีเซตรหัสผ่าน</button></td>';
    tbody.appendChild(tr);
  });
  document.getElementById('usersTable').style.display = 'table';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function addUser() {
  var username = document.getElementById('newUsername').value.trim();
  var full_name = document.getElementById('newFullName').value.trim();
  var role = document.getElementById('newRole').value;
  var password = document.getElementById('newPassword').value;

  if (!username || !full_name || !password) {
    showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
    return;
  }

  var btn = document.getElementById('addUserBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มผู้ใช้ ' + username + ' สำเร็จ', 'success');
      document.getElementById('newUsername').value = '';
      document.getElementById('newFullName').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('usersLoading').style.display = 'block';
      document.getElementById('usersTable').style.display = 'none';
      loadUsers();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddUser(username, full_name, role, password);
}

function openResetModal(userId, fullName) {
  resetUserId = userId;
  document.getElementById('resetTargetName').textContent = fullName;
  document.getElementById('resetNewPwd').value = '';
  document.getElementById('resetModal').classList.add('open');
  document.getElementById('confirmResetBtn').disabled = false;
}

function closeResetModal() {
  resetUserId = null;
  document.getElementById('resetModal').classList.remove('open');
}

function confirmReset() {
  var newPwd = document.getElementById('resetNewPwd').value;
  if (!newPwd) { showToast('กรุณากรอกรหัสผ่านใหม่', 'error'); return; }

  var btn = document.getElementById('confirmResetBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('รีเซตรหัสผ่านสำเร็จ', 'success');
      closeResetModal();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverResetPassword(resetUserId, newPwd);
}

function openEditModal(userId, username, fullName, role) {
  editUserId = userId;
  document.getElementById('editTargetUsername').textContent = username;
  document.getElementById('editFullName').value = fullName;
  document.getElementById('editRole').value = role;
  document.getElementById('editModal').classList.add('open');
  document.getElementById('confirmEditBtn').disabled = false;
}

function closeEditModal() {
  editUserId = null;
  document.getElementById('editModal').classList.remove('open');
}

function confirmEdit() {
  var fullName = document.getElementById('editFullName').value.trim();
  var role = document.getElementById('editRole').value;
  if (!fullName) { showToast('กรุณากรอกชื่อ-สกุล', 'error'); return; }

  var btn = document.getElementById('confirmEditBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.error) { showToast(result.error, 'error'); return; }
      showToast('แก้ไขข้อมูลผู้ใช้สำเร็จ', 'success');
      closeEditModal();
      document.getElementById('usersLoading').style.display = 'block';
      document.getElementById('usersTable').style.display = 'none';
      loadUsers();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverEditUser(editUserId, fullName, role);
}

// Load users on page open
loadUsers();
</script>
</body>
</html>

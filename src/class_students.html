<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทะเบียนนักเรียน — PopoWebApp</title>
  <?!= include('_styles') ?>
  <style>
    .edit-field { width: 100%; padding: 4px 6px; border: 1.5px solid var(--brand); border-radius: 3px; font-size: 12px; font-family: inherit; }
    .action-btns { display: flex; gap: 4px; }
    .btn-secondary { background: #6c757d; color: white; border: none; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-save { background: var(--green); color: white; font-size: 12px; padding: 5px 12px; border: none; }
    .btn-save:hover { background: var(--green-dark); }
  </style>
</head>
<body>
<div class="navbar">
  <span class="navbar-title">PopoWebApp</span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <?!= data.session && data.session.role === 'admin' ? '<a href="#" onclick="navigate(\'admin_classes\')">ชั้นเรียน</a>' : '' ?>
  <div class="navbar-user">
    <span><?= data.session ? data.session.full_name : '' ?></span>
    <button id="logoutBtn" class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
  </div>
</div>

<div class="container">
  <h2 id="pageHeading">ทะเบียนนักเรียน</h2>

  <div id="addCard" class="card" style="display:none">
    <h3>เพิ่มนักเรียน</h3>
    <div class="form-row">
      <div class="form-group" style="min-width:60px">
        <label>เลขที่</label>
        <input type="number" id="newSeqNo" min="1" placeholder="1">
      </div>
      <div class="form-group" style="min-width:110px">
        <label>เลขประจำตัว</label>
        <input type="text" id="newStudentCode" placeholder="รหัสนักเรียน">
      </div>
      <div class="form-group" style="min-width:140px">
        <label>เลขประจำตัวประชาชน</label>
        <input type="text" id="newCitizenId" placeholder="13 หลัก" maxlength="13">
      </div>
      <div class="form-group" style="min-width:200px">
        <label>ชื่อ-สกุล</label>
        <input type="text" id="newFullName" placeholder="ชื่อ นามสกุล">
      </div>
      <div class="form-group" style="min-width:110px">
        <label>วันเกิด</label>
        <input type="text" id="newDob" placeholder="01 ม.ค. 60">
      </div>
      <div class="form-group" style="min-width:120px">
        <label>หมายเหตุ</label>
        <input type="text" id="newNote" placeholder="">
      </div>
      <div class="form-group" style="justify-content:flex-end">
        <button class="btn-primary" id="addStudentBtn" onclick="addStudent()">เพิ่มนักเรียน</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 id="tableHeading">รายชื่อนักเรียน</h3>
    <div id="readonlyNotice" class="readonly-notice" style="display:none">คุณมีสิทธิ์อ่านอย่างเดียว — เฉพาะครูประจำชั้นหรือผู้ดูแลระบบแก้ไขได้</div>
    <div class="loading-msg" id="studentsLoading">
      <div class="skeleton-table">
        <div class="skeleton-table-row skeleton-table-head"><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:17%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:17%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:17%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:17%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:17%"></div></div>
      </div>
    </div>
    <table id="studentsTable" style="display:none">
      <thead>
        <tr>
          <th>เลขที่</th>
          <th>เลขประจำตัว</th>
          <th>เลขประจำตัวประชาชน</th>
          <th>ชื่อ-สกุล</th>
          <th>วันเกิด</th>
          <th>หมายเหตุ</th>
          <th id="actionHeader"></th>
        </tr>
      </thead>
      <tbody id="studentsBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var CLASS_ID = '<?!= data.class_id || '' ?>';
var CAN_EDIT = false;

function navigate(page, extra) {
  showNavLoading();
  var args = [TOKEN, page];
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadStudents() {
  if (!CLASS_ID) {
    document.getElementById('studentsLoading').textContent = 'ไม่พบรหัสชั้นเรียน — กรุณาเข้าผ่านเมนูชั้นเรียน';
    return;
  }
  document.getElementById('studentsLoading').style.display = 'block';
  document.getElementById('studentsTable').style.display = 'none';
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) {
        document.getElementById('studentsLoading').style.display = 'none';
        showToast(result.error, 'error');
        return;
      }
      CAN_EDIT = result.can_edit === true;
      var info = result.class_info || {};
      document.getElementById('pageHeading').textContent =
        'ทะเบียนนักเรียน — ' + escHtml(info.level || '') + '/' + escHtml(info.section || '') +
        ' (' + escHtml(CLASS_ID) + ')';
      document.getElementById('tableHeading').textContent =
        'รายชื่อนักเรียน (' + (result.students || []).length + ' คน)';
      if (CAN_EDIT) {
        document.getElementById('addCard').style.display = 'block';
        document.getElementById('actionHeader').textContent = 'จัดการ';
        document.getElementById('readonlyNotice').style.display = 'none';
      } else {
        document.getElementById('addCard').style.display = 'none';
        document.getElementById('actionHeader').textContent = '';
        document.getElementById('readonlyNotice').style.display = 'block';
      }
      renderStudents(result.students || []);
    })
    .withFailureHandler(function(err) {
      document.getElementById('studentsLoading').style.display = 'none';
      showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    })
    .getStudentsList(TOKEN, CLASS_ID);
}

function renderStudents(students) {
  document.getElementById('studentsLoading').style.display = 'none';
  var tbody = document.getElementById('studentsBody');
  tbody.innerHTML = '';
  students.forEach(function(s) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-student-id', s.student_id);
    var actionCell = CAN_EDIT
      ? '<td><div class="action-btns">' +
          '<button class="btn-secondary" onclick="startEdit(\'' + escHtml(s.student_id) + '\')">แก้ไข</button>' +
          '<button class="btn-danger" onclick="deleteStudent(\'' + escHtml(s.student_id) + '\')">ลบ</button>' +
        '</div></td>'
      : '<td></td>';
    tr.innerHTML =
      '<td class="cell-seq_no">' + escHtml(s.seq_no) + '</td>' +
      '<td class="cell-student_code">' + escHtml(s.student_code) + '</td>' +
      '<td class="cell-citizen_id">' + escHtml(s.citizen_id) + '</td>' +
      '<td class="cell-full_name">' + escHtml(s.full_name) + '</td>' +
      '<td class="cell-dob">' + escHtml(s.dob) + '</td>' +
      '<td class="cell-note">' + escHtml(s.note) + '</td>' +
      actionCell;
    tbody.appendChild(tr);
  });
  document.getElementById('studentsTable').style.display = 'table';
}

function startEdit(student_id) {
  var tr = document.querySelector('tr[data-student-id="' + student_id + '"]');
  if (!tr) return;
  var fields = ['seq_no','student_code','citizen_id','full_name','dob','note'];
  fields.forEach(function(f) {
    var td = tr.querySelector('.cell-' + f);
    var val = td.textContent;
    td.innerHTML = '<input class="edit-field" data-field="' + f + '" value="' + escHtml(val) + '">';
  });
  var actionDiv = tr.querySelector('.action-btns');
  actionDiv.innerHTML =
    '<button class="btn-save" onclick="saveEdit(\'' + escHtml(student_id) + '\')">บันทึก</button>' +
    '<button class="btn-secondary" onclick="cancelEdit(\'' + escHtml(student_id) + '\')">ยกเลิก</button>';
}

function cancelEdit(student_id) {
  loadStudents();
}

function saveEdit(student_id) {
  var tr = document.querySelector('tr[data-student-id="' + student_id + '"]');
  if (!tr) return;
  var get = function(f) {
    var inp = tr.querySelector('input[data-field="' + f + '"]');
    return inp ? inp.value : '';
  };
  var btn = tr.querySelector('.btn-save');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); if (btn) btn.disabled = false; return; }
      showToast('บันทึกข้อมูลนักเรียนสำเร็จ', 'success');
      loadStudents();
    })
    .withFailureHandler(function(err) {
      if (btn) btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverUpdateStudent(TOKEN, student_id,
      get('seq_no'), get('student_code'), get('citizen_id'),
      get('full_name'), get('dob'), get('note'));
}

function addStudent() {
  var seq_no = document.getElementById('newSeqNo').value.trim();
  var student_code = document.getElementById('newStudentCode').value.trim();
  var citizen_id = document.getElementById('newCitizenId').value.trim();
  var full_name = document.getElementById('newFullName').value.trim();
  var dob = document.getElementById('newDob').value.trim();
  var note = document.getElementById('newNote').value.trim();

  if (!full_name) { showToast('กรุณากรอกชื่อ-สกุล', 'error'); return; }

  var btn = document.getElementById('addStudentBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มนักเรียนสำเร็จ', 'success');
      document.getElementById('newSeqNo').value = '';
      document.getElementById('newStudentCode').value = '';
      document.getElementById('newCitizenId').value = '';
      document.getElementById('newFullName').value = '';
      document.getElementById('newDob').value = '';
      document.getElementById('newNote').value = '';
      loadStudents();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddStudent(TOKEN, CLASS_ID, seq_no, student_code, citizen_id, full_name, dob, note);
}

function deleteStudent(student_id) {
  if (!confirm('ยืนยันการลบนักเรียนนี้?')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('ลบนักเรียนสำเร็จ', 'success');
      loadStudents();
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .serverDeleteStudent(TOKEN, student_id);
}

loadStudents();
</script>
</body>
</html>

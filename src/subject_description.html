<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดวิชา — PopoWebApp</title>
  <?!= include('_styles') ?>
  <style>
    .field-row { display: flex; gap: 12px; margin-bottom: 12px; font-size: 14px; }
    .field-label { color: var(--text-muted); min-width: 120px; }
    .field-value { color: var(--text); flex: 1; font-weight: 500; }
    .description-box { background: #f9fafb; border-radius: var(--radius-sm); padding: 16px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; min-height: 80px; border: 1px solid var(--border); }
  </style>
</head>
<body>
<div class="navbar">
  <span class="navbar-title">PopoWebApp</span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <a href="#" onclick="navigate('help')">คู่มือ</a>
  <div class="navbar-user">
  <div class="navbar-user-trigger">
          <div class="navbar-avatar-placeholder"><?= data.session ? data.session.full_name.charAt(0) : '' ?></div>
          <span><?= data.session ? data.session.full_name : '' ?><?= data.session && data.session.role === 'admin' ? ' (admin)' : '' ?></span>
        </div>
  <div class="navbar-dropdown">
    <a href="#" onclick="navigate('profile_edit'); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> แก้ไขโปรไฟล์</a>
    <div class="dropdown-divider"></div>
    <a href="#" onclick="doLogout(); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> ออกจากระบบ</a>
  </div>
  </div>
</div>

<div class="container">
  <h2 id="pageHeading">รายละเอียดวิชา</h2>

  <div class="card" id="subjectCard">
    <div class="loading-msg" id="loadingMsg">
      <div class="skeleton-block" style="width:60%"></div>
      <div class="skeleton-block" style="width:40%"></div>
      <div class="skeleton-block" style="width:50%"></div>
      <div class="skeleton-block" style="width:100%;height:80px"></div>
    </div>
    <div id="subjectContent" style="display:none">
      <div class="field-row">
        <span class="field-label">ชื่อวิชา</span>
        <span class="field-value" id="subjectName">—</span>
      </div>
      <div class="field-row">
        <span class="field-label">รหัสวิชา</span>
        <span class="field-value" id="subjectCode">—</span>
      </div>
      <div class="field-row">
        <span class="field-label">เวลาเรียน</span>
        <span class="field-value" id="subjectHours">—</span>
      </div>
      <div class="field-row">
        <span class="field-label">กลุ่มวิชา</span>
        <span class="field-value" id="subjectGroup">—</span>
      </div>
      <div class="field-row" style="flex-direction:column;gap:6px">
        <span class="field-label">คำอธิบายรายวิชา</span>
        <div class="description-box" id="subjectDescription">—</div>
      </div>
    </div>
  </div>
</div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var SUBJECT_ID = '<?!= data.subject_id || '' ?>';

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); alert('เกิดข้อผิดพลาด: ' + err.message); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadSubject() {
  if (!SUBJECT_ID) {
    document.getElementById('loadingMsg').textContent = 'ไม่พบรหัสวิชา';
    return;
  }
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.error) {
        document.getElementById('loadingMsg').textContent = result ? result.error : 'เกิดข้อผิดพลาด';
        return;
      }
      var s = result.subject;
      if (!s) { document.getElementById('loadingMsg').textContent = 'ไม่พบวิชานี้'; return; }
      document.getElementById('subjectName').textContent = s.subject_name || '—';
      document.getElementById('subjectCode').textContent = s.subject_code || '—';
      document.getElementById('subjectHours').textContent = s.hours_per_year ? (s.hours_per_year + ' ชั่วโมง/ปี') : '—';
      document.getElementById('subjectGroup').textContent = s.weight_group ? ('กลุ่ม ' + s.weight_group) : '—';
      document.getElementById('subjectDescription').textContent = s.description || '(ยังไม่มีคำอธิบายรายวิชา)';
      document.getElementById('pageHeading').textContent = 'รายละเอียดวิชา — ' + (s.subject_name || '');
      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('subjectContent').style.display = 'block';
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingMsg').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + err.message;
    })
    .getSubjectDescription(TOKEN, SUBJECT_ID);
}

loadSubject();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กิจกรรมพัฒนาผู้เรียน — PopoWebApp</title>
  <?!= include('_styles') ?>
</head>
<body class="page-class-dev-activity">
<div class="navbar">
  <span class="navbar-title"><div class="navbar-title-skeleton"><div class="skeleton-line-main"></div><div class="skeleton-line-sub"></div></div></span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <div class="navbar-user">
    <div class="navbar-user-trigger"><div class="navbar-user-skeleton"><div class="skeleton-avatar"></div><div class="skeleton-name"></div></div></div>
    <div class="navbar-dropdown">
      <a href="#" onclick="navigate('profile_edit'); return false;">แก้ไขโปรไฟล์</a>
      <div class="dropdown-divider"></div>
      <a href="#" onclick="doLogout(); return false;">ออกจากระบบ</a>
    </div>
  </div>
</div>

<div class="container wide">
  <h2 class="page-title" id="pageHeading">กิจกรรมพัฒนาผู้เรียน</h2>
  <div id="readonlyNotice" class="readonly-notice" style="display:none">คุณมีสิทธิ์อ่านอย่างเดียว — เฉพาะครูผู้สอนหรือผู้ดูแลระบบแก้ไขได้</div>
  <div class="card">
    <div class="loading-msg" id="loadingMsg">กำลังโหลด...</div>
    <table id="devTable" style="display:none">
      <thead id="devHead"></thead>
      <tbody id="devBody"></tbody>
    </table>
  </div>
  <div class="save-bar" id="saveBar" style="display:none">
    <button class="btn-save" id="saveBtn" onclick="saveDevActivity()">บันทึกผลกิจกรรม</button>
    <span id="saveStatus" style="font-size:13px;color:#888"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var CLASS_ID = '<?!= data.class_id || '' ?>';
var SUBJECT_ID = '<?!= data.subject_id || '' ?>';
var currentData = null;

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  localStorage.removeItem('popo_token');
  location.reload();
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadDevActivity() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('devTable').style.display = 'none';
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      currentData = result;
      renderDevActivity(result);
    })
    .withFailureHandler(function(err) { showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error'); })
    .getReportData(TOKEN, CLASS_ID, SUBJECT_ID);
}

function renderDevActivity(data) {
  document.getElementById('loadingMsg').style.display = 'none';
  var cls = data.class_info || {};
  var subj = data.subject_info || {};
  document.getElementById('pageHeading').textContent =
    'กิจกรรมพัฒนาผู้เรียน — ' + (cls.class_label || fmtCls(cls.level, cls.section)) + ' — ' + (subj.subject_name || '');
  document.getElementById('readonlyNotice').style.display = data.can_edit ? 'none' : 'block';
  document.getElementById('saveBar').style.display = data.can_edit ? 'flex' : 'none';
  document.getElementById('devHead').innerHTML = data.can_edit
    ? '<tr><th style="width:54px">ที่</th><th class="name-col student-name-col">ชื่อ-สกุล</th><th>ผลการประเมิน<br>' + getColumnFillSelectHtml() + '</th></tr>'
    : '<tr><th style="width:54px">ที่</th><th class="name-col student-name-col">ชื่อ-สกุล</th><th>ผลการประเมิน</th></tr>';
  var body = document.getElementById('devBody');
  body.innerHTML = '';
  (data.dev_students || []).forEach(function(student) {
    var resultHtml = data.can_edit
      ? '<select class="dev-result-select" data-student="' + escHtml(student.student_id) + '">' +
          '<option value=""></option>' +
          ['ผ่าน','ไม่ผ่าน','ร','มส'].map(function(opt) {
            return '<option value="' + escHtml(opt) + '"' + (student.result === opt ? ' selected' : '') + '>' + escHtml(opt) + '</option>';
          }).join('') +
        '</select>'
      : escHtml(student.result || '-');
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + escHtml(student.seq_no) + '</td><td class="name-col student-name-col">' + escHtml(student.full_name) + '</td><td class="dev-result-cell">' + resultHtml + '</td>';
    body.appendChild(tr);
  });
  document.getElementById('devTable').style.display = 'table';
}

function normalizeDevActivityResult(value) {
  var result = String(value || '').trim();
  var allowed = ['', 'ผ่าน', 'ไม่ผ่าน', 'ร', 'มส'];
  return allowed.indexOf(result) >= 0 ? result : null;
}

function getColumnFillSelectHtml() {
  return '<select class="column-fill-select" onchange="fillDevActivityColumn(this)">' +
    '<option value="__noop">ใส่ทั้งคอลัมน์...</option>' +
    '<option value="">ว่าง</option>' +
    ['ผ่าน','ไม่ผ่าน','ร','มส'].map(function(opt) {
      return '<option value="' + escHtml(opt) + '">' + escHtml(opt) + '</option>';
    }).join('') +
  '</select>';
}

function fillDevActivityColumn(control) {
  var selects = document.querySelectorAll('#devBody .dev-result-select');
  if (!selects.length) return;

  var selected = control ? control.value : '__noop';
  if (selected === '__noop') return;

  var value = normalizeDevActivityResult(selected);
  if (value === null) {
    showToast('กรุณากรอกเฉพาะ ผ่าน, ไม่ผ่าน, ร หรือ มส', 'error');
    if (control) control.value = '__noop';
    return;
  }

  selects.forEach(function(sel) { sel.value = value; });
  document.querySelectorAll('#devBody .dev-result-cell').forEach(function(cell) {
    cell.classList.remove('column-updated');
    void cell.offsetWidth;
    cell.classList.add('column-updated');
  });
  if (control) control.value = '__noop';
  showToast('อัปเดตคอลัมน์ผลการประเมินแล้ว อย่าลืมกดบันทึก', 'success');
}

function saveDevActivity() {
  var rows = (currentData.dev_students || []).map(function(student) {
    var sel = document.querySelector('select[data-student="' + student.student_id + '"]');
    return { student_id: student.student_id, result: sel ? sel.value : '' };
  });
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  document.getElementById('saveStatus').textContent = 'กำลังบันทึก...';
  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('บันทึกผลกิจกรรมสำเร็จ', 'success');
      loadDevActivity();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverSaveDevActivity(TOKEN, CLASS_ID, SUBJECT_ID, rows);
}

loadDevActivity();
</script>
</body>
</html>

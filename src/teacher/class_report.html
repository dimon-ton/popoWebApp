<div class="container">

        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:70%"></div></div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var CLASS_ID = '<?!= data.class_id || '' ?>';
var SUBJECT_ID = '<?!= data.subject_id || '' ?>';
var currentData = null;

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtCls(level, section) {
  var l = String(level || '').trim();
  var s = String(section || '').trim();
  if (!l && !s) return '';
  return s ? l + '/' + s : l;
}

function blank(s) {
  return escHtml(s === null || s === undefined ? '' : s);
}

function num(value) {
  return value === '' || value === null || value === undefined ? '' : escHtml(value);
}

function pct(value) {
  return value === '' || value === null || value === undefined ? '' : escHtml(value) + '%';
}

function loadReport() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('reportContent').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) {
        document.getElementById('loadingMsg').style.display = 'none';
        showToast(result.error, 'error');
        return;
      }
      currentData = result;
      renderReport(result);
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingMsg').style.display = 'none';
      showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    })
    .getReportBookData(TOKEN, CLASS_ID, SUBJECT_ID);
}

function renderReport(d) {
  document.getElementById('loadingMsg').style.display = 'none';

  var cls = d.class_info || {};
  var subj = d.subject_info || {};
  var classLabel = cls.class_label || fmtCls(cls.level, cls.section);
  document.getElementById('pageHeading').textContent =
    'ป.พ.5 — ' + classLabel + ' — ' + (subj.subject_name || '');

  document.getElementById('reportBook').innerHTML = buildReportBookHtml(d);
  document.getElementById('reportContent').style.display = 'block';
  document.getElementById('exportPdfBtn').style.display = 'inline-block';
}

function buildReportBookHtml(d) {
  var pages = [
    pageReferenceCover,
    pageReferenceStudentRoster,
    pageReferenceAttendance,
    pageReferenceScoreGrid,
    pageReferenceScoreGridSummary,
    pageReferenceSubjectDescription,
    pageReferenceReadThinkWriteGrid,
    pageReferenceCharacteristicsGrid,
    pageReferenceDevActivityDoc,
    pageReferenceCharacteristicsAssessment,
    pageReferenceReadThinkWriteAssessment,
    pageReferenceFinalSummary,
    pageAppendix
  ];
  var pageNumber = 1;
  return pages.map(function(fn) {
    var rendered = fn(d, pageNumber);
    if (Array.isArray(rendered)) {
      pageNumber += rendered.length;
      return rendered.join('');
    }
    pageNumber++;
    return rendered;
  }).join('');
}

function pageShell(number, title, subtitle, body, extraClass) {
  return '<section class="a4-page ' + (extraClass || '') + '" data-page="' + number + '">' +
    '<h1 class="report-page-title">' + escHtml(title) + '</h1>' +
    (subtitle ? '<div class="report-page-subtitle">' + escHtml(subtitle) + '</div>' : '') +
    body +
    '<div class="page-number">หน้า ' + number + ' / 14</div>' +
  '</section>';
}

function meta(d) {
  var cls = d.class_info || {};
  var subj = d.subject_info || {};
  var school = d.school_info || {};
  return {
    school: school,
    cls: cls,
    subj: subj,
    classLabel: cls.class_label || fmtCls(cls.level, cls.section)
  };
}

function referenceShell(number, body, extraClass) {
  return pageShell(number, '', '', body, 'form-page ' + (extraClass || ''));
}

function studentRows(d) {
  return d.students || d.summative_students || d.formative_students || [];
}

function studentName(s) {
  return s.full_name || s.name || '';
}

function reportYear(d) {
  return (d.school_info && d.school_info.academic_year) || '';
}

var THAI_MONTH_ABBR = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

function parseReportIsoDate(value) {
  var parts = String(value || '').split('-');
  if (parts.length !== 3) return null;
  var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(date.getTime())) return null;
  return date;
}

function attendanceDayHeaders(dates) {
  return dates.map(function(value) {
    var date = parseReportIsoDate(value);
    return '<th style="width:5mm">' + (date ? date.getDate() : '') + '</th>';
  }).join('');
}

function attendanceMonthHeaders(dates) {
  var groups = [];
  dates.forEach(function(value) {
    var date = parseReportIsoDate(value);
    var label = date ? THAI_MONTH_ABBR[date.getMonth()] : '';
    var last = groups[groups.length - 1];
    if (last && last.label === label) last.count++;
    else groups.push({ label: label, count: 1 });
  });
  return groups.map(function(group) {
    return '<th colspan="' + group.count + '">' + escHtml(group.label) + '</th>';
  }).join('');
}

function chunkArray(items, size) {
  var chunks = [];
  for (var i = 0; i < items.length; i += size) chunks.push(items.slice(i, i + size));
  return chunks.length ? chunks : [[]];
}

function gradeCountMap(d) {
  var map = {};
  (d.grade_dist || []).forEach(function(row) { map[String(row.grade)] = row; });
  return map;
}

function approvalBlock(d) {
  var teacher = blank(d.teacher_name || '');
  var homeroom = blank(d.homeroom_teacher_name || '');
  var school = d.school_info || {};
  var measurementHead = blank(school.measurement_head_name || '........................................');
  var academicHead = blank(school.academic_head_name || '........................................');
  var director = blank(school.director_name || '........................................');
  var schoolName = school.school_name || 'โรงเรียน';
  return '<div class="approval-layout">' +
    approvalSignature('ลงชื่อ', teacher, 'ครูผู้สอน', 'approval-signature-block') +
    approvalSignature('ลงชื่อ', homeroom, 'หัวหน้ากลุ่มสาระการเรียนรู้', 'approval-signature-block') +
    approvalSignature('ลงชื่อ', measurementHead, 'หัวหน้างานวัดผลและประเมินผล', 'approval-signature-block') +
    '<div class="approval-academic-block">' +
      '<div class="approval-intro">เรียนเสนอ เพื่อโปรดพิจารณา</div>' +
      approvalSignature('ลงชื่อ', academicHead, 'หัวหน้างานวิชาการ') +
    '</div>' +
    '<div class="check-row"><span class="check-choice"><span class="check-box"></span><span>อนุมัติ</span></span><span class="check-choice"><span class="check-box"></span><span>ไม่อนุมัติ</span></span></div>' +
    '<div style="height:3mm"></div>' +
    approvalSignature('', director, 'ผู้อำนวยการ' + schoolName, 'approval-signature-block') +
  '</div>';
}

function approvalSignature(label, name, role, extraClass) {
  var body = '<div class="approval-line"><span>' + escHtml(label || '') + '</span><span class="approval-rule"></span></div>' +
    '<div class="approval-name"><span></span><span>(' + blank(name) + ')</span></div>' +
    '<div class="approval-role"><span></span><span>' + escHtml(role || '') + '</span></div>';
  return extraClass ? '<div class="' + escHtml(extraClass) + '">' + body + '</div>' : body;
}

function pageReferenceCover(d, n) {
  var m = meta(d);
  var grades = gradeCountMap(d);
  var charSummary = qualitySummaryCells(d.char_dist || []);
  var rtwSummary = qualitySummaryCells(d.rtw_dist || []);
  var devCounts = d.dev_counts || {};
  var totalForPct = Number(d.total_students || studentRows(d).length || 0);
  var gradeKeys = ['4','3.5','3','2.5','2','1.5','1','0'];
  var gradeHeader = gradeKeys.map(function(g) { return '<th>' + g + '</th>'; }).join('');
  var countRow = gradeKeys.map(function(g) { return '<td>' + num(grades[g] && grades[g].count || 0) + '</td>'; }).join('');
  var pctRow = gradeKeys.map(function(g) { return '<td>' + num(grades[g] && grades[g].pct || '0.00') + '</td>'; }).join('');
  var coverMark = m.school.school_logo
    ? '<img class="report-school-logo" src="' + escHtml(m.school.school_logo) + '" alt="โลโก้โรงเรียน">'
    : '<div class="report-cover-mark">ตรา</div>';
  var body = coverMark +
    '<div class="form-title">แบบบันทึกผลการเรียนประจำรายวิชา ระดับประถมศึกษา</div>' +
    '<div class="form-meta">' +
      '<span class="meta-label">โรงเรียน</span><span class="meta-value">' + blank(m.school.school_name) + '</span>' +
      '<span class="meta-label">อำเภอ</span><span class="meta-value">' + blank(m.school.district) + '</span>' +
      '<span class="meta-label">จังหวัด</span><span class="meta-value">' + blank(m.school.province) + '</span>' +
      '<span></span><span></span><span class="meta-label">ปีการศึกษา</span><span class="meta-value">' + blank(reportYear(d)) + '</span><span></span><span></span>' +
      '<span class="meta-label">ชั้น</span><span class="meta-value">' + blank(m.classLabel) + '</span>' +
      '<span class="meta-label">กลุ่มสาระฯ</span><span class="meta-value" style="grid-column:4/7">' + blank(m.subj.subject_group) + '</span>' +
      '<span class="meta-label">รายวิชา</span><span class="meta-value">' + blank(m.subj.subject_name) + '</span>' +
      '<span class="meta-label">รหัสวิชา</span><span class="meta-value">' + blank(m.subj.subject_code) + '</span>' +
      '<span class="meta-label">เวลาเรียน</span><span class="meta-value">' + blank(m.subj.hours_per_year) + ' ชั่วโมง/ปี</span>' +
      '<span class="meta-label">ครูผู้สอน</span><span class="meta-value" style="grid-column:2/7">' + blank(d.teacher_name) + '</span>' +
      '<span class="meta-label">ครูประจำชั้น</span><span class="meta-value" style="grid-column:2/7">' + blank(d.homeroom_teacher_name) + '</span>' +
    '</div>' +
    '<div style="font-weight:700;font-size:20px;margin-bottom:1mm">สรุปผลการประเมิน</div>' +
    '<table class="report-table form-summary-table"><thead><tr><th rowspan="2" style="width:28mm">จำนวนนักเรียน</th><th colspan="6">ระดับผลการเรียน</th><th colspan="4">กิจกรรมพัฒนาผู้เรียน</th><th colspan="2">ผลการประเมิน</th></tr><tr>' + gradeHeader + '<th>ผ่าน</th><th>ไม่ผ่าน</th><th>ร</th><th>มส</th></tr></thead>' +
    '<tbody><tr><td>' + num(totalForPct) + '</td>' + countRow + '<td>' + num(devCounts['ผ่าน'] || 0) + '</td><td>' + num(devCounts['ไม่ผ่าน'] || 0) + '</td><td>' + num(devCounts['ร'] || 0) + '</td><td>' + num(devCounts['มส'] || 0) + '</td></tr>' +
    '<tr><td class="bold">คิดเป็นร้อยละ</td>' + pctRow + '<td>' + num(percentOf(devCounts['ผ่าน'] || 0, totalForPct)) + '</td><td>' + num(percentOf(devCounts['ไม่ผ่าน'] || 0, totalForPct)) + '</td><td>' + num(percentOf(devCounts['ร'] || 0, totalForPct)) + '</td><td>' + num(percentOf(devCounts['มส'] || 0, totalForPct)) + '</td></tr></tbody></table>' +
    '<div class="report-grid" style="margin-top:6mm">' +
      '<table class="report-table"><thead><tr><th colspan="4">ผลการประเมินคุณลักษณะอันพึงประสงค์</th></tr><tr><th>3 = ดีเยี่ยม</th><th>2 = ดี</th><th>1 = ผ่าน</th><th>0 = ไม่ผ่าน</th></tr></thead><tbody><tr>' + charSummary.counts + '</tr><tr>' + charSummary.pcts + '</tr></tbody></table>' +
      '<table class="report-table"><thead><tr><th colspan="4">ผลการประเมินการอ่านคิดวิเคราะห์และเขียน</th></tr><tr><th>3 = ดีเยี่ยม</th><th>2 = ดี</th><th>1 = ผ่าน</th><th>0 = ไม่ผ่าน</th></tr></thead><tbody><tr>' + rtwSummary.counts + '</tr><tr>' + rtwSummary.pcts + '</tr></tbody></table>' +
    '</div>' +
    '<div class="approval-heading">การอนุมัติผลการเรียน</div>' +
    approvalBlock(d);
  return referenceShell(n, body, 'cover-page');
}

function qualitySummaryCells(dist) {
  var labels = ['ดีเยี่ยม', 'ดี', 'ผ่านเกณฑ์', 'ไม่ผ่าน'];
  var map = {};
  dist.forEach(function(row) {
    if (row && row.label) map[row.label] = row;
  });
  return {
    counts: labels.map(function(label) {
      return '<td>' + num(map[label] && map[label].count || 0) + '</td>';
    }).join(''),
    pcts: labels.map(function(label) {
      return '<td>' + num(map[label] && map[label].pct || '0.00') + '</td>';
    }).join('')
  };
}

function percentOf(count, total) {
  if (!total) return '0.00';
  return (Math.round(Number(count || 0) * 10000 / total) / 100).toFixed(2);
}

function pageReferenceBlankRoster(d, n) {
  var rows = Array.from({ length: 13 }).map(function(_, i) { return '<tr><td style="height:8mm"></td></tr>'; }).join('');
  return referenceShell(n, '<table class="report-table tiny-blank-list"><tbody>' + rows + '</tbody></table>');
}

function pageReferenceStudentRoster(d, n) {
  var rows = studentRows(d).map(function(s, i) {
    return '<tr><td>' + blank(s.seq_no || i + 1) + '</td><td>' + blank(s.student_code) + '</td><td>' + blank(s.citizen_id || '') + '</td><td class="left">' + blank(studentName(s)) + '</td><td>' + blank(s.dob || '') + '</td><td class="left">' + blank(s.note || '') + '</td></tr>';
  }).join('');
  var body = '<div class="form-title">บัญชีรายชื่อนักเรียน</div><table class="report-table form-grid-table" style="width:176mm;margin-left:auto;margin-right:auto"><thead><tr><th style="width:9mm">ที่</th><th style="width:24mm">เลขประจำตัว</th><th style="width:38mm">หมายเลขบัตรประชาชน</th><th>ชื่อ - สกุล</th><th style="width:26mm">วันเดือนปีเกิด</th><th style="width:24mm">หมายเหตุ</th></tr></thead><tbody>' + rows + '</tbody></table>';
  return referenceShell(n, body);
}

function pageReferenceSubjectDescription(d, n) {
  var body = '<div class="description-block"><div style="font-weight:700;text-align:center;margin-bottom:5mm">คำอธิบายรายวิชา</div><div style="min-height:92mm"></div></div>';
  return referenceShell(n, body);
}

function pageReferenceAttendance(d, n) {
  var allDates = d.attendance_dates || [];
  return chunkArray(allDates, 24).map(function(dates, pageIndex) {
    return pageReferenceAttendanceChunk(d, n + pageIndex, dates, pageIndex * 24);
  });
}

function pageReferenceAttendanceChunk(d, n, dates, startIndex) {
  var startWeek = Math.floor(startIndex / 5) + 1;
  var endWeek = Math.max(startWeek, Math.ceil((startIndex + dates.length) / 5));
  var rows = (d.attendance_students || studentRows(d)).map(function(s, i) {
    var attendance = s.attendance || {};
    var marks = dates.map(function(date) { return '<td>' + blank(attendance[date] || '') + '</td>'; }).join('');
    return '<tr><td>' + blank(s.seq_no || i + 1) + '</td><td>' + blank(s.student_code) + '</td><td class="left">' + blank(studentName(s)) + '</td>' + marks + '</tr>';
  }).join('');
  var weekLabel = startWeek === endWeek ? String(startWeek) : startWeek + ' - ' + endWeek;
  var body = '<table class="report-table form-grid-table attendance-table"><thead><tr><th rowspan="3" style="width:8mm">เลขที่</th><th rowspan="3" style="width:23mm">เลขประจำตัว</th><th rowspan="3" class="student-name-head" style="width:54mm">ชื่อ - สกุล</th><th colspan="' + Math.max(1, dates.length) + '">สัปดาห์ที่ ' + weekLabel + '</th></tr><tr>' + attendanceMonthHeaders(dates) + '</tr><tr>' + attendanceDayHeaders(dates) + '</tr></thead><tbody>' + rows + '</tbody></table><div class="form-note"><b>หมายเหตุ</b><br>2 มิถุนายน ' + blank(reportYear(d)) + ' เป็นวันหยุดราชการพิเศษ<br>3 มิถุนายน ' + blank(reportYear(d)) + ' หยุดชดเชยวันเฉลิมพระชนมพรรษา</div>';
  return referenceShell(n, body, 'landscape-table');
}

function indicatorHeaders(d, count) {
  var inds = (d.indicators || []).slice(0, count);
  while (inds.length < count) inds.push({ code: '' });
  return inds.map(function(ind, i) { return rotatedTh('ต ' + (ind.code || (i + 1))); }).join('');
}

function rotatedTh(text, attrs) {
  return '<th class="rot"' + (attrs ? ' ' + attrs : '') + '><span class="rot-text">' + blank(text) + '</span></th>';
}

function pageReferenceScoreGrid(d, n) {
  var inds = (d.indicators || []).slice(0, 16);
  var head = indicatorHeaders(d, 16);
  var rows = (d.formative_students || studentRows(d)).map(function(s, i) {
    var cells = inds.map(function(ind) { return '<td>' + num(s.scores ? s.scores[ind.indicator_id] : '') + '</td>'; }).join('');
    while ((cells.match(/<td>/g) || []).length < 16) cells += '<td></td>';
    return '<tr><td>' + blank(s.seq_no || i + 1) + '</td><td class="left">' + blank(studentName(s)) + '</td><td></td>' + cells + '</tr>';
  }).join('');

  var keys = ['ผ่าน', 'ไม่ผ่าน', 'ร', 'มส'];
  var rows = keys.map(function(k) {
    return '<tr><td class="bold">' + blank(k) + '</td><td>' + num((d.dev_counts || {})[k] || 0) + '</td></tr>';
  }).join('');
  var body = section('สรุปกิจกรรมพัฒนาผู้เรียน', '<table class="report-table" id="devSummaryTable"><thead><tr><th>ผล</th><th>จำนวน</th></tr></thead><tbody id="devSummaryBody">' + rows + '</tbody></table>') +
    section('บันทึกเพิ่มเติม', '<div style="min-height:72mm"></div>');
  return pageShell(n, 'สรุปกิจกรรมพัฒนาผู้เรียน', meta(d).classLabel, body);
}

function pageCertification(d, n) {
  var school = d.school_info || {};
  var body = section('คำรับรองผลการประเมิน', '<div style="min-height:64mm;font-size:16px;text-indent:12mm">ข้าพเจ้าขอรับรองว่าข้อมูลผลการเรียน เวลาเรียน คุณลักษณะอันพึงประสงค์ การอ่าน คิดวิเคราะห์และเขียน และกิจกรรมพัฒนาผู้เรียนในเอกสารฉบับนี้ ถูกต้องตามข้อมูลที่บันทึกในระบบ</div>') +
    '<div class="signature-grid"><div class="signature-box"><div class="signature-line"></div>(' + blank(d.teacher_name) + ')<br>ครูผู้สอน</div><div class="signature-box"><div class="signature-line"></div>(' + blank(d.homeroom_teacher_name) + ')<br>ครูประจำชั้น</div></div>' +
    '<div class="signature-grid"><div class="signature-box"><div class="signature-line"></div>(' + blank(school.measurement_head_name || '') + ')<br>หัวหน้างานวัดผล</div><div class="signature-box"><div class="signature-line"></div>(' + blank(school.director_name || '') + ')<br>ผู้บริหารสถานศึกษา</div></div>';
  return pageShell(n, 'หน้ารับรองรายงาน', meta(d).classLabel, body);
}

function pageTeacherNotes(d, n) {
  var rows = Array.from({ length: 14 }).map(function(_, i) {
    return '<tr><td style="height:11mm">' + (i + 1) + '</td><td class="left"></td><td></td></tr>';
  }).join('');
  var body = '<table class="report-table"><thead><tr><th style="width:12mm">ที่</th><th>รายการบันทึก/ข้อเสนอแนะ</th><th style="width:36mm">วันที่</th></tr></thead><tbody>' + rows + '</tbody></table>';
  return pageShell(n, 'บันทึกหลังการจัดการเรียนรู้', meta(d).subj.subject_name || '', body);
}

function pageAppendix(d, n) {
  var items = ['ตรวจสอบรายชื่อนักเรียนครบถ้วน', 'ตรวจสอบคะแนนระหว่างเรียน', 'ตรวจสอบคะแนนปลายภาค/ปลายปี', 'ตรวจสอบเวลาเรียน', 'ตรวจสอบคุณลักษณะอันพึงประสงค์', 'ตรวจสอบการอ่าน คิดวิเคราะห์ และเขียน', 'ตรวจสอบกิจกรรมพัฒนาผู้เรียน', 'ลงนามรับรองเอกสาร'];
  var body = section('รายการตรวจสอบก่อนจัดเก็บเอกสาร', '<div class="appendix-list">' + items.map(function(item, i) {
    return '<div class="appendix-item"><span class="check-box"></span><span>' + (i + 1) + '. ' + escHtml(item) + '</span><span>วันที่ ..........</span></div>';
  }).join('') + '</div>') +
    section('หมายเหตุ', '<div style="min-height:62mm"></div>');
  return pageShell(n, 'ภาคผนวกและรายการตรวจสอบ', meta(d).classLabel, body);
}

function section(title, body) {
  return '<div class="report-section"><div class="report-section-heading">' + escHtml(title) + '</div><div class="report-section-body">' + body + '</div></div>';
}

function lineRow(l1, v1, l2, v2) {
  if (l2 === undefined) {
    return '<div class="report-line-row two"><div class="line-label">' + escHtml(l1) + '</div><div class="line-value">' + blank(v1) + '</div></div>';
  }
  return '<div class="report-line-row"><div class="line-label">' + escHtml(l1) + '</div><div class="line-value">' + blank(v1) + '</div><div class="line-label">' + escHtml(l2) + '</div><div class="line-value">' + blank(v2) + '</div></div>';
}

function gradeScaleTable() {
  return '<table class="report-table"><tbody><tr><td>80-100</td><td>4</td><td>ดีเยี่ยม</td></tr><tr><td>75-79</td><td>3.5</td><td>ดีมาก</td></tr><tr><td>70-74</td><td>3</td><td>ดี</td></tr><tr><td>65-69</td><td>2.5</td><td>ค่อนข้างดี</td></tr><tr><td>60-64</td><td>2</td><td>ปานกลาง</td></tr><tr><td>55-59</td><td>1.5</td><td>พอใช้</td></tr><tr><td>50-54</td><td>1</td><td>ผ่านเกณฑ์ขั้นต่ำ</td></tr><tr><td>0-49</td><td>0</td><td>ไม่ผ่าน</td></tr></tbody></table>';
}

function renderDevActivityEditor(d) {
  var devBody = document.getElementById('devBody');
  devBody.innerHTML = '';
  var devStudents = d.dev_students || [];
  var canEdit = d.can_edit;
  document.getElementById('devHead').innerHTML = canEdit
    ? '<tr><th style="width:40px">ที่</th><th class="left">ชื่อ-สกุล</th><th style="width:150px">ผลการประเมิน<br>' + getColumnFillSelectHtml() + '</th></tr>'
    : '<tr><th style="width:40px">ที่</th><th class="left">ชื่อ-สกุล</th><th style="width:150px">ผลการประเมิน</th></tr>';

  devStudents.forEach(function(student) {
    var tr = document.createElement('tr');
    var resultHtml;
    if (canEdit) {
      resultHtml = '<select class="dev-result-select" data-student="' + escHtml(student.student_id) + '">' +
        '<option value=""></option>' +
        ['ผ่าน', 'ไม่ผ่าน', 'ร', 'มส'].map(function(opt) {
          return '<option value="' + escHtml(opt) + '"' + (student.result === opt ? ' selected' : '') + '>' + escHtml(opt) + '</option>';
        }).join('') +
        '</select>';
    } else {
      resultHtml = escHtml(student.result || '');
    }
    tr.innerHTML = '<td>' + escHtml(student.seq_no) + '</td>' +
      '<td class="left">' + escHtml(student.full_name) + '</td>' +
      '<td class="dev-result-cell">' + resultHtml + '</td>';
    devBody.appendChild(tr);
  });

  document.getElementById('saveBar').style.display = canEdit ? 'flex' : 'none';
}

function exportPdf() {
  var reportBook = document.getElementById('reportBook');
  if (!reportBook || !reportBook.children.length) {
    showToast('ยังไม่มีรายงานสำหรับพิมพ์', 'error');
    return;
  }
  document.getElementById('pdfStatus').textContent = 'กำลังเปิดหน้าต่างพิมพ์...';
  var printWindow = window.open('', '_blank');
  if (!printWindow) {
    window.print();
    document.getElementById('pdfStatus').textContent = '';
    showToast('เปิดหน้าต่างพิมพ์ไม่สำเร็จ จึงพิมพ์จากหน้านี้แทน', 'info');
    return;
  }
  var styles = Array.prototype.map.call(document.querySelectorAll('style'), function(style) {
    return style.textContent || '';
  }).join('\n');
  printWindow.document.open();
  printWindow.document.write('<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>พิมพ์รายงาน</title>' +
    '<style>' + styles + '</style>' +
    '<style>@page{size:A4 portrait;margin:0}html,body{width:210mm;margin:0;background:#fff}.a4-report-book{display:block}.a4-page{width:210mm;min-height:297mm;margin:0;box-shadow:none;transform:none!important;page-break-after:always;break-after:page}.a4-page:last-child{page-break-after:auto;break-after:auto}</style>' +
    '</head><body class="page-class-report"><div class="a4-report-book">' + reportBook.innerHTML + '</div></body></html>');
  printWindow.document.close();
  setTimeout(function() {
    printWindow.focus();
    printWindow.print();
    document.getElementById('pdfStatus').textContent = '';
    showToast('เปิดหน้าต่างพิมพ์แล้ว', 'success');
  }, 250);
}

function normalizeDevActivityResult(value) {
  var result = String(value || '').trim();
  var allowed = ['', 'ผ่าน', 'ไม่ผ่าน', 'ร', 'มส'];
  return allowed.indexOf(result) >= 0 ? result : null;
}

function getColumnFillSelectHtml() {
  return '<select class="column-fill-select" onchange="fillDevActivityColumn(this)">' +
    '<option value="__noop">ใส่ทั้งคอลัมน์...</option>' +
    '<option value="">ว่าง</option>' +
    ['ผ่าน','ไม่ผ่าน','ร','มส'].map(function(opt) {
      return '<option value="' + escHtml(opt) + '">' + escHtml(opt) + '</option>';
    }).join('') +
  '</select>';
}

function fillDevActivityColumn(control) {
  var selects = document.querySelectorAll('#devBody .dev-result-select');
  if (!selects.length) return;

  var selected = control ? control.value : '__noop';
  if (selected === '__noop') return;

  var value = normalizeDevActivityResult(selected);
  if (value === null) {
    showToast('กรุณากรอกเฉพาะ ผ่าน, ไม่ผ่าน, ร หรือ มส', 'error');
    if (control) control.value = '__noop';
    return;
  }

  selects.forEach(function(sel) { sel.value = value; });
  document.querySelectorAll('#devBody .dev-result-cell').forEach(function(cell) {
    cell.classList.remove('column-updated');
    void cell.offsetWidth;
    cell.classList.add('column-updated');
  });
  if (control) control.value = '__noop';
  showToast('อัปเดตคอลัมน์ผลการประเมินแล้ว อย่าลืมกดบันทึก', 'success');
}

function saveDevActivity() {
  if (!currentData) return;

  var rows = (currentData.dev_students || []).map(function(student) {
    var sel = document.querySelector('select[data-student="' + student.student_id + '"]');
    return { student_id: student.student_id, result: sel ? sel.value : '' };
  });

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  document.getElementById('saveStatus').textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('บันทึกสำเร็จ', 'success');
      loadReport();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverSaveDevActivity(TOKEN, CLASS_ID, SUBJECT_ID, rows);
}

loadReport();
</script>
</body>
</html>

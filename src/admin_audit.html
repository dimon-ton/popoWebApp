<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกการเปลี่ยนแปลง — PopoWebApp</title>
  <?!= include('_styles') ?>
  <style>
    thead th { background: var(--brand); color: white; border-bottom: none; }
    tbody td { vertical-align: top; }
    #auditStatus { color: var(--text-muted); font-size: 14px; margin: 8px 0; }
    .btn-secondary { background: #e5e7eb; color: #333; border: none; }
  </style>
</head>
<body>
  <div class="navbar">
    <span class="navbar-title" onclick="goHome()"><span class="title-main">ระบบจัดการ ปพ.5 ออนไลน์</span><span class="title-sub">โรงเรียนบ้านโพนแท่น</span></span>
    <div class="navbar-user">
  <div class="navbar-user-trigger">
            <div class="navbar-avatar-placeholder"><?= data.session ? data.session.full_name.charAt(0) : '' ?></div>
            <span><?= data.session ? data.session.full_name : '' ?><?= data.session && data.session.role === 'admin' ? ' (admin)' : '' ?></span>
        </div>
  <div class="navbar-dropdown">
    <a href="#" onclick="navigate('profile_edit'); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> แก้ไขโปรไฟล์</a>
    <div class="dropdown-divider"></div>
    <a href="#" onclick="doLogout(); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> ออกจากระบบ</a>
  </div>
    </div>  </div>

  <div class="container wide">
    <div class="card">
      <h2 id="pageHeading">บันทึกการเปลี่ยนแปลง (Audit Log)</h2>

      <!-- Filters -->
      <div class="filter-row">
        <div class="filter-group">
          <label for="filterUserId">ผู้ใช้ (user_id / ชื่อ)</label>
          <input type="text" id="filterUserId" placeholder="เช่น admin หรือ test_" style="width:180px">
        </div>
        <div class="filter-group">
          <label for="filterEntity">ตาราง (Entity)</label>
          <select id="filterEntity" style="width:200px">
            <option value="">-- ทั้งหมด --</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterDateFrom">วันที่เริ่มต้น</label>
          <input type="date" id="filterDateFrom">
        </div>
        <div class="filter-group">
          <label for="filterDateTo">วันที่สิ้นสุด</label>
          <input type="date" id="filterDateTo">
        </div>
        <div class="filter-group" style="padding-bottom:1px">
          <label>&nbsp;</label>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" id="searchBtn" onclick="doSearch()">ค้นหา</button>
            <button class="btn btn-secondary" onclick="clearFilters()">ล้างตัวกรอง</button>
          </div>
        </div>
      </div>

      <div id="auditStatus" class="loading-msg">
        <div class="skeleton-table">
          <div class="skeleton-table-row skeleton-table-head"><div class="skeleton-table-cell" style="width:18%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:18%"></div></div>
          <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:18%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:18%"></div></div>
          <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:18%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:18%"></div></div>
          <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:18%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:18%"></div></div>
          <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:18%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:12%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:18%"></div></div>
        </div>
      </div>

      <!-- Results table -->
      <div id="auditTableWrap" style="overflow-x:auto;display:none">
        <table id="auditTable">
          <thead>
            <tr>
              <th>เวลา</th>
              <th>ผู้ใช้</th>
              <th>ตาราง</th>
              <th>Entity ID</th>
              <th>ค่าเดิม (old)</th>
              <th>ค่าใหม่ (new)</th>
            </tr>
          </thead>
          <tbody id="auditBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';

function goHome() {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .getDashboardHtml(TOKEN);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 3000);
}

// Load entity list into dropdown
function loadEntities() {
  google.script.run
    .withSuccessHandler(function(entities) {
      var sel = document.getElementById('filterEntity');
      entities.forEach(function(e) {
        var opt = document.createElement('option');
        opt.value = e;
        opt.textContent = e;
        sel.appendChild(opt);
      });
    })
    .withFailureHandler(function(err) {
      console.error('entities error', err.message);
    })
    .getAuditEntities(TOKEN);
}

function doSearch() {
  var filters = {
    user_id: document.getElementById('filterUserId').value.trim(),
    entity: document.getElementById('filterEntity').value,
    date_from: document.getElementById('filterDateFrom').value,
    date_to: document.getElementById('filterDateTo').value
  };

  document.getElementById('auditStatus').textContent = 'กำลังค้นหา...';
  document.getElementById('auditTableWrap').style.display = 'none';
  document.getElementById('searchBtn').disabled = true;

  google.script.run
    .withSuccessHandler(renderRows)
    .withFailureHandler(function(err) {
      document.getElementById('auditStatus').textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      document.getElementById('searchBtn').disabled = false;
    })
    .getAuditLog(TOKEN, filters);
}

function renderRows(rows) {
  document.getElementById('searchBtn').disabled = false;
  var tbody = document.getElementById('auditBody');
  tbody.innerHTML = '';

  if (!rows || rows.length === 0) {
    document.getElementById('auditStatus').textContent = 'ไม่พบข้อมูล';
    document.getElementById('auditTableWrap').style.display = 'none';
    return;
  }

  document.getElementById('auditStatus').textContent = 'พบ ' + rows.length + ' รายการ';
  document.getElementById('auditTableWrap').style.display = 'block';

  rows.forEach(function(r) {
    var ts = r.timestamp ? new Date(r.timestamp).toLocaleString('th-TH') : '';
    var tr = document.createElement('tr');
    tr.setAttribute('data-entity', r.entity || '');
    tr.setAttribute('data-user-id', r.user_id || '');
    tr.innerHTML =
      '<td>' + escHtml(ts) + '</td>' +
      '<td>' + escHtml(r.user_name || r.user_id || '') + '</td>' +
      '<td><span class="entity-badge">' + escHtml(r.entity || '') + '</span></td>' +
      '<td>' + escHtml(String(r.entity_id || '')) + '</td>' +
      '<td><div class="json-val">' + escHtml(formatJson(r.old_value)) + '</div></td>' +
      '<td><div class="json-val">' + escHtml(formatJson(r.new_value)) + '</div></td>';
    tbody.appendChild(tr);
  });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatJson(val) {
  if (!val || val === 'null') return '';
  try {
    return JSON.stringify(JSON.parse(val), null, 2);
  } catch (e) {
    return val;
  }
}

function clearFilters() {
  document.getElementById('filterUserId').value = '';
  document.getElementById('filterEntity').value = '';
  document.getElementById('filterDateFrom').value = '';
  document.getElementById('filterDateTo').value = '';
  document.getElementById('auditStatus').textContent = 'ล้างตัวกรองแล้ว — กดค้นหาเพื่อโหลดข้อมูล';
  document.getElementById('auditTableWrap').style.display = 'none';
  document.getElementById('auditBody').innerHTML = '';
}

// On load: populate entity dropdown then run initial search (no filters)
loadEntities();
doSearch();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>อ่าน คิดวิเคราะห์ และเขียน — PopoWebApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f5f5f5; color: #333; }
    .navbar { background: #1a56a0; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .navbar-title { font-size: 18px; font-weight: bold; }
    .navbar a { color: white; text-decoration: none; font-size: 14px; cursor: pointer; }
    .container { max-width: 1400px; margin: 24px auto; padding: 0 16px; }
    h2 { font-size: 18px; color: #1a56a0; margin-bottom: 16px; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
    .readonly-notice {
      font-size: 13px; color: #888; margin-bottom: 12px; padding: 10px;
      background: #fff8e1; border-radius: 4px; border-left: 3px solid #f0a500;
    }
    table { border-collapse: collapse; font-size: 13px; width: 100%; }
    th {
      background: #f0f4fa; padding: 8px 6px; text-align: center;
      border: 1px solid #ddd; font-size: 12px; white-space: nowrap; min-width: 48px;
    }
    th.name-col { text-align: left; min-width: 140px; }
    th.total-col { background: #e8f0fe; min-width: 48px; }
    th.label-col { background: #e8f5e9; min-width: 80px; }
    th.group-header { background: #dce8fa; font-weight: bold; font-size: 11px; }
    td {
      padding: 4px 3px; border: 1px solid #eee; text-align: center;
      vertical-align: middle;
    }
    td.name-col { text-align: left; padding-left: 8px; white-space: nowrap; }
    td.seq-col { text-align: center; color: #888; width: 36px; }
    td.total-col { font-weight: bold; color: #1a56a0; background: #f4f8ff; }
    td.label-col { font-weight: bold; background: #f1f8f1; }
    td.label-col.diyiam { color: #1a7a40; }
    td.label-col.di { color: #2980b9; }
    td.label-col.pass { color: #e67e22; }
    td.label-col.fail { color: #c0392b; }
    input.score-input {
      width: 38px; text-align: center; border: 1px solid #ccc; border-radius: 3px;
      padding: 3px 2px; font-size: 13px; font-family: inherit;
    }
    input.score-input:focus { border-color: #1a56a0; outline: none; }
    .save-bar {
      display: flex; gap: 10px; align-items: center; margin-top: 12px;
    }
    .btn-save {
      padding: 9px 24px; background: #27ae60; color: white; border: none;
      border-radius: 4px; font-size: 14px; font-family: inherit; cursor: pointer;
    }
    .btn-save:hover { background: #219150; }
    .btn-save:disabled { background: #aaa; cursor: not-allowed; }
    .toast {
      position: fixed; top: 20px; right: 20px; padding: 12px 20px;
      border-radius: 6px; font-size: 14px; z-index: 1000;
      display: none; max-width: 320px;
    }
    .toast.success { background: #27ae60; color: white; }
    .toast.error { background: #c0392b; color: white; }
    .loading-msg { color: #888; font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>
<div class="navbar">
  <span class="navbar-title">PopoWebApp</span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <span style="margin-left:auto;font-size:13px"><?= data.session ? data.session.full_name : '' ?></span>
</div>

<div class="container">
  <h2 id="pageHeading">อ่าน คิดวิเคราะห์ และเขียน</h2>

  <div id="readonlyNotice" class="readonly-notice" style="display:none">
    คุณมีสิทธิ์อ่านอย่างเดียว — เฉพาะครูผู้สอนหรือผู้ดูแลระบบแก้ไขได้
  </div>

  <div class="card">
    <p class="loading-msg" id="loadingMsg">กำลังโหลด...</p>
    <table id="rtwTable" style="display:none">
      <thead id="rtwHead"></thead>
      <tbody id="rtwBody"></tbody>
    </table>
  </div>

  <div class="save-bar" id="saveBar" style="display:none">
    <button class="btn-save" id="saveBtn" onclick="saveReadThinkWrite()">บันทึกคะแนน</button>
    <span id="saveStatus" style="font-size:13px;color:#888"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var CLASS_ID = '<?= data.class_id || '' ?>';
var SUBJECT_ID = '<?= data.subject_id || '' ?>';

// Column definitions: field key, display label
var COLUMNS = [
  { key: 'r1', label: 'อ่าน 1', group: 'อ่าน' },
  { key: 'r2', label: 'อ่าน 2', group: 'อ่าน' },
  { key: 'r3', label: 'อ่าน 3', group: 'อ่าน' },
  { key: 't1', label: 'คิด 1', group: 'คิดวิเคราะห์' },
  { key: 't2', label: 'คิด 2', group: 'คิดวิเคราะห์' },
  { key: 't3', label: 'คิด 3', group: 'คิดวิเคราะห์' },
  { key: 't4', label: 'คิด 4', group: 'คิดวิเคราะห์' },
  { key: 'w1', label: 'เขียน 1', group: 'เขียน' },
  { key: 'w2', label: 'เขียน 2', group: 'เขียน' },
  { key: 'w3', label: 'เขียน 3', group: 'เขียน' }
];

var currentData = null;

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function computeLabel(total) {
  if (total === '' || isNaN(Number(total))) return '';
  var t = Number(total);
  if (t >= 90) return 'ดีเยี่ยม';
  if (t >= 80) return 'ดี';
  if (t >= 70) return 'ผ่านเกณฑ์';
  return 'ไม่ผ่าน';
}

function labelClass(label) {
  if (label === 'ดีเยี่ยม') return 'diyiam';
  if (label === 'ดี') return 'di';
  if (label === 'ผ่านเกณฑ์') return 'pass';
  if (label === 'ไม่ผ่าน') return 'fail';
  return '';
}

function loadReadThinkWrite() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('rtwTable').style.display = 'none';
  document.getElementById('saveBar').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      currentData = result;
      renderGrid(result);
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingMsg').style.display = 'none';
      showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    })
    .getReadThinkWriteData(TOKEN, CLASS_ID, SUBJECT_ID);
}

function renderGrid(data) {
  document.getElementById('loadingMsg').style.display = 'none';

  var cls = data.class_info || {};
  var subj = data.subject_info || {};
  document.getElementById('pageHeading').textContent =
    'อ่าน คิดวิเคราะห์ และเขียน — ' + (cls.level || '') + '/' + (cls.section || '') + ' — ' + (subj.subject_name || '');

  var readonlyNotice = document.getElementById('readonlyNotice');
  var saveBar = document.getElementById('saveBar');
  if (data.can_edit) {
    readonlyNotice.style.display = 'none';
    saveBar.style.display = 'flex';
  } else {
    readonlyNotice.style.display = 'block';
    saveBar.style.display = 'none';
  }

  var students = data.students || [];
  var scores = data.scores || {};

  // Build header: group row + column row
  var thead = document.getElementById('rtwHead');
  // Group header row
  var groupRow = '<tr><th class="seq-col" rowspan="2">ที่</th>' +
                 '<th class="name-col" rowspan="2">ชื่อ-สกุล</th>' +
                 '<th class="group-header" colspan="3">อ่าน</th>' +
                 '<th class="group-header" colspan="4">คิดวิเคราะห์</th>' +
                 '<th class="group-header" colspan="3">เขียน</th>' +
                 '<th class="total-col" rowspan="2">รวม<br><span style="font-weight:normal;font-size:11px">/100</span></th>' +
                 '<th class="label-col" rowspan="2">ผล</th></tr>';
  // Column header row
  var colRow = '<tr>';
  COLUMNS.forEach(function(col) {
    colRow += '<th title="' + escHtml(col.label) + '">' + escHtml(col.label) + '<br>' +
              '<span style="font-weight:normal;font-size:10px">/10</span></th>';
  });
  colRow += '</tr>';
  thead.innerHTML = groupRow + colRow;

  // Build body
  var tbody = document.getElementById('rtwBody');
  tbody.innerHTML = '';

  students.forEach(function(student) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-student-id', student.student_id);

    var studentScores = scores[student.student_id] || {};
    var cells = '<td class="seq-col">' + escHtml(student.seq_no) + '</td>' +
                '<td class="name-col">' + escHtml(student.full_name) + '</td>';

    var sum = 0;
    var hasAny = false;

    COLUMNS.forEach(function(col) {
      var val = studentScores[col.key];
      var numVal = (val !== '' && val !== undefined) ? Number(val) : '';
      if (numVal !== '') { sum += numVal; hasAny = true; }

      if (data.can_edit) {
        cells += '<td><input class="score-input" type="number" min="0" max="10" step="1" ' +
          'value="' + (numVal !== '' ? escHtml(numVal) : '') + '" ' +
          'data-student="' + escHtml(student.student_id) + '" ' +
          'data-field="' + escHtml(col.key) + '" ' +
          'oninput="updateRowTotal(this)" ' +
          'onchange="clampScore(this)"></td>';
      } else {
        cells += '<td>' + (numVal !== '' ? escHtml(numVal) : '') + '</td>';
      }
    });

    var rowTotal = hasAny ? sum : '';
    var lbl = rowTotal !== '' ? computeLabel(rowTotal) : '';
    var lblCls = labelClass(lbl);

    cells += '<td class="total-col" id="rtw-total-' + escHtml(student.student_id) + '">' +
             (rowTotal !== '' ? rowTotal : '') + '</td>';
    cells += '<td class="label-col ' + escHtml(lblCls) + '" id="rtw-label-' + escHtml(student.student_id) + '">' +
             escHtml(lbl) + '</td>';

    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });

  document.getElementById('rtwTable').style.display = 'table';
}

function updateRowTotal(input) {
  var tr = input.closest('tr');
  if (!tr) return;
  var studentId = tr.getAttribute('data-student-id');
  var inputs = tr.querySelectorAll('input.score-input');
  var sum = 0;
  var hasAny = false;
  inputs.forEach(function(inp) {
    var v = parseFloat(inp.value);
    if (!isNaN(v)) { sum += v; hasAny = true; }
  });
  var total = hasAny ? sum : '';
  var lbl = total !== '' ? computeLabel(total) : '';

  var totalCell = document.getElementById('rtw-total-' + studentId);
  var labelCell = document.getElementById('rtw-label-' + studentId);
  if (totalCell) totalCell.textContent = total !== '' ? total : '';
  if (labelCell) {
    labelCell.textContent = lbl;
    labelCell.className = 'label-col ' + labelClass(lbl);
  }
}

function clampScore(input) {
  var v = parseFloat(input.value);
  if (!isNaN(v)) {
    if (v < 0) input.value = 0;
    if (v > 10) input.value = 10;
  }
  updateRowTotal(input);
}

function saveReadThinkWrite() {
  if (!currentData) return;

  var students = currentData.students || [];
  var rows = students.map(function(student) {
    var row = { student_id: student.student_id };
    COLUMNS.forEach(function(col) {
      var input = document.querySelector(
        'input[data-student="' + student.student_id + '"][data-field="' + col.key + '"]'
      );
      row[col.key] = input && input.value !== '' ? parseFloat(input.value) : '';
    });
    return row;
  });

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  document.getElementById('saveStatus').textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('บันทึกคะแนนสำเร็จ', 'success');
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverSaveReadThinkWrite(TOKEN, CLASS_ID, SUBJECT_ID, rows);
}

// Init
loadReadThinkWrite();
</script>
</body>
</html>

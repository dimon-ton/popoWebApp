<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เปลี่ยนรหัสผ่าน — PopoWebApp</title>
  <?!= include('_styles') ?>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .pw-card { background: white; border-radius: 10px; padding: 36px; width: 380px; box-shadow: 0 6px 24px rgba(26,86,160,0.15); border: 1px solid rgba(26,86,160,0.08); }
    .pw-card h2 { font-size: 18px; color: var(--brand); margin-bottom: 6px; text-align: center; }
    .pw-card .pw-subtitle { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
    .pw-card .form-group { margin-bottom: 14px; }
    .pw-card .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
    .pw-card .form-group input { width: 100%; padding: 10px 12px; }
    .pw-card .pw-btn { width: 100%; padding: 11px; background: var(--brand); color: white; border: none; border-radius: 6px; font-size: 15px; font-family: inherit; cursor: pointer; margin-top: 10px; font-weight: 600; transition: background 0.15s; }
    .pw-card .pw-btn:hover { background: var(--brand-dark); }
    .pw-card .pw-btn:disabled { background: #93b8d8; cursor: not-allowed; }
    .pw-card .error { background: #fdecea; color: var(--red-dark); padding: 10px 12px; border-radius: 5px; font-size: 13px; margin-bottom: 14px; display: none; border-left: 3px solid var(--red); }
    .pw-card .error.show { display: block; }
  </style>
</head>
<body>
<div class="pw-card">
  <h2>เปลี่ยนรหัสผ่าน</h2>
  <p class="pw-subtitle">กรุณาตั้งรหัสผ่านใหม่ก่อนเข้าใช้งาน</p>
  <div class="error" id="errBox"></div>
  <div class="form-group">
    <label>รหัสผ่านเดิม</label>
    <input type="password" id="oldPassword" placeholder="รหัสผ่านปัจจุบัน">
  </div>
  <div class="form-group">
    <label>รหัสผ่านใหม่</label>
    <input type="password" id="newPassword" placeholder="รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)">
  </div>
  <div class="form-group">
    <label>ยืนยันรหัสผ่านใหม่</label>
    <input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่านใหม่">
  </div>
  <button class="pw-btn" id="changeBtn" onclick="doChange()">เปลี่ยนรหัสผ่าน</button>
</div>

<script>
var TOKEN = '<?= data.token || '' ?>';

function doChange() {
  var oldPw = document.getElementById('oldPassword').value;
  var newPw = document.getElementById('newPassword').value;
  var confirmPw = document.getElementById('confirmPassword').value;
  var errBox = document.getElementById('errBox');

  if (!oldPw || !newPw || !confirmPw) {
    errBox.textContent = 'กรุณากรอกข้อมูลให้ครบถ้วน';
    errBox.className = 'error show';
    return;
  }
  if (newPw.length < 4) {
    errBox.textContent = 'รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร';
    errBox.className = 'error show';
    return;
  }
  if (newPw !== confirmPw) {
    errBox.textContent = 'รหัสผ่านใหม่ไม่ตรงกัน';
    errBox.className = 'error show';
    return;
  }

  var btn = document.getElementById('changeBtn');
  btn.disabled = true;
  errBox.className = 'error';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) {
        errBox.textContent = result.error;
        errBox.className = 'error show';
        return;
      }
      localStorage.setItem('popo_token', TOKEN);
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { window.top.location.reload(); })
        .getPageHtml(TOKEN, 'dashboard');
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      errBox.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      errBox.className = 'error show';
    })
    .serverChangePassword(TOKEN, oldPw, newPw);
}
</script>
</body>
</html>

<div class="container">
  <h2 id="pageHeading">ตัวชี้วัดวิชา</h2>

  <div class="card">
    <p class="notice">รายการตัวชี้วัดวิชานี้ — ดูอ่านอย่างเดียว ผู้ดูแลระบบสามารถจัดการตัวชี้วัดได้ที่เมนู "ตัวชี้วัด" ในหน้าจัดการวิชา</p>
    <div class="loading-msg" id="loadingMsg">
      <div class="skeleton-table">
        <div class="skeleton-table-row skeleton-table-head"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:25%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:20%"></div></div>
      </div>
    </div>
    <div id="indicatorsWrap" style="display:none">
      <table id="indicatorsTable">
        <thead>
          <tr>
            <th class="center" style="width:50px">ลำดับ</th>
            <th>รหัสตัวชี้วัด</th>
            <th>รายละเอียด</th>
            <th class="center" style="width:80px">คะแนนสูงสุด</th>
          </tr>
        </thead>
        <tbody id="indicatorsBody"></tbody>
      </table>
      <p class="empty-msg" id="emptyMsg" style="display:none">ยังไม่มีตัวชี้วัดสำหรับวิชานี้</p>
    </div>
  </div>
</div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var SUBJECT_ID = '<?!= data.subject_id || '' ?>';

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); alert('เกิดข้อผิดพลาด: ' + err.message); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadIndicators() {
  if (!SUBJECT_ID) {
    document.getElementById('loadingMsg').textContent = 'ไม่พบรหัสวิชา';
    return;
  }
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || result.error) {
        document.getElementById('loadingMsg').textContent = result ? result.error : 'เกิดข้อผิดพลาด';
        return;
      }
      var indicators = result.indicators || [];
      var subjectName = result.subject_name || SUBJECT_ID;
      document.getElementById('pageHeading').textContent = 'ตัวชี้วัดวิชา — ' + subjectName;
      renderIndicators(indicators);
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingMsg').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + err.message;
    })
    .getSubjectIndicatorsRef(TOKEN, SUBJECT_ID);
}

function renderIndicators(indicators) {
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('indicatorsWrap').style.display = 'block';
  var tbody = document.getElementById('indicatorsBody');
  tbody.innerHTML = '';
  if (!indicators.length) {
    document.getElementById('emptyMsg').style.display = 'block';
    return;
  }
  indicators.forEach(function(ind, idx) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="center">' + (idx + 1) + '</td>' +
      '<td>' + escHtml(ind.code) + '</td>' +
      '<td>' + escHtml(ind.description || '') + '</td>' +
      '<td class="center">' + escHtml(ind.max_score) + '</td>';
    tbody.appendChild(tr);
  });
}

loadIndicators();
</script>
</body>
</html>

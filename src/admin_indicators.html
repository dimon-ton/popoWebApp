<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตัวชี้วัด — PopoWebApp</title>
  <?!= include('_styles') ?>
  <style>
    .subject-label { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="navbar">
  <span class="navbar-title"><div class="navbar-title-skeleton"><div class="skeleton-line-main"></div><div class="skeleton-line-sub"></div></div></span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <a href="#" onclick="navigate('admin_school')">ข้อมูลโรงเรียน</a>
  <a href="#" onclick="navigate('admin_subjects')">วิชา</a>
  <div class="navbar-user">
  <div class="navbar-user-trigger"><div class="navbar-user-skeleton"><div class="skeleton-avatar"></div><div class="skeleton-name"></div></div></div>
  <div class="navbar-dropdown">
    <a href="#" onclick="navigate('profile_edit'); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> แก้ไขโปรไฟล์</a>
    <div class="dropdown-divider"></div>
    <a href="#" onclick="doLogout(); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> ออกจากระบบ</a>
  </div>
  </div>
</div>

<div class="container">
  <h2 class="page-title" id="pageHeading">ตัวชี้วัด <span id="headingSubjectName"><?= data.subject_id ? '— ' + (data.subject_name || data.subject_id) : '' ?></span></h2>

  <div class="card">
    <div class="form-row" style="align-items: center;">
      <div class="form-group" style="margin-bottom:0; flex:1">
        <label for="subjectSelect" style="font-weight:bold;font-size:14px">เลือกวิชาเพื่อจัดการตัวชี้วัด</label>
        <select id="subjectSelect" onchange="onSubjectChange()" style="width:100%;max-width:400px;margin-top:8px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm)">
          <option value="">— กรุณาเลือกวิชา —</option>
        </select>
      </div>
    </div>
  </div>

  <div id="editorSection" style="<?= data.subject_id ? '' : 'display:none' ?>">
    <div class="card">
      <h3>เพิ่มตัวชี้วัดใหม่</h3>
      <div class="form-row">
        <div class="form-group" style="flex:2;min-width:200px">
          <label>รหัสตัวชี้วัด (code)</label>
          <input type="text" id="newCode" placeholder="เช่น ต 1.1 ป.1/1">
        </div>
        <div class="form-group" style="flex:3;min-width:200px">
          <label>คำอธิบาย</label>
          <input type="text" id="newDesc" placeholder="คำอธิบาย (ไม่บังคับ)">
        </div>
        <div class="form-group" style="min-width:100px">
          <label>คะแนนสูงสุด</label>
          <input type="number" id="newMaxScore" value="3" min="1" max="10">
        </div>
        <div class="form-group" style="min-width:80px">
          <label>ลำดับ</label>
          <input type="number" id="newOrder" placeholder="0" min="0">
        </div>
        <div class="form-group" style="justify-content:flex-end">
          <button class="btn-primary" id="addIndicatorBtn" onclick="addIndicator()">เพิ่ม</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>รายการตัวชี้วัด</h3>
      <button class="btn-primary preseed-btn" id="preseedBtn" onclick="preseedIndicators()">เพิ่มตัวชี้วัดเริ่มต้น (ภาษาอังกฤษ ป.1)</button>
      <div class="loading-msg" id="indicatorsLoading">
        <div class="skeleton-table">
          <div class="skeleton-table-row skeleton-table-head"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:10%"></div></div>
          <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:10%"></div></div>
          <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:10%"></div></div>
          <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:10%"></div></div>
          <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:10%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:45%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:10%"></div></div>
        </div>
      </div>
      <table id="indicatorsTable" style="display:none">
        <thead>
          <tr>
            <th>ลำดับ</th>
            <th>รหัสตัวชี้วัด</th>
            <th>คำอธิบาย</th>
            <th>คะแนนสูงสุด</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="indicatorsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var SUBJECT_ID = '<?!= data.subject_id || '' ?>';

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadIndicators() {
  document.getElementById('indicatorsLoading').style.display = 'block';
  document.getElementById('indicatorsTable').style.display = 'none';
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      renderIndicators((result && result.indicators) ? result.indicators : []);
    })
    .withFailureHandler(function(err) { showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error'); })
    .getIndicatorsList(TOKEN, SUBJECT_ID);
}

function renderIndicators(indicators) {
  document.getElementById('indicatorsLoading').style.display = 'none';
  var tbody = document.getElementById('indicatorsBody');
  tbody.innerHTML = '';
  if (indicators.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:#aaa;text-align:center">ยังไม่มีตัวชี้วัด</td></tr>';
  } else {
    indicators.forEach(function(ind) {
      var tr = document.createElement('tr');
      tr.setAttribute('data-indicator-id', ind.indicator_id);
      tr.innerHTML =
        '<td>' + escHtml(ind.display_order) + '</td>' +
        '<td>' + escHtml(ind.code) + '</td>' +
        '<td>' + escHtml(ind.description) + '</td>' +
        '<td>' + escHtml(ind.max_score) + '</td>' +
        '<td><button class="btn-danger" onclick="deleteIndicator(\'' + escHtml(ind.indicator_id) + '\')" style="font-size:12px;padding:5px 12px">ลบ</button></td>';
      tbody.appendChild(tr);
    });
  }
  document.getElementById('indicatorsTable').style.display = 'table';
}

function addIndicator() {
  var code = document.getElementById('newCode').value.trim();
  var description = document.getElementById('newDesc').value.trim();
  var max_score = document.getElementById('newMaxScore').value.trim();
  var display_order = document.getElementById('newOrder').value.trim();

  if (!code) { showToast('กรุณากรอกรหัสตัวชี้วัด', 'error'); return; }

  var btn = document.getElementById('addIndicatorBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มตัวชี้วัดสำเร็จ', 'success');
      document.getElementById('newCode').value = '';
      document.getElementById('newDesc').value = '';
      document.getElementById('newMaxScore').value = '3';
      document.getElementById('newOrder').value = '';
      loadIndicators();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddIndicator(TOKEN, SUBJECT_ID, code, description, max_score, display_order);
}

function deleteIndicator(indicator_id) {
  if (!confirm('ยืนยันการลบตัวชี้วัด?')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('ลบตัวชี้วัดสำเร็จ', 'success');
      loadIndicators();
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .serverDeleteIndicator(TOKEN, indicator_id);
}

function preseedIndicators() {
  var btn = document.getElementById('preseedBtn');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มตัวชี้วัดเริ่มต้นสำเร็จ (' + (result.added || 0) + ' รายการ)', 'success');
      loadIndicators();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .preseedIndicators(TOKEN, SUBJECT_ID);
}

function loadSubjects() {
  google.script.run
    .withSuccessHandler(function(result) {
      var sel = document.getElementById('subjectSelect');
      var subjects = (result && result.subjects) ? result.subjects : [];
      sel.innerHTML = '<option value="">— กรุณาเลือกวิชา —</option>';
      subjects.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.subject_id;
        opt.textContent = (s.subject_code ? s.subject_code + ' — ' : '') + s.subject_name;
        sel.appendChild(opt);
      });
      if (SUBJECT_ID) {
        sel.value = SUBJECT_ID;
      }
    })
    .withFailureHandler(function(err) {
      showToast('โหลดรายชื่อวิชาไม่สำเร็จ: ' + err.message, 'error');
    })
    .getSubjectsList(TOKEN);
}

function onSubjectChange() {
  var sel = document.getElementById('subjectSelect');
  var val = sel.value;
  var headingSubjectName = document.getElementById('headingSubjectName');
  var editorSection = document.getElementById('editorSection');
  
  if (!val) {
    SUBJECT_ID = '';
    headingSubjectName.textContent = '';
    editorSection.style.display = 'none';
  } else {
    SUBJECT_ID = val;
    var selectedText = sel.options[sel.selectedIndex].text;
    headingSubjectName.textContent = ' — ' + selectedText;
    editorSection.style.display = 'block';
    loadIndicators();
  }
}

loadSubjects();
if (SUBJECT_ID) {
  loadIndicators();
}
</script>
</body>
</html>

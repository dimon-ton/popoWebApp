<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Status — PopoWebApp</title>
  <?!= include('_styles') ?>
  <style>
    thead th { background: var(--brand); color: white; border-bottom: none; }
    .count { font-weight: 700; color: var(--brand); }
  </style>
</head>
<body>
  <div class="navbar">
    <span class="navbar-title">PopoWebApp — DB Status</span>
    <div class="navbar-user">dev only</div>
  </div>
  <div class="container">
    <div class="card">
      <h2>สถานะฐานข้อมูล (DB Status)</h2>
      <p class="loading" id="loading">กำลังโหลด...</p>
      <table id="statusTable" style="display:none">
        <thead>
          <tr><th>ชื่อ Tab</th><th>จำนวนแถว (รวม Header)</th></tr>
        </thead>
        <tbody id="statusBody"></tbody>
      </table>
    </div>
  </div>
  <script>
    google.script.run
      .withSuccessHandler(function(rows) {
        document.getElementById('loading').style.display = 'none';
        var tbody = document.getElementById('statusBody');
        rows.forEach(function(r) {
          var tr = document.createElement('tr');
          tr.setAttribute('data-tab', r.tab);
          tr.innerHTML = '<td>' + r.tab + '</td><td class="count" data-count="' + r.count + '">' + r.count + '</td>';
          tbody.appendChild(tr);
        });
        document.getElementById('statusTable').style.display = 'table';
      })
      .withFailureHandler(function(err) {
        document.getElementById('loading').textContent = 'Error: ' + err.message;
      })
      .getDbStatus();
  </script>
</body>
</html>

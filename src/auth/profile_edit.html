<script>
var TOKEN = '<?= data.token ?>';
var SESSION = {
  user_id: '<?= data.session ? data.session.user_id : "" ?>',
  full_name: '<?= data.session ? data.session.full_name : "" ?>',
  role: '<?= data.session ? data.session.role : "" ?>',
  avatar: '<?= data.session && data.session.avatar ? data.session.avatar : "" ?>'
};

function initProfileAvatar() {
  var ph = document.getElementById('profileAvatarPlaceholder');
  if (!ph) return;
  if (typeof google === 'undefined' || !google.script || !TOKEN) return;
  google.script.run
    .withSuccessHandler(function(profile) {
      if (!profile || profile.error) return;
      var hasCustomAvatar = !!profile.avatar;
      var avatarSrc = profile.avatar || DEFAULT_PROFILE_AVATAR_URL;
      SESSION.avatar = profile.avatar || '';
      var nameEl = document.getElementById('avatarFileName');
      if (nameEl && hasCustomAvatar) nameEl.textContent = 'profile_image.png';
      var removeBtn = document.getElementById('removeAvatarBtn');
      if (removeBtn) removeBtn.style.display = hasCustomAvatar ? 'inline-flex' : 'none';
      
      var p = document.getElementById('profileAvatarPlaceholder');
      var img = new Image();
      img.id = 'profileAvatar';
      img.alt = 'รูปโปรไฟล์';
      img.style.cssText = 'width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border)';
      img.onload = function() {
        if (p && p.parentNode) p.parentNode.replaceChild(img, p);
      };
      img.src = avatarSrc;
    })
    .withFailureHandler(function() {})
    .serverGetCurrentUserProfile(TOKEN);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initProfileAvatar);
else initProfileAvatar();

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || 'success');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

(function init() {
  var knownPrefixes = ['เด็กชาย','เด็กหญิง','นาย','นาง','นางสาว'];
  var fullName = SESSION.full_name;
  var prefix = '', firstName = '', lastName = '';
  var found = false;
  for (var i = 0; i < knownPrefixes.length; i++) {
    if (fullName.indexOf(knownPrefixes[i]) === 0) {
      prefix = knownPrefixes[i];
      var rest = fullName.substring(knownPrefixes[i].length);
      var parts = rest.trim().split(/\s+/);
      firstName = parts[0] || '';
      lastName = parts.slice(1).join(' ');
      found = true;
      break;
    }
  }
  if (!found) {
    var parts = fullName.trim().split(/\s+/);
    firstName = parts[0] || '';
    lastName = parts.slice(1).join(' ');
  }
  document.getElementById('editPrefix').value = prefix;
  document.getElementById('editFirstName').value = firstName;
  document.getElementById('editLastName').value = lastName;
  document.getElementById('editRoleDisplay').value = SESSION.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ครู';

  if (SESSION.avatar) {
    document.getElementById('removeAvatarBtn').style.display = 'inline-flex';
    document.getElementById('avatarFileName').textContent = 'profile_image.png';
  }
})();

/* ===== CROP MODAL LOGIC ===== */
var cropState = {
  img: null,
  fileName: '',
  scale: 1,
  minScale: 1,
  offsetX: 0,
  offsetY: 0,
  dragging: false,
  dragStartX: 0,
  dragStartY: 0,
  dragOffsetX: 0,
  dragOffsetY: 0,
  canvasSize: 0,
  circleRadius: 0,
  pinchDist: 0
};

function openCropModal(imgSrc, fileName) {
  cropState.fileName = fileName;
  cropState.img = new Image();
  cropState.img.onload = function() {
    var overlay = document.getElementById('cropOverlay');
    overlay.classList.add('open');
    initCropCanvas();
  };
  cropState.img.src = imgSrc;
}

function closeCropModal() {
  document.getElementById('cropOverlay').classList.remove('open');
  cropState.img = null;
}

function initCropCanvas() {
  var wrap = document.getElementById('cropCanvasWrap');
  var canvas = document.getElementById('cropCanvas');
  var rect = wrap.getBoundingClientRect();
  var size = Math.floor(rect.width);
  cropState.canvasSize = size;
  cropState.circleRadius = Math.floor(size * 0.42);

  canvas.width = size;
  canvas.height = size;

  // Calculate minimum scale so image covers the circle
  var img = cropState.img;
  var circDiam = cropState.circleRadius * 2;
  var scaleW = circDiam / img.width;
  var scaleH = circDiam / img.height;
  cropState.minScale = Math.max(scaleW, scaleH);
  cropState.scale = cropState.minScale;
  cropState.offsetX = 0;
  cropState.offsetY = 0;

  // Reset slider
  var slider = document.getElementById('cropSlider');
  slider.value = 100;

  drawCrop();
}

function drawCrop() {
  var canvas = document.getElementById('cropCanvas');
  var ctx = canvas.getContext('2d');
  var size = cropState.canvasSize;
  var cx = size / 2;
  var cy = size / 2;
  var r = cropState.circleRadius;

  ctx.clearRect(0, 0, size, size);

  // Draw the image
  var img = cropState.img;
  var s = cropState.scale;
  var drawW = img.width * s;
  var drawH = img.height * s;
  var drawX = cx - drawW / 2 + cropState.offsetX;
  var drawY = cy - drawH / 2 + cropState.offsetY;

  ctx.drawImage(img, drawX, drawY, drawW, drawH);

  // Dark overlay outside circle
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, size, size);
  // Cut out circle
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Circle border
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Subtle crosshair
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.lineTo(cx, cy + r);
  ctx.moveTo(cx - r, cy);
  ctx.lineTo(cx + r, cy);
  ctx.stroke();
  ctx.restore();
}

function clampOffset() {
  var img = cropState.img;
  var s = cropState.scale;
  var drawW = img.width * s;
  var drawH = img.height * s;
  var r = cropState.circleRadius;

  // The image must cover the full circle area
  var maxOffX = Math.max(0, drawW / 2 - r);
  var maxOffY = Math.max(0, drawH / 2 - r);

  cropState.offsetX = Math.max(-maxOffX, Math.min(maxOffX, cropState.offsetX));
  cropState.offsetY = Math.max(-maxOffY, Math.min(maxOffY, cropState.offsetY));
}

function setZoom(pct) {
  // pct: 100 = minScale, 300 = minScale * 3
  var factor = pct / 100;
  cropState.scale = cropState.minScale * factor;
  clampOffset();
  drawCrop();
}

function getCroppedDataUrl() {
  var outSize = 256;
  var outCanvas = document.createElement('canvas');
  outCanvas.width = outSize;
  outCanvas.height = outSize;
  var ctx = outCanvas.getContext('2d');

  var size = cropState.canvasSize;
  var cx = size / 2;
  var cy = size / 2;
  var r = cropState.circleRadius;
  var img = cropState.img;
  var s = cropState.scale;

  // Source rect in image coordinates
  var drawW = img.width * s;
  var drawH = img.height * s;
  var imgCenterX = img.width / 2 - cropState.offsetX / s;
  var imgCenterY = img.height / 2 - cropState.offsetY / s;
  var srcSize = r * 2 / s;
  var sx = imgCenterX - srcSize / 2;
  var sy = imgCenterY - srcSize / 2;

  ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, outSize, outSize);

  return outCanvas.toDataURL('image/png');
}

// Set up event listeners after DOM ready
function initCropListeners() {
  var wrap = document.getElementById('cropCanvasWrap');
  var slider = document.getElementById('cropSlider');

  // Mouse drag
  wrap.addEventListener('mousedown', function(e) {
    e.preventDefault();
    cropState.dragging = true;
    cropState.dragStartX = e.clientX;
    cropState.dragStartY = e.clientY;
    cropState.dragOffsetX = cropState.offsetX;
    cropState.dragOffsetY = cropState.offsetY;
  });
  window.addEventListener('mousemove', function(e) {
    if (!cropState.dragging) return;
    cropState.offsetX = cropState.dragOffsetX + (e.clientX - cropState.dragStartX);
    cropState.offsetY = cropState.dragOffsetY + (e.clientY - cropState.dragStartY);
    clampOffset();
    drawCrop();
  });
  window.addEventListener('mouseup', function() {
    cropState.dragging = false;
  });

  // Touch drag + pinch
  wrap.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (e.touches.length === 1) {
      cropState.dragging = true;
      cropState.dragStartX = e.touches[0].clientX;
      cropState.dragStartY = e.touches[0].clientY;
      cropState.dragOffsetX = cropState.offsetX;
      cropState.dragOffsetY = cropState.offsetY;
    } else if (e.touches.length === 2) {
      cropState.dragging = false;
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      cropState.pinchDist = Math.sqrt(dx * dx + dy * dy);
      cropState.pinchScale = cropState.scale;
    }
  }, { passive: false });
  wrap.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 1 && cropState.dragging) {
      cropState.offsetX = cropState.dragOffsetX + (e.touches[0].clientX - cropState.dragStartX);
      cropState.offsetY = cropState.dragOffsetY + (e.touches[0].clientY - cropState.dragStartY);
      clampOffset();
      drawCrop();
    } else if (e.touches.length === 2 && cropState.pinchDist) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var newDist = Math.sqrt(dx * dx + dy * dy);
      var ratio = newDist / cropState.pinchDist;
      cropState.scale = Math.max(cropState.minScale, Math.min(cropState.minScale * 3, cropState.pinchScale * ratio));
      // Update slider
      var pct = Math.round((cropState.scale / cropState.minScale) * 100);
      slider.value = Math.min(300, Math.max(100, pct));
      clampOffset();
      drawCrop();
    }
  }, { passive: false });
  wrap.addEventListener('touchend', function(e) {
    cropState.dragging = false;
    if (e.touches.length < 2) cropState.pinchDist = 0;
  });

  // Mouse wheel zoom
  wrap.addEventListener('wheel', function(e) {
    e.preventDefault();
    var delta = e.deltaY > 0 ? -10 : 10;
    var newVal = Math.max(100, Math.min(300, parseInt(slider.value) + delta));
    slider.value = newVal;
    setZoom(newVal);
  }, { passive: false });

  // Slider
  slider.addEventListener('input', function() {
    setZoom(parseInt(this.value));
  });

  // Buttons
  document.getElementById('cropCloseBtn').addEventListener('click', closeCropModal);
  document.getElementById('cropCancelBtn').addEventListener('click', closeCropModal);
  document.getElementById('cropOkBtn').addEventListener('click', function() {
    var b64 = getCroppedDataUrl();
    closeCropModal();
    uploadCroppedAvatar(b64, cropState.fileName);
  });

  // Close on overlay click
  document.getElementById('cropOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeCropModal();
  });

  // Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('cropOverlay').classList.contains('open')) {
      closeCropModal();
    }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initCropListeners);
else initCropListeners();

/* ===== AVATAR SELECT → open crop modal instead of direct upload ===== */
function onAvatarSelect(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.size > 5000000) {
    showToast('ไฟล์ใหญ่เกินไป (สูงสุด 5MB)', 'error');
    input.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    openCropModal(ev.target.result, file.name);
  };
  reader.readAsDataURL(file);
  // Reset so same file can be re-selected
  input.value = '';
}

function showUploadLoading() {
  if (document.getElementById('uploadLoadingOverlay')) return;
  var overlay = document.createElement('div');
  overlay.id = 'uploadLoadingOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:inherit;pointer-events:all;';

  var spinner = document.createElement('div');
  spinner.style.cssText = 'width:40px;height:40px;border:4px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:uploadSpinnerAnim 0.8s linear infinite;margin-bottom:16px;';
  
  var text = document.createElement('div');
  text.style.cssText = 'font-size:15px;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,0.2);';
  text.textContent = 'กำลังอัพโหลดรูปภาพ...';

  if (!document.getElementById('uploadSpinnerStyle')) {
    var style = document.createElement('style');
    style.id = 'uploadSpinnerStyle';
    style.textContent = '@keyframes uploadSpinnerAnim{to{transform:rotate(360deg)}}';
    document.head.appendChild(style);
  }

  overlay.appendChild(spinner);
  overlay.appendChild(text);
  document.body.appendChild(overlay);
}

function hideUploadLoading() {
  var overlay = document.getElementById('uploadLoadingOverlay');
  if (overlay) overlay.remove();
  var style = document.getElementById('uploadSpinnerStyle');
  if (style) style.remove();
}

function uploadCroppedAvatar(b64, fileName) {
  showUploadLoading();
  document.getElementById('avatarFileName').textContent = 'กำลังอัพโหลด...';
  google.script.run
    .withSuccessHandler(function(result) {
      hideUploadLoading();
      if (result && result.error) {
        showToast(result.error, 'error');
        document.getElementById('avatarFileName').textContent = 'ยังไม่ได้เลือก';
        return;
      }
      SESSION.avatar = result.avatarUrl;
      document.getElementById('avatarFileName').textContent = fileName || 'avatar.png';
      document.getElementById('removeAvatarBtn').style.display = 'inline-flex';
      var imgEl = document.getElementById('profileAvatar');
      if (imgEl) { imgEl.src = b64; }
      else {
        var ph = document.getElementById('profileAvatarPlaceholder');
        if (ph) {
          var newImg = document.createElement('img');
          newImg.id = 'profileAvatar';
          newImg.src = b64;
          newImg.style.cssText = 'width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border)';
          ph.parentNode.replaceChild(newImg, ph);
        }
      }
      showToast('อัพโหลดรูปภาพสำเร็จ', 'success');
    })
    .withFailureHandler(function(err) {
      hideUploadLoading();
      document.getElementById('avatarFileName').textContent = 'ยังไม่ได้เลือก';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverUploadAvatar(TOKEN, b64);
}

function removeAvatar() {
  SESSION.avatar = '';
  document.getElementById('avatarFileName').textContent = 'ยังไม่ได้เลือก';
  document.getElementById('removeAvatarBtn').style.display = 'none';
  var img = document.getElementById('profileAvatar');
  if (img) {
    img.src = DEFAULT_PROFILE_AVATAR_URL;
    img.alt = 'รูปโปรไฟล์เริ่มต้น';
  } else {
    var ph = document.getElementById('profileAvatarPlaceholder');
    if (ph && ph.parentNode) {
      var defaultImg = document.createElement('img');
      defaultImg.id = 'profileAvatar';
      defaultImg.src = DEFAULT_PROFILE_AVATAR_URL;
      defaultImg.alt = 'รูปโปรไฟล์เริ่มต้น';
      defaultImg.style.cssText = 'width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border)';
      ph.parentNode.replaceChild(defaultImg, ph);
    }
  }
  google.script.run
    .withSuccessHandler(function() {})
    .withFailureHandler(function() {})
    .serverRemoveAvatar(TOKEN);
}

function saveProfile() {
  var prefix = document.getElementById('editPrefix').value.trim();
  var firstName = document.getElementById('editFirstName').value.trim();
  var lastName = document.getElementById('editLastName').value.trim();
  var full_name = ((prefix ? prefix : '') + firstName + ' ' + lastName).trim();

  if (!firstName || !lastName) { showToast('กรุณากรอกชื่อและนามสกุล', 'error'); return; }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('บันทึกสำเร็จ', 'success');
      setTimeout(function() { navigate('dashboard'); }, 800);
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverEditProfile(TOKEN, full_name);
}

function navigate(page, params) {
  if (typeof showNavLoading === 'function') showNavLoading();
  if (params) {
    google.script.run
      .withSuccessHandler(function(html) {
        document.open(); document.write(html); document.close();
        if (typeof hideNavLoading === 'function') hideNavLoading();
      })
      .withFailureHandler(function(err) {
        if (typeof hideNavLoading === 'function') hideNavLoading();
        showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
      })
      .getPageHtmlWithParams(TOKEN, page, params.class_id || '', params.subject_id || '');
  } else {
    google.script.run
      .withSuccessHandler(function(html) {
        document.open(); document.write(html); document.close();
        if (typeof hideNavLoading === 'function') hideNavLoading();
      })
      .withFailureHandler(function(err) {
        if (typeof hideNavLoading === 'function') hideNavLoading();
        showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
      })
      .getPageHtml(TOKEN, page);
  }
}

function doLogout() {
  localStorage.removeItem('popo_token');
  window.location.href = '<?= ScriptApp.getService().getUrl() ?>';
}

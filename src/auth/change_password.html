<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เปลี่ยนรหัสผ่าน — PopoWebApp</title>
  <?!= include('_styles') ?>
</head>
<body class="page-change-password" data-force-password-change="<?= data.session && data.session.must_change_pwd ? 'true' : 'false' ?>" data-manual-back-button="true">
<div class="pw-card">
  <h2>เปลี่ยนรหัสผ่าน</h2>
  <p class="pw-subtitle"><? if (data.session && data.session.must_change_pwd) { ?>กรุณาตั้งรหัสผ่านใหม่ก่อนเข้าใช้งาน<? } else { ?>เพื่อความปลอดภัย กรุณายืนยันรหัสผ่านปัจจุบัน<? } ?></p>
  <div class="error" id="errBox" role="alert" aria-live="assertive"></div>
  <div class="pw-success" id="successBox" role="status" aria-live="polite"></div>
  <form id="changePasswordForm" novalidate onsubmit="doChange(event)">
    <div class="form-group">
      <label for="oldPassword">รหัสผ่านปัจจุบัน</label>
      <input type="password" id="oldPassword" placeholder="รหัสผ่านปัจจุบัน" autocomplete="current-password" required>
    </div>
    <div class="form-group">
      <label for="newPassword">รหัสผ่านใหม่</label>
      <input type="password" id="newPassword" placeholder="อย่างน้อย <?= data.min_password_length ?> ตัวอักษร" autocomplete="new-password" minlength="<?= data.min_password_length ?>" required>
    </div>
    <div class="form-group">
      <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
      <input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่านใหม่" autocomplete="new-password" minlength="<?= data.min_password_length ?>" required>
    </div>
    <div class="pw-actions">
      <button type="submit" class="pw-btn" id="changeBtn">เปลี่ยนรหัสผ่าน</button>
      <? if (!(data.session && data.session.must_change_pwd)) { ?>
      <button type="button" class="btn-secondary pw-cancel-btn" id="cancelBtn" onclick="navigate('dashboard')">ยกเลิก</button>
      <? } ?>
    </div>
  </form>
</div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var MIN_PASSWORD_LENGTH = <?= data.min_password_length ?>;
var changePasswordSubmitting = false;

function showChangeError(message) {
  var errBox = document.getElementById('errBox');
  errBox.textContent = message;
  errBox.className = 'error show';
}

function doChange(event) {
  if (event) event.preventDefault();
  if (changePasswordSubmitting) return;
  var oldPw = document.getElementById('oldPassword').value;
  var newPw = document.getElementById('newPassword').value;
  var confirmPw = document.getElementById('confirmPassword').value;
  var errBox = document.getElementById('errBox');

  if (!oldPw || !newPw || !confirmPw) {
    showChangeError('กรุณากรอกข้อมูลให้ครบถ้วน');
    return;
  }
  if (newPw.length < MIN_PASSWORD_LENGTH) {
    showChangeError('รหัสผ่านต้องมีอย่างน้อย ' + MIN_PASSWORD_LENGTH + ' ตัวอักษร');
    return;
  }
  if (newPw !== confirmPw) {
    showChangeError('รหัสผ่านใหม่ไม่ตรงกัน');
    return;
  }
  if (newPw === oldPw) {
    showChangeError('รหัสผ่านใหม่ต้องไม่เหมือนรหัสผ่านเดิม');
    return;
  }

  var btn = document.getElementById('changeBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  changePasswordSubmitting = true;
  btn.disabled = true;
  btn.textContent = 'กำลังเปลี่ยนรหัสผ่าน...';
  if (cancelBtn) cancelBtn.disabled = true;
  errBox.className = 'error';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) {
        changePasswordSubmitting = false;
        btn.disabled = false;
        btn.textContent = 'เปลี่ยนรหัสผ่าน';
        if (cancelBtn) cancelBtn.disabled = false;
        showChangeError(result.error);
        return;
      }
      localStorage.setItem('popo_token', TOKEN);
      document.getElementById('successBox').textContent = 'เปลี่ยนรหัสผ่านสำเร็จ';
      document.getElementById('successBox').className = 'pw-success show';
      setTimeout(function() { navigate('dashboard'); }, 1200);
    })
    .withFailureHandler(function() {
      changePasswordSubmitting = false;
      btn.disabled = false;
      btn.textContent = 'เปลี่ยนรหัสผ่าน';
      if (cancelBtn) cancelBtn.disabled = false;
      showChangeError('ไม่สามารถเปลี่ยนรหัสผ่านได้ กรุณาลองใหม่');
    })
    .serverChangePassword(TOKEN, oldPw, newPw);
}

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function() { showChangeError('ไม่สามารถเปิดหน้าที่ต้องการได้ กรุณาลองใหม่'); })
    .getPageHtml(TOKEN, page);
}
</script>
</body>
</html>

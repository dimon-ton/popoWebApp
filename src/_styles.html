<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand: #2456a6;
  --brand-dark: #163b73;
  --brand-light: #eaf2ff;
  --brand-hover: #f5f9ff;
  --green: #24845e;
  --green-dark: #1d6b4d;
  --red: #d6493f;
  --red-dark: #b8322b;
  --amber: #b7791f;
  --purple: #6d5bd0;
  --text: #172033;
  --text-muted: #667085;
  --border: #d8e1ef;
  --border-focus: #2456a6;
  --bg-page: #f5f8fc;
  --bg-card: #ffffff;
  --bg-table-head: #eef4fb;
  --shadow-card: 0 18px 40px rgba(22, 59, 115, 0.08);
  --shadow-nav: 0 14px 34px rgba(12, 36, 74, 0.18);
  --button-brand: #2456a6;
  --button-brand-strong: #163b73;
  --button-brand-ring: rgba(36, 86, 166, 0.22);
  --button-secondary: #e8edf5;
  --button-secondary-hover: #dbe4f0;
  --button-tertiary: #f5f8fc;
  --button-success: #24845e;
  --button-success-strong: #1d6b4d;
  --button-success-ring: rgba(36, 132, 94, 0.22);
  --button-danger: #d6493f;
  --button-danger-strong: #b8322b;
  --button-danger-ring: rgba(214, 73, 63, 0.22);
  --button-warning: #b7791f;
  --button-warning-strong: #925f18;
  --button-warning-ring: rgba(183, 121, 31, 0.24);
  --button-dark: #070b1d;
  --button-dark-strong: #111827;
  --button-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
  --radius: 8px;
  --radius-sm: 5px;
  --radius-pill: 20px;
}

body {
  font-family: 'Sarabun', 'Noto Sans Thai', 'TH Sarabun New', Arial, sans-serif;
  background:
    linear-gradient(180deg, rgba(234, 242, 255, 0.84) 0, rgba(245, 248, 252, 0) 220px),
    var(--bg-page);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body:has(.navbar) {
  padding-top: 52px;
}

/* ===== NAVBAR ===== */
.navbar {
  background: linear-gradient(90deg, #163b73 0%, #2456a6 62%, #247c91 100%);
  color: white;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 4px;
  height: 52px;
  box-shadow: var(--shadow-nav);
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
}

.navbar-title {
  display: inline-flex;
  flex-direction: column;
  justify-content: center;
  margin-right: 8px;
  cursor: pointer;
  white-space: nowrap;
  line-height: 1.25;
  gap: 3px;
}
.navbar-title .title-text {
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: #ffffff;
}
.navbar-title .subtitle-text {
  font-size: 11px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.75);
}
.navbar-title .title-main {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
}
.navbar-title .title-sub {
  font-size: 11px;
  font-weight: 400;
  opacity: 0.85;
}

.navbar a {
  color: rgba(255,255,255,0.88);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.navbar a:hover {
  background: rgba(255,255,255,0.18);
  color: white;
}

.navbar-user {
  margin-left: auto;
  position: relative;
  font-size: 13px;
  color: rgba(255,255,255,0.8);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.navbar-user-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-pill);
  transition: background 0.15s;
}
.navbar-user-trigger:hover {
  background: rgba(255,255,255,0.15);
}

.navbar-avatar {
  width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
  border: 2px solid rgba(255,255,255,0.5); flex-shrink: 0;
}
.navbar-avatar-placeholder {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8);
  flex-shrink: 0;
}
.avatar-data, .avd { display: none; }

.navbar-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 6px;
  background: white;
  border-radius: var(--radius);
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
  min-width: 200px;
  z-index: 1000;
  overflow: hidden;
  border: 1px solid var(--border);
}
.navbar-dropdown.open { display: block; }
.navbar-dropdown a {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  color: var(--text);
  font-size: 13px;
  text-decoration: none;
  transition: background 0.1s;
  background: none;
  border-radius: 0;
}
.navbar-dropdown a:hover {
  background: var(--bg-page);
  color: var(--text);
}
.navbar-dropdown a svg {
  width: 16px; height: 16px; flex-shrink: 0;
  opacity: 0.6;
}
.navbar-dropdown .dropdown-divider {
  border-top: 1px solid var(--border);
  margin: 0;
}

/* Persistent user-feedback entry point */
.app-feedback-footer { margin: 40px auto 0; padding: 0 20px 28px; color: var(--text-muted); max-width: 760px; }
.feedback-footer-card { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 16px 18px; text-align: left; background: linear-gradient(135deg, var(--brand-light, #eaf2ff), #fff); border: 1px solid var(--border, #d8e1ef); border-radius: 14px; box-shadow: 0 8px 20px rgba(22, 59, 115, .06); }
.feedback-footer-copy { display: flex; align-items: center; gap: 12px; min-width: 0; }
.feedback-footer-icon { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 38px; color: var(--brand, #2456a6); background: #fff; border: 1px solid rgba(36, 86, 166, .16); border-radius: 10px; }
.feedback-footer-icon svg { width: 20px; height: 20px; }
.feedback-footer-title { margin: 0; color: var(--text, #172033); font-size: 14px; font-weight: 700; }
.feedback-footer-description { margin: 2px 0 0; font-size: 12px; line-height: 1.45; }
.app-feedback-footer a { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 14px; color: #fff; background: var(--brand, #2456a6); border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; white-space: nowrap; box-shadow: 0 3px 8px rgba(36, 86, 166, .2); transition: transform .15s ease, background .15s ease, box-shadow .15s ease; }
.app-feedback-footer a:hover { color: #fff; background: var(--brand-dark, #163b73); text-decoration: none; transform: translateY(-1px); box-shadow: 0 6px 12px rgba(36, 86, 166, .25); }
.app-feedback-footer a:focus-visible { outline: 3px solid rgba(36, 86, 166, .3); outline-offset: 3px; }
@media (max-width: 560px) { .app-feedback-footer { margin-top: 28px; padding: 0 12px 20px; } .feedback-footer-card { align-items: stretch; flex-direction: column; gap: 14px; padding: 15px; } .app-feedback-footer a { width: 100%; box-sizing: border-box; } }
.feedback-modal-backdrop { position: fixed; inset: 0; z-index: 20000; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(15, 23, 42, .5); }
.feedback-modal { width: min(100%, 560px); max-height: calc(100vh - 40px); overflow: auto; padding: 24px; border-radius: var(--radius, 12px); background: var(--bg-card, #fff); box-shadow: 0 20px 55px rgba(15, 23, 42, .28); }
.feedback-modal h2 { margin: 0 0 6px; font-size: 20px; color: var(--text, #172033); }
.feedback-modal p { margin: 0 0 18px; color: var(--text-muted); font-size: 14px; }
.feedback-modal label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; }
.feedback-modal input, .feedback-modal select, .feedback-modal textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border, #d8e1ef); border-radius: 8px; background: #fff; color: var(--text, #172033); font: inherit; }
.feedback-modal textarea { min-height: 120px; resize: vertical; }
.feedback-image-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.feedback-image-picker { display: flex; align-items: center; justify-content: center; min-height: 74px; padding: 12px; color: var(--brand, #2456a6); background: var(--brand-light, #eaf2ff); border: 1px dashed currentColor; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
.feedback-image-picker:hover { background: #dceaff; }
.feedback-image-help { margin: 6px 0 0 !important; font-size: 12px !important; }
.feedback-image-preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
.feedback-image-preview[hidden] { display: none; }
.feedback-image-item { position: relative; min-width: 0; }
.feedback-image-item img { display: block; width: 100%; height: 92px; object-fit: cover; border: 1px solid var(--border, #d8e1ef); border-radius: 8px; }
.feedback-image-remove { position: absolute; top: 5px; right: 5px; width: 25px; height: 25px; padding: 0; color: #fff; background: rgba(15, 23, 42, .82); border: 0; border-radius: 50%; cursor: pointer; font: inherit; font-size: 16px; line-height: 1; }
.feedback-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.feedback-modal-actions button { min-width: 92px; }

.dropdown-profile-header {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background: var(--bg-page);
}
.dropdown-avatar-wrap {
  width: 60px;
  height: 60px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dropdown-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.dropdown-avatar-placeholder {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--brand-light);
  color: var(--brand);
  font-size: 24px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.dropdown-profile-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
  word-break: break-word;
}
.dropdown-profile-role {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}

/* ===== CONTAINER ===== */
.container {
  max-width: 1000px;
  margin: 28px auto;
  padding: 0 20px;
}
.container.wide { max-width: 1200px; }
.container.narrow { max-width: 720px; }

/* ===== CARDS ===== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(36,86,166,0.12);
  overflow-x: auto;
}
.card.dropdown-card,
.card:has(.multi-checkbox-dropdown) {
  overflow: visible;
}

.card h2 {
  font-size: 18px;
  color: var(--brand);
  margin-bottom: 18px;
  font-weight: 600;
}

.card h3 {
  font-size: 14.5px;
  color: #444;
  margin-bottom: 14px;
  font-weight: 600;
}

h2.page-title {
  font-size: 20px;
  color: var(--brand);
  margin-bottom: 20px;
  font-weight: 600;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--brand);
  border-bottom: 2px solid var(--brand-light);
  padding-bottom: 6px;
  margin-bottom: 14px;
}

/* ===== BUTTONS ===== */
button, .btn {
  max-width: 100%;
  padding: 8px 20px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 13.5px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.15s, opacity 0.15s, transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  line-height: 1.28;
  text-align: center;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: normal;
  background: var(--button-brand);
  color: #fff;
  box-shadow: var(--button-shadow);
}
button svg, .btn svg {
  flex: 0 0 auto;
}
button:hover:not(:disabled), .btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(16, 24, 40, 0.12);
}
button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--button-brand-ring);
  outline-offset: 2px;
}

.btn-primary, button.btn-primary {
  background: var(--button-brand) !important;
  color: white !important;
  border: 1px solid transparent !important;
  border-radius: 999px !important;
  font-weight: 600 !important;
  box-shadow: var(--button-shadow);
}
.btn-primary:hover { background: var(--button-brand-strong) !important; }
.btn-primary:disabled { background: #9ca3af !important; cursor: not-allowed; box-shadow: none; }

.multi-checkbox-source[hidden] {
  display: none !important;
}
.multi-checkbox-dropdown {
  position: relative;
  width: 100%;
  min-width: 220px;
}
.multi-checkbox-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-height: 40px;
  padding: 8px 12px !important;
  border-radius: 8px !important;
  background: #ffffff !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
  box-shadow: var(--button-shadow);
  transform: none !important;
}
.multi-checkbox-trigger:hover {
  background: var(--bg-page) !important;
}
.multi-checkbox-label {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.multi-checkbox-caret {
  flex: 0 0 auto;
  font-size: 16px;
  line-height: 1;
}
.multi-checkbox-menu {
  position: absolute;
  z-index: 1200;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  max-height: 240px;
  padding: 8px;
  overflow-y: auto;
  background: #ffffff;
}
.modal .multi-checkbox-menu {
  z-index: 1600;
}
.multi-checkbox-menu.hidden {
  display: none !important;
}
.multi-checkbox-option {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.35;
  cursor: pointer;
  user-select: none;
  margin-bottom: 2px;
}
.multi-checkbox-option:hover {
  background: var(--bg-page);
}
.multi-checkbox-option.selected {
  background: var(--brand-light);
  color: var(--brand-dark);
}
.multi-checkbox-option:last-child {
  margin-bottom: 0;
}
.multi-checkbox-box,
.multi-checkbox-option input {
  flex: 0 0 auto;
  width: 16px !important;
  height: 16px !important;
  min-width: 16px;
  min-height: 16px;
  accent-color: var(--brand);
}
.multi-checkbox-option-text,
.multi-checkbox-option span {
  display: block;
  flex: 1 1 auto;
  min-width: 0;
  color: inherit;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.multi-checkbox-option.selected .multi-checkbox-option-text {
  color: var(--brand-dark);
  font-weight: 600;
}
.btn-primary[style*="#f59e0b"],
.btn-primary[style*="rgb(245, 158, 11)"] {
  background: var(--button-warning) !important;
}
.btn-primary[style*="#f59e0b"]:hover,
.btn-primary[style*="rgb(245, 158, 11)"]:hover {
  background: var(--button-warning-strong) !important;
}

.btn-secondary, button.btn-secondary {
  background: var(--button-secondary) !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
  border-radius: 999px !important;
  font-weight: 600 !important;
  box-shadow: var(--button-shadow);
}
.btn-secondary:hover { background: var(--button-secondary-hover) !important; color: var(--brand-dark) !important; border-color: #c7d3e4 !important; }
.btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-danger, button.btn-danger {
  background: var(--button-danger) !important;
  color: white !important;
  border: 1px solid transparent !important;
  border-radius: 999px !important;
  font-weight: 600 !important;
  box-shadow: var(--button-shadow);
}
.btn-danger:hover { background: var(--button-danger-strong) !important; }

.btn-save {
  padding: 9px 22px;
  background: var(--button-success) !important;
  color: white !important;
  border: 1px solid transparent !important;
  border-radius: 999px !important;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 600;
  box-shadow: var(--button-shadow);
}
.btn-save:hover { background: var(--button-success-strong) !important; }
.btn-save:disabled { background: #9ca3af !important; cursor: not-allowed; box-shadow: none; }

.btn-pdf {
  padding: 8px 22px;
  background: var(--button-dark) !important;
  color: white !important;
  border: 1px solid transparent !important;
  border-radius: 999px !important;
  font-size: 13.5px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 600;
  box-shadow: var(--button-shadow);
}
.btn-pdf:hover { background: var(--button-dark-strong) !important; }
.btn-pdf:disabled { background: #9ca3af !important; cursor: not-allowed; box-shadow: none; }

td button,
td .btn {
  min-height: 32px;
  padding: 5px 12px;
  font-size: 12px;
  line-height: 1.25;
  white-space: nowrap;
}

/* ===== FORMS ===== */
.form-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-end;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 130px;
}

.form-group label,
label {
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 500;
}

input[type="text"],
input[type="password"],
input[type="number"],
input[type="date"],
input[type="email"],
select,
textarea {
  padding: 8px 11px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-family: inherit;
  color: var(--text);
  background: white;
  transition: border-color 0.15s, box-shadow 0.15s;
}
select option {
  color: var(--text);
  background: #ffffff;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(26,86,160,0.1);
}

input[type="file"]:not([style*="opacity:0"]) {
  display: block;
  width: 100%;
  min-height: 42px;
  padding: 0 !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius);
  color: var(--text);
  background: var(--button-secondary);
  box-shadow: var(--button-shadow);
  font-size: 13.5px;
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}

input[type="file"]:not([style*="opacity:0"]):hover {
  background: var(--button-secondary-hover);
  border-color: #c7d3e4 !important;
}

input[type="file"]:not([style*="opacity:0"]):focus,
input[type="file"]:not([style*="opacity:0"]):focus-visible {
  outline: none;
  border-color: var(--button-brand) !important;
  box-shadow: 0 0 0 3px var(--button-brand-ring);
}

input[type="file"]:not([style*="opacity:0"])::file-selector-button {
  min-height: 40px;
  margin: 0 12px 0 0;
  padding: 0 16px;
  border: 0;
  border-right: 1px solid var(--border);
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  color: #fff;
  background: var(--button-brand);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

input[type="file"]:not([style*="opacity:0"])::file-selector-button:hover {
  background: var(--button-brand-strong);
}

.csv-import-row {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  flex-wrap: nowrap !important;
}
.csv-import-row > .form-group {
  min-width: 0 !important;
  margin-bottom: 0 !important;
  flex: 0 0 auto;
}
.csv-import-row > .form-group:has(input[type="file"]),
.csv-import-row > input[type="file"] {
  flex: 1 1 280px !important;
  min-width: 220px !important;
}
.csv-import-row input[type="file"]:not([style*="opacity:0"]) {
  width: auto !important;
  min-width: 0;
}
.csv-import-row button,
.csv-import-row .btn {
  flex: 0 0 auto;
  white-space: nowrap;
}

input.invalid,
input:invalid {
  border-color: var(--red);
}

/* ===== TABLES ===== */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  color: var(--text);
  background: var(--bg-card);
}

thead th {
  background: var(--button-secondary);
  padding: 12px 18px;
  text-align: left;
  border-bottom: 1px solid #c7d3e4;
  font-weight: 600;
  color: var(--text);
  font-size: 13px;
  white-space: nowrap;
}

thead th.center { text-align: center; }

tbody td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  background: var(--bg-card);
}

tbody tr:hover td { background: var(--button-tertiary); }
tbody tr:last-child td { border-bottom: none; }
tbody th {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  font-weight: 600;
  text-align: left;
  vertical-align: middle;
  white-space: nowrap;
}
tbody tr:hover th { background: var(--button-tertiary); }
tbody tr:last-child th { border-bottom: none; }
.table-wrap,
.table-responsive {
  overflow-x: auto;
  background: var(--button-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--button-shadow);
}
.table-wrap table,
.table-responsive table {
  margin: 0;
}

/* Blue header tables (audit log) */
thead.dark th {
  background: var(--brand);
  color: white;
  border-bottom: none;
}

/* Grade / score table cells */
td.total-col, th.total-col {
  font-weight: 700;
  color: var(--brand);
  background: #f4f8ff;
  text-align: center;
}
td.grade-col, th.grade-col {
  font-weight: 700;
  color: var(--green);
  background: #f0faf4;
  text-align: center;
}
td.makeup-col { background: #fffaf0; text-align: center; }
th.seq-col,
td.seq-col { text-align: center; color: var(--text-muted); width: 36px; min-width: 46px; }
td.name-col { text-align: left; white-space: nowrap; }
td.label-col { font-weight: 700; background: #f1f8f1; text-align: center; }
td.label-col.diyiam { color: #1a7a40; }
td.label-col.di { color: #2980b9; }
td.label-col.pass { color: #e67e22; }
td.label-col.fail { color: var(--red-dark); }

/* Score grids (attendance / formative) */
input.score-input {
  width: 40px;
  text-align: center;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  padding: 3px 2px;
  font-size: 13px;
  font-family: inherit;
}
input.score-input:focus {
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 2px rgba(26,86,160,0.12);
}

input.makeup-input {
  width: 52px;
  text-align: center;
  border: 1.5px solid var(--amber);
  border-radius: 4px;
  padding: 3px 2px;
  font-size: 13px;
  font-family: inherit;
  background: #fffaf0;
}
input.makeup-input:focus { border-color: #e67e22; outline: none; }

.page-class-attendance th.seq-col,
.page-class-attendance td.seq-col,
.page-class-formative th.seq-col,
.page-class-formative td.seq-col,
.page-class-summative th.seq-col,
.page-class-summative td.seq-col,
.page-class-characteristics th.seq-col,
.page-class-characteristics td.seq-col,
.page-class-readthinkwrite th.seq-col,
.page-class-readthinkwrite td.seq-col,
.page-class-dev-activity th:first-child,
.page-class-dev-activity td:first-child {
  position: sticky;
  left: 0;
  z-index: 12;
  background: var(--bg-card);
  box-shadow: 2px 0 5px -4px rgba(16, 24, 40, 0.28);
}
.page-class-attendance th.name-col,
.page-class-attendance td.name-col,
.page-class-formative th.name-col,
.page-class-formative td.name-col,
.page-class-summative th.name-col,
.page-class-summative td.name-col,
.page-class-characteristics th.name-col,
.page-class-characteristics td.name-col,
.page-class-readthinkwrite th.name-col,
.page-class-readthinkwrite td.name-col,
.page-class-dev-activity th.name-col,
.page-class-dev-activity td.name-col {
  position: sticky;
  left: 46px;
  z-index: 12;
  background: var(--bg-card);
  box-shadow: 2px 0 5px -4px rgba(16, 24, 40, 0.28);
}
.page-class-attendance thead th.seq-col,
.page-class-attendance thead th.name-col,
.page-class-formative thead th.seq-col,
.page-class-formative thead th.name-col,
.page-class-summative thead th.seq-col,
.page-class-summative thead th.name-col,
.page-class-characteristics thead th.seq-col,
.page-class-characteristics thead th.name-col,
.page-class-readthinkwrite thead th.seq-col,
.page-class-readthinkwrite thead th.name-col,
.page-class-dev-activity thead th:first-child,
.page-class-dev-activity thead th.name-col {
  z-index: 18;
  background: var(--bg-table-head);
}

/* Attendance cells */
.att-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 28px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
}
.att-cell.status-slash { background: #d4edda; color: #1a7a1a; }
.att-cell.status-la { background: #fff3cd; color: #856404; }
.att-cell.status-kho { background: #f8d7da; color: #721c24; }
.att-cell.status-empty { background: #f0f0f0; color: #ccc; }
.att-cell.readonly { cursor: default; }
.attendance-date-fill-link {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 2px 0 0;
  padding: 1px 4px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--brand);
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
  cursor: pointer;
}
.attendance-date-fill-link:hover,
.attendance-date-fill-link:focus {
  background: rgba(26, 86, 160, 0.08);
  color: var(--brand-dark);
  outline: none;
}
.attendance-date-fill-link:focus-visible {
  box-shadow: 0 0 0 2px rgba(26, 86, 160, 0.22);
}
.attendance-date-fill-link::after {
  content: attr(data-tooltip);
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  z-index: 30;
  width: max-content;
  max-width: 190px;
  padding: 6px 8px;
  border-radius: 6px;
  background: #1f2937;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
  white-space: normal;
  text-align: center;
  box-shadow: 0 10px 24px rgba(16, 24, 40, 0.2);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -3px);
  transition: opacity 0.12s, transform 0.12s;
}
.attendance-date-fill-link:hover::after,
.attendance-date-fill-link:focus::after {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ===== BADGES ===== */
.role-badge {
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  display: inline-block;
}
.role-badge.admin { background: #e8f0fe; color: var(--brand); }
.role-badge.teacher { background: #eafaf1; color: var(--green); }

.entity-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  background: #dbeafe;
  color: #1e40af;
}

.badge-count {
  display: inline-block;
  background: var(--brand);
  color: white;
  border-radius: var(--radius-pill);
  padding: 2px 8px;
  font-size: 12px;
}

/* Grade scale badges */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
}
.badge-4 { background: #27ae60; color: white; }
.badge-35 { background: #2ecc71; color: white; }
.badge-3 { background: #3498db; color: white; }
.badge-2 { background: #f39c12; color: white; }
.badge-1 { background: #e67e22; color: white; }
.badge-0 { background: var(--red-dark); color: white; }
.badge-diyiam { background: #27ae60; color: white; }
.badge-di { background: #3498db; color: white; }
.badge-pass { background: #f39c12; color: white; }
.badge-fail { background: var(--red-dark); color: white; }

/* ===== TOAST NOTIFICATIONS ===== */
.toast {
  position: fixed;
  top: 64px;
  right: 20px;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-size: 13.5px;
  z-index: 9999;
  display: none;
  max-width: 340px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  font-weight: 500;
}
.toast.success { background: var(--green); color: white; }
.toast.error { background: var(--red-dark); color: white; }
#toast { position: fixed; top: 64px; right: 20px; }

/* ===== SKELETON LOADING ===== */
@keyframes skeleton-pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
.skeleton { animation: skeleton-pulse 1.5s ease-in-out infinite; background: #e2e5e9; border-radius: 4px; }
.skeleton-fill { background: #e2e5e9; border-radius: 4px; animation: skeleton-pulse 1.5s ease-in-out infinite; }
.skeleton-row { display: flex; gap: 12px; margin-bottom: 10px; }
.skeleton-line { height: 14px; background: #e2e5e9; border-radius: 4px; animation: skeleton-pulse 1.5s ease-in-out infinite; }
.skeleton-line.w20 { width: 20%; }
.skeleton-line.w30 { width: 30%; }
.skeleton-line.w40 { width: 40%; }
.skeleton-line.w45 { width: 45%; }
.skeleton-line.w50 { width: 50%; }
.skeleton-line.w60 { width: 60%; }
.skeleton-line.w70 { width: 70%; }
.skeleton-line.w75 { width: 75%; }
.skeleton-line.w80 { width: 80%; }
.skeleton-line.w100 { width: 100%; }
.skeleton-block { height: 38px; background: #e2e5e9; border-radius: 4px; animation: skeleton-pulse 1.5s ease-in-out infinite; margin-bottom: 10px; }
.skeleton-table { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: white; }
.skeleton-table-row { display: flex; gap: 0; margin-bottom: 0; border-bottom: 1px solid var(--border); }
.skeleton-table-row:last-child { border-bottom: 0; }
.skeleton-table-cell { height: 38px; background: #e2e5e9; animation: skeleton-pulse 1.5s ease-in-out infinite; border-radius: 0; border-right: 1px solid var(--border); }
.skeleton-table-cell:last-child { border-right: 0; }
.skeleton-table-head .skeleton-table-cell { height: 42px; background: #d5dae0; }
.skeleton-table.compact .skeleton-table-cell { height: 32px; }
.skeleton-table.compact .skeleton-table-head .skeleton-table-cell { height: 36px; }
.skeleton-table.tall .skeleton-table-cell { height: 46px; }
.skeleton-table.two-tier .skeleton-table-head .skeleton-table-cell { height: 34px; }
.skeleton-table.two-tier .skeleton-table-row:nth-child(2) .skeleton-table-cell { height: 42px; background: #d5dae0; }

.skeleton-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
.skeleton-card { min-height: 76px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); padding: 14px; }
.skeleton-card .skeleton-line { margin-bottom: 8px; }
.skeleton-list { display: flex; flex-direction: column; gap: 10px; }
.skeleton-list-item { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); padding: 12px; }
.skeleton-list-item .skeleton-row { align-items: center; margin: 0; }
.skeleton-badge { width: 30px; height: 30px; border-radius: 999px; background: #d5dae0; animation: skeleton-pulse 1.5s ease-in-out infinite; flex: 0 0 auto; }
.skeleton-action-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; margin-top: 12px; }
.skeleton-action { height: 39px; border-radius: var(--radius-sm); background: #e2e5e9; animation: skeleton-pulse 1.5s ease-in-out infinite; border: 1px solid rgba(26,86,160,0.08); }
.skeleton-form { display: grid; gap: 12px; }
.skeleton-form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
.skeleton-field { display: flex; flex-direction: column; gap: 6px; }
.skeleton-field .skeleton-label { width: 36%; height: 13px; border-radius: 3px; background: #d5dae0; animation: skeleton-pulse 1.5s ease-in-out infinite; }
.skeleton-field .skeleton-input { height: 38px; border-radius: var(--radius-sm); background: #e2e5e9; animation: skeleton-pulse 1.5s ease-in-out infinite; }
.skeleton-button { width: 120px; height: 38px; border-radius: var(--radius-sm); background: #d5dae0; animation: skeleton-pulse 1.5s ease-in-out infinite; }

/* ===== NAVBAR SKELETONS ===== */
.navbar-title-skeleton {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.navbar-title-skeleton .skeleton-line-main {
  width: 140px;
  height: 14px;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 3px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}
.navbar-title-skeleton .skeleton-line-sub {
  width: 90px;
  height: 10px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 2px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}
.navbar-user-skeleton {
  display: flex;
  align-items: center;
  gap: 8px;
}
.navbar-user-skeleton .skeleton-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}
.navbar-user-skeleton .skeleton-name {
  width: 80px;
  height: 12px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 3px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}

/* ===== STATUS / NOTICES ===== */
.loading-msg {
  color: var(--text-muted);
  font-size: 13.5px;
  padding: 16px 0;
}
.nav-loading { position: fixed; inset: 0; background: var(--bg-page); z-index: 10000; display: flex; flex-direction: column; align-items: center; padding-top: 120px; }
.nav-loading .skeleton-block { width: 260px; }
.nav-loading .skeleton-menu { display: grid; grid-template-columns: repeat(3, 140px); gap: 10px; margin-top: 18px; }
.nav-loading .skeleton-menu-item { height: 44px; background: #e2e5e9; border-radius: var(--radius-sm); animation: skeleton-pulse 1.5s ease-in-out infinite; border: 1px solid var(--border); }

.readonly-notice {
  font-size: 13px;
  color: #78350f;
  margin-bottom: 12px;
  padding: 10px 14px;
  background: #fffbeb;
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--amber);
}

.empty-msg {
  text-align: center;
  color: var(--text-muted);
  padding: 32px;
  font-size: 14px;
}

/* ===== SAVE BAR ===== */
.save-bar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 14px;
  flex-wrap: wrap;
}
.save-bar .btn,
.save-bar button {
  flex: 0 1 auto;
}

/* ===== MODALS ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white;
  border-radius: var(--radius);
  padding: 28px;
  width: 380px;
  max-width: 94vw;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.modal h3 {
  font-size: 16px;
  margin-bottom: 18px;
  color: var(--brand);
  font-weight: 600;
}
.modal .form-group { margin-bottom: 14px; width: 100%; }
.modal .form-group input { width: 100%; }
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.modal-actions .btn,
.modal-actions button {
  flex: 0 1 auto;
  min-width: 92px;
}

/* ===== WEEK NAV (attendance) ===== */
.week-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.week-nav button {
  flex: 0 1 auto;
  padding: 7px 16px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  background: var(--button-secondary);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--button-shadow);
}
.week-nav button:hover { background: var(--button-secondary-hover); color: var(--brand-dark); box-shadow: 0 6px 14px rgba(16, 24, 40, 0.12); }
.week-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--brand);
}

/* ===== LEGEND (attendance) ===== */
.legend {
  display: flex;
  gap: 14px;
  font-size: 12.5px;
  color: var(--text-muted);
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-box {
  width: 20px; height: 20px;
  border-radius: 3px;
  display: inline-block;
}
.legend-box.slash { background: #d4edda; }
.legend-box.la { background: #fff3cd; }
.legend-box.kho { background: #f8d7da; }
.legend-box.empty { background: #f0f0f0; border: 1px solid var(--border); }

/* ===== DASHBOARD MENU GRID ===== */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
}
.menu-item {
  background: var(--button-tertiary);
  border-radius: 999px;
  min-height: 42px;
  padding: 10px 18px;
  text-align: center;
  text-decoration: none;
  color: var(--text);
  font-size: 14px;
  line-height: 1.3;
  font-weight: 600;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s, border-color 0.15s;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--button-shadow);
  overflow-wrap: anywhere;
}
.menu-item:hover {
  background: var(--button-secondary-hover);
  color: var(--brand-dark);
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(16, 24, 40, 0.12);
}

/* ===== FILTER ROW (audit) ===== */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 20px;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-group label { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }

/* ===== DRILL PANEL (workload) ===== */
.drill-panel {
  background: #f9fafb;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-top: 20px;
  display: none;
}
.drill-panel.open { display: block; }
.drill-panel h3 { font-size: 14.5px; margin-bottom: 12px; color: var(--brand); font-weight: 600; }
.drill-panel a { color: var(--brand); text-decoration: none; font-size: 13px; }
.drill-panel a:hover { text-decoration: underline; }

/* ===== TWO-COL LAYOUT ===== */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* ===== JSON VALUE (audit) ===== */
.json-val {
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: #555;
  max-width: 260px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ===== MISC ===== */
.loading { color: var(--text-muted); font-size: 14px; padding: 20px 0; }

.sum-cell { font-weight: 700; }
.sum-cell.ok { color: var(--green); }
.sum-cell.bad { color: var(--red-dark); }

.two-col-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
  font-size: 14px;
}
.info-row { display: flex; gap: 8px; }
.info-label { color: var(--text-muted); min-width: 120px; flex-shrink: 0; font-size: 13.5px; }
.info-value { font-weight: 600; }

/* ===== THAI DATE PICKER ===== */
.thai-date-picker {
  position: relative;

<script>
var THAI_DATE_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var THAI_DATE_WEEKDAYS = ['อา','จ','อ','พ','พฤ','ศ','ส'];

function padThaiDate(n) {
  return n < 10 ? '0' + n : String(n);
}

function parseIsoDateValue(value) {
  if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
  var parts = value.split('-');
  var y = Number(parts[0]);
  var m = Number(parts[1]) - 1;
  var d = Number(parts[2]);
  var date = new Date(y, m, d);
  if (date.getFullYear() !== y || date.getMonth() !== m || date.getDate() !== d) return null;
  return date;
}

function isoFromDateValue(date) {
  return date.getFullYear() + '-' + padThaiDate(date.getMonth() + 1) + '-' + padThaiDate(date.getDate());
}

function formatThaiDateValue(value) {
  var date = parseIsoDateValue(value);
  if (!date) return '';
  return date.getDate() + ' ' + THAI_DATE_MONTHS[date.getMonth()] + ' ' + (date.getFullYear() + 543);
}

function formatThaiBuddhistDate(value) {
  if (!value) return '';
  var date = value instanceof Date ? value : new Date(value);
  if (!date || isNaN(date.getTime())) return '';
  return padThaiDate(date.getDate()) + '/' + padThaiDate(date.getMonth() + 1) + '/' + (date.getFullYear() + 543);
}

function formatThaiBuddhistDateTime(value) {
  if (!value) return '';
  var date = value instanceof Date ? value : new Date(value);
  if (!date || isNaN(date.getTime())) return '';
  return formatThaiBuddhistDate(date) + ' ' + padThaiDate(date.getHours()) + ':' + padThaiDate(date.getMinutes());
}

function dispatchThaiDateChange(input) {
  if (!input) return;
  try {
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  } catch (e) {
    var inputEvent = document.createEvent('Event');
    inputEvent.initEvent('input', true, true);
    input.dispatchEvent(inputEvent);
    var changeEvent = document.createEvent('Event');
    changeEvent.initEvent('change', true, true);
    input.dispatchEvent(changeEvent);
  }
}

function setThaiDatePickerValue(target, value) {
  var root = target && target.getAttribute && target.getAttribute('data-thai-date-picker') !== null
    ? target
    : target && target.closest ? target.closest('[data-thai-date-picker]') : null;
  if (!root) return;
  var hidden = root.querySelector('[data-thai-date-value]');
  var display = root.querySelector('[data-thai-date-display]');
  var date = parseIsoDateValue(value);
  var iso = date ? isoFromDateValue(date) : '';
  if (hidden) hidden.value = iso;
  if (display) display.value = formatThaiDateValue(iso);
  root._thaiDateSelected = date || null;
  root._thaiDateView = date ? new Date(date.getFullYear(), date.getMonth(), 1) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  renderThaiDateCalendar(root);
  dispatchThaiDateChange(hidden);
}

function closeThaiDatePickers(exceptRoot) {
  var pickers = document.querySelectorAll('[data-thai-date-picker]');
  for (var i = 0; i < pickers.length; i++) {
    if (pickers[i] !== exceptRoot && pickers[i]._thaiDatePopover) pickers[i]._thaiDatePopover.hidden = true;
  }
}

function positionThaiDatePopover(root) {
  if (!root || !root._thaiDatePopover || !root._thaiDateDisplay || root._thaiDatePopover.hidden) return;
  var displayRect = root._thaiDateDisplay.getBoundingClientRect();
  var popover = root._thaiDatePopover;
  var gap = 6;
  var margin = 12;
  var width = Math.min(292, Math.max(260, window.innerWidth - (margin * 2)));
  popover.style.width = width + 'px';

  var left = displayRect.left;
  if (left + width > window.innerWidth - margin) left = window.innerWidth - margin - width;
  if (left < margin) left = margin;

  var popoverHeight = popover.offsetHeight || 330;
  var top = displayRect.bottom + gap;
  if (top + popoverHeight > window.innerHeight - margin && displayRect.top - popoverHeight - gap >= margin) {
    top = displayRect.top - popoverHeight - gap;
  }
  if (top < margin) top = margin;

  popover.style.left = left + 'px';
  popover.style.top = top + 'px';
}

function openThaiDatePicker(root) {
  if (!root || !root._thaiDatePopover) return;
  closeThaiDatePickers(root);
  root._thaiDatePopover.hidden = false;
  renderThaiDateCalendar(root);
  positionThaiDatePopover(root);
}

function buildThaiDatePopover(root) {
  var popover = document.createElement('div');
  popover.className = 'thai-date-popover';
  popover.hidden = true;
  popover.innerHTML =
    '<div class="thai-date-head">' +
      '<button type="button" class="thai-date-nav" data-thai-date-prev aria-label="เดือนก่อนหน้า">&lt;</button>' +
      '<div class="thai-date-month">' +
        '<select data-thai-date-month></select>' +
        '<select data-thai-date-year></select>' +
      '</div>' +
      '<button type="button" class="thai-date-nav" data-thai-date-next aria-label="เดือนถัดไป">&gt;</button>' +
    '</div>' +
    '<div class="thai-date-grid" data-thai-date-grid></div>' +
    '<div class="thai-date-actions">' +
      '<button type="button" data-thai-date-today>วันนี้</button>' +
      '<button type="button" data-thai-date-clear>ล้าง</button>' +
    '</div>';
  document.body.appendChild(popover);

  var monthSelect = popover.querySelector('[data-thai-date-month]');
  for (var m = 0; m < THAI_DATE_MONTHS.length; m++) {
    var monthOption = document.createElement('option');
    monthOption.value = String(m);
    monthOption.textContent = THAI_DATE_MONTHS[m];
    monthSelect.appendChild(monthOption);
  }

  popover.querySelector('[data-thai-date-prev]').onclick = function() {
    root._thaiDateView.setMonth(root._thaiDateView.getMonth() - 1);
    renderThaiDateCalendar(root);
    positionThaiDatePopover(root);
  };
  popover.querySelector('[data-thai-date-next]').onclick = function() {
    root._thaiDateView.setMonth(root._thaiDateView.getMonth() + 1);
    renderThaiDateCalendar(root);
    positionThaiDatePopover(root);
  };
  monthSelect.onchange = function() {
    root._thaiDateView.setMonth(Number(this.value));
    renderThaiDateCalendar(root);
    positionThaiDatePopover(root);
  };
  popover.querySelector('[data-thai-date-year]').onchange = function() {
    root._thaiDateView.setFullYear(Number(this.value));
    renderThaiDateCalendar(root);
    positionThaiDatePopover(root);
  };
  popover.querySelector('[data-thai-date-today]').onclick = function() {
    setThaiDatePickerValue(root, isoFromDateValue(new Date()));
    popover.hidden = true;
  };
  popover.querySelector('[data-thai-date-clear]').onclick = function() {
    setThaiDatePickerValue(root, '');
    popover.hidden = true;
  };
  return popover;
}

function renderThaiDateCalendar(root) {
  if (!root || !root._thaiDatePopover) return;
  var view = root._thaiDateView || new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  var popover = root._thaiDatePopover;
  var monthSelect = popover.querySelector('[data-thai-date-month]');
  var yearSelect = popover.querySelector('[data-thai-date-year]');
  var grid = popover.querySelector('[data-thai-date-grid]');
  var viewYear = view.getFullYear();

  monthSelect.value = String(view.getMonth());
  yearSelect.innerHTML = '';
  for (var y = viewYear - 80; y <= viewYear + 5; y++) {
    var yearOption = document.createElement('option');
    yearOption.value = String(y);
    yearOption.textContent = String(y + 543);
    if (y === viewYear) yearOption.selected = true;
    yearSelect.appendChild(yearOption);
  }

  grid.innerHTML = '';
  for (var w = 0; w < THAI_DATE_WEEKDAYS.length; w++) {
    var dow = document.createElement('div');
    dow.className = 'thai-date-dow';
    dow.textContent = THAI_DATE_WEEKDAYS[w];
    grid.appendChild(dow);
  }

  var firstDay = new Date(viewYear, view.getMonth(), 1);
  var daysInMonth = new Date(viewYear, view.getMonth() + 1, 0).getDate();
  var todayIso = isoFromDateValue(new Date());
  var selectedIso = root._thaiDateSelected ? isoFromDateValue(root._thaiDateSelected) : '';

  for (var e = 0; e < firstDay.getDay(); e++) {
    var empty = document.createElement('div');
    empty.className = 'thai-date-day empty';
    grid.appendChild(empty);
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var dayDate = new Date(viewYear, view.getMonth(), d);
    var iso = isoFromDateValue(dayDate);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'thai-date-day';
    if (iso === selectedIso) btn.className += ' selected';
    if (iso === todayIso) btn.className += ' today';
    btn.textContent = String(d);
    btn.setAttribute('data-thai-date-day', iso);
    btn.onclick = function() {
      setThaiDatePickerValue(root, this.getAttribute('data-thai-date-day'));
      root._thaiDatePopover.hidden = true;
    };
    grid.appendChild(btn);
  }
}

function initThaiDatePickers(scope) {
  var rootScope = scope || document;
  var pickers = rootScope.querySelectorAll ? rootScope.querySelectorAll('[data-thai-date-picker]') : [];
  for (var i = 0; i < pickers.length; i++) {
    var root = pickers[i];
    if (root._thaiDateReady) continue;
    var hidden = root.querySelector('[data-thai-date-value]');
    var display = root.querySelector('[data-thai-date-display]');
    if (!hidden || !display) continue;
    root._thaiDateReady = true;
    root._thaiDateHidden = hidden;
    root._thaiDateDisplay = display;
    root._thaiDatePopover = buildThaiDatePopover(root);
    var initialDate = parseIsoDateValue(hidden.value);
    root._thaiDateSelected = initialDate || null;
    root._thaiDateView = initialDate ? new Date(initialDate.getFullYear(), initialDate.getMonth(), 1) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    display.value = formatThaiDateValue(hidden.value);
    renderThaiDateCalendar(root);
    display.onclick = function(ev) {
      var currentRoot = ev.currentTarget.closest('[data-thai-date-picker]');
      if (currentRoot._thaiDatePopover.hidden) openThaiDatePicker(currentRoot);
      else currentRoot._thaiDatePopover.hidden = true;
    };
    display.onkeydown = function(ev) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        ev.currentTarget.click();
      }
    };
  }
}

document.addEventListener('click', function(ev) {
  if (!ev.target.closest) return;
  if (!ev.target.closest('[data-thai-date-picker]') && !ev.target.closest('.thai-date-popover')) closeThaiDatePickers();
});
window.addEventListener('resize', function() {
  var pickers = document.querySelectorAll('[data-thai-date-picker]');

else initThaiDatePickers(document);

function initNavbarDropdown() {
  var trigger = document.querySelector('.navbar-user-trigger');
  var dropdown = document.querySelector('.navbar-dropdown');
  if (!trigger || !dropdown) return;

  // Prepend Profile Header inside dropdown menu dynamically if not present
  if (!dropdown.querySelector('.dropdown-profile-header')) {
    var initialEl = trigger.querySelector('.navbar-avatar-placeholder, .navbar-avatar');
    var initialText = '';
    var avatarSrc = '';
    if (initialEl) {
      if (initialEl.classList.contains('navbar-avatar')) {
        avatarSrc = initialEl.src;
      } else {
        initialText = initialEl.textContent;
      }
    }

    var spanEl = trigger.querySelector('span');
    var rawName = spanEl ? spanEl.textContent : '';
    var cleanName = rawName.replace(/\s*\(admin\)$/i, '');
    var isAdmin = rawName.toLowerCase().indexOf('(admin)') !== -1;
    var roleText = isAdmin ? 'ผู้ดูแลระบบ' : 'ครู';

    var header = document.createElement('div');
    header.className = 'dropdown-profile-header';

    var avatarWrap = document.createElement('div');
    avatarWrap.className = 'dropdown-avatar-wrap';

    if (avatarSrc) {
      var img = document.createElement('img');
      img.className = 'dropdown-avatar';
      img.src = avatarSrc;
      avatarWrap.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'dropdown-avatar-placeholder';
      ph.textContent = initialText || '?';
      avatarWrap.appendChild(ph);
    }

    var nameEl = document.createElement('div');
    nameEl.className = 'dropdown-profile-name';
    nameEl.textContent = cleanName;

    var roleEl = document.createElement('div');
    roleEl.className = 'dropdown-profile-role';
    roleEl.textContent = roleText;

    header.appendChild(avatarWrap);
    header.appendChild(nameEl);
    header.appendChild(roleEl);

    var divider = document.createElement('div');
    divider.className = 'dropdown-divider';

    dropdown.insertBefore(divider, dropdown.firstChild);
    dropdown.insertBefore(header, dropdown.firstChild);
  }

  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    if (!dropdown.contains(e.target) && !trigger.contains(e.target)) {
      dropdown.classList.remove('open');
    }
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNavbarDropdown);

function initNavbarAvatar() {
  var titleEl = document.querySelector('.navbar-title');
  var userTrigger = document.querySelector('.navbar-user-trigger');
  
  if (typeof google === 'undefined' || !google.script) {
    restoreNavbarDefaults(titleEl, userTrigger);
    return;
  }
  
  if (typeof TOKEN === 'undefined' || !TOKEN) {
    restoreNavbarDefaults(titleEl, userTrigger);
    return;
  }
  
  // Show skeletons immediately while loading (redundant but ensures they show if page started differently)
  if (titleEl && !titleEl.querySelector('.navbar-title-skeleton')) {
    titleEl.innerHTML = '<div class="navbar-title-skeleton"><div class="skeleton-line-main"></div><div class="skeleton-line-sub"></div></div>';
  }
  if (userTrigger && !userTrigger.querySelector('.navbar-user-skeleton')) {
    userTrigger.innerHTML = '<div class="navbar-user-skeleton"><div class="skeleton-avatar"></div><div class="skeleton-name"></div></div>';
  }
  
  google.script.run
    .withSuccessHandler(function(profile) {
      if (!profile || profile.error) {
        restoreNavbarDefaults(titleEl, userTrigger);
        return;
      }

      if (profile.school_name) {
        if (titleEl) {
          titleEl.innerHTML = '<span class="title-text">ระบบจัดการ ป.พ.5 ออนไลน์</span>' +
                              '<span class="subtitle-text">' + profile.school_name + '</span>';
        }
      } else {
        if (titleEl) {
          titleEl.innerHTML = '<span class="title-text">ระบบจัดการ ป.พ.5 ออนไลน์</span>' +
                              '<span class="subtitle-text">โรงเรียนบ้านโพนแท่น</span>';
        }
      }

      var avatarSrc = profile.avatar || getDefaultProfileAvatarUrl();
      if (userTrigger) {
        var avatarHtml = '<img class="navbar-avatar" src="' + avatarSrc + '" alt="รูปโปรไฟล์" />';
        var nameSuffix = profile.role === 'admin' ? ' (admin)' : '';
        userTrigger.innerHTML = avatarHtml + '<span>' + profile.full_name + nameSuffix + '</span>';
      }

      var dropdownAvatarWrap = document.querySelector('.dropdown-avatar-wrap');
      if (dropdownAvatarWrap) {
        dropdownAvatarWrap.innerHTML = '';
        var lgImg = document.createElement('img');
        lgImg.className = 'dropdown-avatar';
        lgImg.src = avatarSrc;
        lgImg.alt = 'รูปโปรไฟล์';
        dropdownAvatarWrap.appendChild(lgImg);
      }

      var dropdownName = document.querySelector('.dropdown-profile-name');
      if (dropdownName && profile.full_name) {
        dropdownName.textContent = profile.full_name;
      }
      var dropdownRole = document.querySelector('.dropdown-profile-role');
      if (dropdownRole && profile.role) {
        dropdownRole.textContent = profile.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ครู';
      }
    })
    .withFailureHandler(function() {
      restoreNavbarDefaults(titleEl, userTrigger);
    })
    .serverGetCurrentUserProfile(TOKEN);
}

function restoreNavbarDefaults(titleEl, userTrigger) {
  if (titleEl) {
    titleEl.innerHTML = '<span class="title-main">ระบบจัดการ ปพ.5 ออนไลน์</span><span class="title-sub">โรงเรียนบ้านโพนแท่น</span>';

    userTrigger.innerHTML = '<div class="navbar-avatar-placeholder">?</div><span>ผู้ใช้งาน</span>';
  }
}

function initAssessmentTooltips(root) {
  root = root || document;
  var triggers = root.querySelectorAll('[data-assessment-tooltip]');
  if (!triggers.length) return;

  var tooltip = document.getElementById('assessmentTooltipPortal');
  if (!tooltip) {
    tooltip = document.createElement('div');
    tooltip.id = 'assessmentTooltipPortal';
    tooltip.className = 'assessment-tooltip';
    tooltip.setAttribute('role', 'tooltip');
    tooltip.hidden = true;
    document.body.appendChild(tooltip);
  }
  for (var i = 0; i < triggers.length; i++) {
    triggers[i].setAttribute('aria-describedby', tooltip.id);
  }

  if (document._assessmentTooltipBound) return;
  document._assessmentTooltipBound = true;
  var activeTrigger = null;
  var showTimer = null;
  var hideTimer = null;

  function positionTooltip() {
    if (!activeTrigger || tooltip.hidden) return;
    var rect = activeTrigger.getBoundingClientRect();
    var margin = 12;
    var gap = 8;
    tooltip.style.left = margin + 'px';
    tooltip.style.top = margin + 'px';
    var tooltipRect = tooltip.getBoundingClientRect();
    var left = rect.left + (rect.width - tooltipRect.width) / 2;
    left = Math.max(margin, Math.min(left, window.innerWidth - tooltipRect.width - margin));
    var top = rect.top - tooltipRect.height - gap;
    if (top < margin) top = rect.bottom + gap;
    if (top + tooltipRect.height > window.innerHeight - margin) {
      top = Math.max(margin, window.innerHeight - tooltipRect.height - margin);
    }
    tooltip.style.left = Math.round(left) + 'px';
    tooltip.style.top = Math.round(top) + 'px';
  }

  function showTooltip(trigger, immediate) {
    clearTimeout(hideTimer);
    clearTimeout(showTimer);
    showTimer = setTimeout(function() {
      activeTrigger = trigger;
      tooltip.textContent = trigger.getAttribute('data-assessment-tooltip') || '';
      tooltip.hidden = false;
      positionTooltip();
    }, immediate ? 0 : 140);
  }

  function hideTooltip(immediate) {
    clearTimeout(showTimer);
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() {
      tooltip.hidden = true;
      activeTrigger = null;
    }, immediate ? 0 : 90);
  }

  document.addEventListener('mouseover', function(event) {
    var trigger = event.target.closest && event.target.closest('[data-assessment-tooltip]');
    if (trigger) showTooltip(trigger, false);
  });
  document.addEventListener('mouseout', function(event) {
    var trigger = event.target.closest && event.target.closest('[data-assessment-tooltip]');
    if (trigger && (!event.relatedTarget || !trigger.contains(event.relatedTarget))) hideTooltip(false);
  });
  document.addEventListener('focusin', function(event) {
    var trigger = event.target.closest && event.target.closest('[data-assessment-tooltip]');
    if (trigger) showTooltip(trigger, false);
  });
  document.addEventListener('focusout', function(event) {
    var trigger = event.target.closest && event.target.closest('[data-assessment-tooltip]');
    if (trigger) hideTooltip(false);
  });
  document.addEventListener('click', function(event) {
    var trigger = event.target.closest && event.target.closest('[data-assessment-tooltip]');
    if (trigger) {
      if (activeTrigger === trigger && !tooltip.hidden) hideTooltip(true);
      else showTooltip(trigger, true);
      return;
    }
    hideTooltip(true);
  });
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') hideTooltip(true);
  });
  window.addEventListener('scroll', positionTooltip, true);
  window.addEventListener('resize', positionTooltip);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNavbarAvatar);
else initNavbarAvatar();

function openFeedbackModal() {
  if (document.getElementById('feedbackModalBackdrop')) return;
  var backdrop = document.createElement('div'); backdrop.id = 'feedbackModalBackdrop'; backdrop.className = 'feedback-modal-backdrop';
  backdrop.innerHTML = '<section class="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle"><h2 id="feedbackTitle">ส่งข้อเสนอแนะ</h2><p>แจ้งปัญหาที่พบ หรือเสนอฟีเจอร์ที่อยากให้มี ข้อความจะถูกส่งให้ผู้ดูแลระบบทาง Telegram</p><label for="feedbackType">ประเภท</label><select id="feedbackType"><option value="bug">แจ้งปัญหา</option><option value="feature">เสนอฟีเจอร์ใหม่</option></select><label for="feedbackSubject">หัวข้อ</label><input id="feedbackSubject" maxlength="160" required><label for="feedbackDetails">รายละเอียด</label><textarea id="feedbackDetails" maxlength="5000" required></textarea><label for="feedbackImage">ภาพหน้าจอ (ไม่บังคับ)</label><label class="feedback-image-picker" for="feedbackImage">เพิ่มภาพหน้าจอหรือรูปภาพประกอบ</label><input class="feedback-image-input" type="file" id="feedbackImage" accept="image/png,image/jpeg,image/webp" multiple><p class="feedback-image-help">แนบได้สูงสุด 5 ภาพ (JPG, PNG หรือ WebP) ภาพละไม่เกิน 3 MB</p><div class="feedback-image-preview" id="feedbackImagePreview" hidden></div><div class="feedback-modal-actions"><button type="button" class="btn btn-secondary" id="feedbackCancel">ยกเลิก</button><button type="button" class="btn btn-primary" id="feedbackSend">ส่งข้อความ</button></div></section>';
  backdrop.onclick = function(event) { if (event.target === backdrop) closeFeedbackModal(); };
  document.body.appendChild(backdrop); document.getElementById('feedbackCancel').onclick = closeFeedbackModal; document.getElementById('feedbackSend').onclick = sendFeedback; document.getElementById('feedbackImage').onchange = prepareFeedbackImage; document.getElementById('feedbackSubject').focus();
}
function closeFeedbackModal() { var backdrop = document.getElementById('feedbackModalBackdrop'); if (backdrop) backdrop.parentNode.removeChild(backdrop); }
var feedbackImagePayloads = []; var feedbackImagesLoading = false;
function prepareFeedbackImage(event) {
  var files = Array.prototype.slice.call(event.target.files || []); if (!files.length) return;
  if (feedbackImagePayloads.length + files.length > 5 || files.some(function(file) { return ['image/jpeg', 'image/png', 'image/webp'].indexOf(file.type) === -1 || file.size > 3 * 1024 * 1024; })) { event.target.value = ''; alert('แนบได้สูงสุด 5 ภาพ โดยต้องเป็น JPG, PNG หรือ WebP และภาพละไม่เกิน 3 MB'); return; }
  feedbackImagesLoading = true; var completed = 0;
  files.forEach(function(file) { var reader = new FileReader(); reader.onload = function() { var dataUrl = String(reader.result || ''); feedbackImagePayloads.push({ base64: dataUrl.split(',')[1], name: file.name, type: file.type, preview: dataUrl }); completed++; if (completed === files.length) { feedbackImagesLoading = false; event.target.value = ''; renderFeedbackImagePreviews(); } }; reader.readAsDataURL(file); });
}
function renderFeedbackImagePreviews() {
  var preview = document.getElementById('feedbackImagePreview'); if (!preview) return; preview.innerHTML = '';
  feedbackImagePayloads.forEach(function(image, index) { var item = document.createElement('div'); item.className = 'feedback-image-item'; item.innerHTML = '<img alt="ภาพประกอบ ' + (index + 1) + '"><button type="button" class="feedback-image-remove" aria-label="ลบภาพ ' + (index + 1) + '">&times;</button>'; item.querySelector('img').src = image.preview; item.querySelector('button').onclick = function() { feedbackImagePayloads.splice(index, 1); renderFeedbackImagePreviews(); }; preview.appendChild(item); }); preview.hidden = !feedbackImagePayloads.length;
}
function clearFeedbackImages() { feedbackImagePayloads = []; feedbackImagesLoading = false; var input = document.getElementById('feedbackImage'); var preview = document.getElementById('feedbackImagePreview'); if (input) input.value = ''; if (preview) preview.hidden = true; }
function sendFeedback() {
  var type = document.getElementById('feedbackType').value; var subject = document.getElementById('feedbackSubject').value.trim(); var details = document.getElementById('feedbackDetails').value.trim(); var button = document.getElementById('feedbackSend');
  if (!subject || !details) { alert('กรุณากรอกหัวข้อและรายละเอียด'); return; } if (feedbackImagesLoading) { alert('กำลังเตรียมภาพ กรุณารอสักครู่'); return; }
  button.disabled = true; button.textContent = 'กำลังส่ง...';
  google.script.run.withSuccessHandler(function() { closeFeedbackModal(); if (typeof showToast === 'function') showToast('ส่งข้อเสนอแนะเรียบร้อยแล้ว', 'success'); else alert('ส่งข้อเสนอแนะเรียบร้อยแล้ว'); }).withFailureHandler(function(error) { button.disabled = false; button.textContent = 'ส่งข้อความ'; alert('ส่งข้อเสนอแนะไม่สำเร็จ: ' + (error.message || error)); }).submitFeedback(localStorage.getItem('popo_token'), type, subject, details, window.location.href, feedbackImagePayloads.map(function(image) { return { base64: image.base64, name: image.name, type: image.type }; }));
}

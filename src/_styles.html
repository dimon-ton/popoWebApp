<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand: #1a56a0;
  --brand-dark: #154880;
  --brand-light: #e8f0fe;
  --brand-hover: #f0f6ff;
  --green: #27ae60;
  --green-dark: #219150;
  --red: #e74c3c;
  --red-dark: #c0392b;
  --amber: #f0a500;
  --purple: #8e44ad;
  --text: #2d3748;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --border-focus: #1a56a0;
  --bg-page: #f3f6fb;
  --bg-card: #ffffff;
  --bg-table-head: #f0f4fa;
  --shadow-card: 0 2px 10px rgba(26, 86, 160, 0.08);
  --shadow-nav: 0 2px 8px rgba(0,0,0,0.15);
  --radius: 8px;
  --radius-sm: 5px;
  --radius-pill: 20px;
}

body {
  font-family: 'Sarabun', 'TH Sarabun New', sans-serif;
  background: var(--bg-page);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== NAVBAR ===== */
.navbar {
  background: var(--brand);
  color: white;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 4px;
  height: 52px;
  box-shadow: var(--shadow-nav);
  position: sticky;
  top: 0;
  z-index: 100;
}

.navbar-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin-right: 8px;
  cursor: pointer;
  white-space: nowrap;
}

.navbar a {
  color: rgba(255,255,255,0.88);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 400;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.navbar a:hover {
  background: rgba(255,255,255,0.18);
  color: white;
}

.navbar-user {
  margin-left: auto;
  position: relative;
  font-size: 13px;
  color: rgba(255,255,255,0.8);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.navbar-user-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-pill);
  transition: background 0.15s;
}
.navbar-user-trigger:hover {
  background: rgba(255,255,255,0.15);
}

.navbar-avatar {
  width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
  border: 2px solid rgba(255,255,255,0.5); flex-shrink: 0;
}
.navbar-avatar-placeholder {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8);
  flex-shrink: 0;
}
.avatar-data, .avd { display: none; }

.navbar-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 6px;
  background: white;
  border-radius: var(--radius);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  min-width: 170px;
  z-index: 1000;
  overflow: hidden;
}
.navbar-dropdown.open { display: block; }
.navbar-dropdown a {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  color: var(--text);
  font-size: 13px;
  text-decoration: none;
  transition: background 0.1s;
  background: none;
  border-radius: 0;
}
.navbar-dropdown a:hover {
  background: var(--bg-page);
  color: var(--text);
}
.navbar-dropdown a svg {
  width: 16px; height: 16px; flex-shrink: 0;
  opacity: 0.6;
}
.navbar-dropdown .dropdown-divider {
  border-top: 1px solid var(--border);
  margin: 0;
}

/* ===== CONTAINER ===== */
.container {
  max-width: 1000px;
  margin: 28px auto;
  padding: 0 20px;
}
.container.wide { max-width: 1200px; }
.container.narrow { max-width: 720px; }

/* ===== CARDS ===== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(26,86,160,0.06);
  overflow-x: auto;
}

.card h2 {
  font-size: 18px;
  color: var(--brand);
  margin-bottom: 18px;
  font-weight: 600;
}

.card h3 {
  font-size: 14.5px;
  color: #444;
  margin-bottom: 14px;
  font-weight: 600;
}

h2.page-title {
  font-size: 20px;
  color: var(--brand);
  margin-bottom: 20px;
  font-weight: 600;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--brand);
  border-bottom: 2px solid var(--brand-light);
  padding-bottom: 6px;
  margin-bottom: 14px;
}

/* ===== BUTTONS ===== */
button, .btn {
  padding: 8px 18px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.15s, opacity 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary, button.btn-primary {
  background: var(--brand);
  color: white;
}
.btn-primary:hover { background: var(--brand-dark); }
.btn-primary:disabled { background: #93b8d8; cursor: not-allowed; }

.btn-secondary, button.btn-secondary {
  background: var(--brand-light);
  color: var(--brand);
  border: 1px solid #c5d9f0;
}
.btn-secondary:hover { background: #d5e5f5; }
.btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-danger, button.btn-danger {
  background: var(--red);
  color: white;
}
.btn-danger:hover { background: var(--red-dark); }

.btn-save {
  padding: 9px 24px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 500;
}
.btn-save:hover { background: var(--green-dark); }
.btn-save:disabled { background: #aaa; cursor: not-allowed; }

.btn-pdf {
  padding: 8px 20px;
  background: var(--purple);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 500;
}
.btn-pdf:hover { background: #7d3c98; }
.btn-pdf:disabled { background: #aaa; cursor: not-allowed; }

/* ===== FORMS ===== */
.form-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-end;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 130px;
}

.form-group label,
label {
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 500;
}

input[type="text"],
input[type="password"],
input[type="number"],
input[type="date"],
input[type="email"],
select,
textarea {
  padding: 8px 11px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-family: inherit;
  color: var(--text);
  background: white;
  transition: border-color 0.15s, box-shadow 0.15s;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(26,86,160,0.1);
}

input.invalid,
input:invalid {
  border-color: var(--red);
}

/* ===== TABLES ===== */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}

thead th {
  background: var(--bg-table-head);
  padding: 10px 12px;
  text-align: left;
  border-bottom: 2px solid var(--border);
  font-weight: 600;
  color: #374151;
  font-size: 13px;
  white-space: nowrap;
}

thead th.center { text-align: center; }

tbody td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

tbody tr:hover td { background: var(--brand-hover); }
tbody tr:last-child td { border-bottom: none; }

/* Blue header tables (audit log) */
thead.dark th {
  background: var(--brand);
  color: white;
  border-bottom: none;
}

/* Grade / score table cells */
td.total-col, th.total-col {
  font-weight: 700;
  color: var(--brand);
  background: #f4f8ff;
  text-align: center;
}
td.grade-col, th.grade-col {
  font-weight: 700;
  color: var(--green);
  background: #f0faf4;
  text-align: center;
}
td.makeup-col { background: #fffaf0; text-align: center; }
td.seq-col { text-align: center; color: var(--text-muted); width: 36px; }
td.name-col { text-align: left; white-space: nowrap; }
td.label-col { font-weight: 700; background: #f1f8f1; text-align: center; }
td.label-col.diyiam { color: #1a7a40; }
td.label-col.di { color: #2980b9; }
td.label-col.pass { color: #e67e22; }
td.label-col.fail { color: var(--red-dark); }

/* Score grids (attendance / formative) */
input.score-input {
  width: 40px;
  text-align: center;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  padding: 3px 2px;
  font-size: 13px;
  font-family: inherit;
}
input.score-input:focus {
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 2px rgba(26,86,160,0.12);
}

input.makeup-input {
  width: 52px;
  text-align: center;
  border: 1.5px solid var(--amber);
  border-radius: 4px;
  padding: 3px 2px;
  font-size: 13px;
  font-family: inherit;
  background: #fffaf0;
}
input.makeup-input:focus { border-color: #e67e22; outline: none; }

/* Attendance cells */
.att-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 28px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
}
.att-cell.status-slash { background: #d4edda; color: #1a7a1a; }
.att-cell.status-la { background: #fff3cd; color: #856404; }
.att-cell.status-kho { background: #f8d7da; color: #721c24; }
.att-cell.status-empty { background: #f0f0f0; color: #ccc; }
.att-cell.readonly { cursor: default; }

/* ===== BADGES ===== */
.role-badge {
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  display: inline-block;
}
.role-badge.admin { background: #e8f0fe; color: var(--brand); }
.role-badge.teacher { background: #eafaf1; color: var(--green); }

.entity-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  background: #dbeafe;
  color: #1e40af;
}

.badge-count {
  display: inline-block;
  background: var(--brand);
  color: white;
  border-radius: var(--radius-pill);
  padding: 2px 8px;
  font-size: 12px;
}

/* Grade scale badges */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
}
.badge-4 { background: #27ae60; color: white; }
.badge-35 { background: #2ecc71; color: white; }
.badge-3 { background: #3498db; color: white; }
.badge-2 { background: #f39c12; color: white; }
.badge-1 { background: #e67e22; color: white; }
.badge-0 { background: var(--red-dark); color: white; }
.badge-diyiam { background: #27ae60; color: white; }
.badge-di { background: #3498db; color: white; }
.badge-pass { background: #f39c12; color: white; }
.badge-fail { background: var(--red-dark); color: white; }

/* ===== TOAST NOTIFICATIONS ===== */
.toast {
  position: fixed;
  top: 64px;
  right: 20px;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-size: 13.5px;
  z-index: 9999;
  display: none;
  max-width: 340px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  font-weight: 500;
}
.toast.success { background: var(--green); color: white; }
.toast.error { background: var(--red-dark); color: white; }
#toast { position: fixed; top: 64px; right: 20px; }

/* ===== SKELETON LOADING ===== */
@keyframes skeleton-pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
.skeleton { animation: skeleton-pulse 1.5s ease-in-out infinite; background: #e2e5e9; border-radius: 4px; }
.skeleton-row { display: flex; gap: 12px; margin-bottom: 10px; }
.skeleton-line { height: 14px; background: #e2e5e9; border-radius: 4px; animation: skeleton-pulse 1.5s ease-in-out infinite; }
.skeleton-line.w20 { width: 20%; }
.skeleton-line.w30 { width: 30%; }
.skeleton-line.w40 { width: 40%; }
.skeleton-line.w50 { width: 50%; }
.skeleton-line.w60 { width: 60%; }
.skeleton-line.w70 { width: 70%; }
.skeleton-line.w80 { width: 80%; }
.skeleton-line.w100 { width: 100%; }
.skeleton-block { height: 38px; background: #e2e5e9; border-radius: 4px; animation: skeleton-pulse 1.5s ease-in-out infinite; margin-bottom: 10px; }
.skeleton-table { width: 100%; }
.skeleton-table-row { display: flex; gap: 1px; margin-bottom: 1px; }
.skeleton-table-cell { height: 32px; background: #e2e5e9; animation: skeleton-pulse 1.5s ease-in-out infinite; border-radius: 2px; }
.skeleton-table-head .skeleton-table-cell { height: 36px; background: #d5dae0; }

/* ===== STATUS / NOTICES ===== */
.loading-msg {
  color: var(--text-muted);
  font-size: 13.5px;
  padding: 16px 0;
}
.nav-loading { position: fixed; inset: 0; background: #fff; z-index: 10000; display: flex; flex-direction: column; align-items: center; padding-top: 120px; }
.nav-loading .skeleton-block { width: 260px; }
.nav-loading .skeleton-menu { display: grid; grid-template-columns: repeat(3, 140px); gap: 10px; margin-top: 18px; }
.nav-loading .skeleton-menu-item { height: 44px; background: #e2e5e9; border-radius: 6px; animation: skeleton-pulse 1.5s ease-in-out infinite; }

.readonly-notice {
  font-size: 13px;
  color: #78350f;
  margin-bottom: 12px;
  padding: 10px 14px;
  background: #fffbeb;
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--amber);
}

.empty-msg {
  text-align: center;
  color: var(--text-muted);
  padding: 32px;
  font-size: 14px;
}

/* ===== SAVE BAR ===== */
.save-bar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 14px;
}

/* ===== MODALS ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white;
  border-radius: var(--radius);
  padding: 28px;
  width: 380px;
  max-width: 94vw;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.modal h3 {
  font-size: 16px;
  margin-bottom: 18px;
  color: var(--brand);
  font-weight: 600;
}
.modal .form-group { margin-bottom: 14px; width: 100%; }
.modal .form-group input { width: 100%; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }

/* ===== WEEK NAV (attendance) ===== */
.week-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.week-nav button {
  padding: 6px 16px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  background: var(--brand);
  color: white;
  font-weight: 500;
}
.week-nav button:hover { background: var(--brand-dark); }
.week-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--brand);
}

/* ===== LEGEND (attendance) ===== */
.legend {
  display: flex;
  gap: 14px;
  font-size: 12.5px;
  color: var(--text-muted);
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-box {
  width: 20px; height: 20px;
  border-radius: 3px;
  display: inline-block;
}
.legend-box.slash { background: #d4edda; }
.legend-box.la { background: #fff3cd; }
.legend-box.kho { background: #f8d7da; }
.legend-box.empty { background: #f0f0f0; border: 1px solid var(--border); }

/* ===== DASHBOARD MENU GRID ===== */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
}
.menu-item {
  background: var(--brand-light);
  border-radius: var(--radius);
  padding: 18px 14px;
  text-align: center;
  text-decoration: none;
  color: var(--brand);
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s, transform 0.1s;
  border: 1px solid rgba(26,86,160,0.12);
  display: block;
}
.menu-item:hover {
  background: #d5e5f5;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(26,86,160,0.12);
}

/* ===== FILTER ROW (audit) ===== */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 20px;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-group label { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }

/* ===== DRILL PANEL (workload) ===== */
.drill-panel {
  background: #f9fafb;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-top: 20px;
  display: none;
}
.drill-panel.open { display: block; }
.drill-panel h3 { font-size: 14.5px; margin-bottom: 12px; color: var(--brand); font-weight: 600; }
.drill-panel a { color: var(--brand); text-decoration: none; font-size: 13px; }
.drill-panel a:hover { text-decoration: underline; }

/* ===== TWO-COL LAYOUT ===== */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* ===== JSON VALUE (audit) ===== */
.json-val {
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: #555;
  max-width: 260px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ===== MISC ===== */
.loading { color: var(--text-muted); font-size: 14px; padding: 20px 0; }

.sum-cell { font-weight: 700; }
.sum-cell.ok { color: var(--green); }
.sum-cell.bad { color: var(--red-dark); }

.preseed-btn { margin-bottom: 16px; }

.two-col-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
  font-size: 14px;
}
.info-row { display: flex; gap: 8px; }
.info-label { color: var(--text-muted); min-width: 120px; flex-shrink: 0; font-size: 13.5px; }
.info-value { font-weight: 600; }

/* ===== MOBILE ===== */
@media (max-width: 640px) {
  .navbar { padding: 0 12px; gap: 2px; }
  .navbar a { padding: 4px 6px; font-size: 12.5px; }
  .navbar-title { font-size: 15px; }

  .container { margin: 16px auto; padding: 0 12px; }
  .card { padding: 16px; }

  .form-row { flex-direction: column; }
  .form-group { min-width: 100%; }

  .two-col { grid-template-columns: 1fr; }
  .two-col-info { grid-template-columns: 1fr; }

  .menu-grid { grid-template-columns: 1fr 1fr; }

  table { font-size: 12.5px; }
  thead th, tbody td { padding: 8px 8px; }

  .filter-row { flex-direction: column; }
  .filter-group { min-width: 100%; }
  .filter-group input, .filter-group select { width: 100%; }

  .modal { padding: 20px; }
}
.back-btn { display:inline-flex;align-items:center;gap:5px;padding:4px 0;background:none;color:var(--brand);border:none;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;text-decoration:none;font-weight:500;transition:color 0.15s;margin-bottom:14px; }
.back-btn:hover { color:var(--brand-dark);text-decoration:underline; }
.back-btn svg { width:16px;height:16px;fill:currentColor; }
</style>
<script>
function showNavLoading() {
  if (document.getElementById('navOverlay')) return;
  var d = document.createElement('div');
  d.id = 'navOverlay';
  d.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:10000;display:flex;flex-direction:column;align-items:center;padding-top:80px;';
  d.innerHTML = '<div style="width:260px;height:20px;background:#e2e5e9;border-radius:4px;animation:navPulse 1.5s ease-in-out infinite;margin-bottom:12px"></div>' +
    '<div style="width:180px;height:20px;background:#e2e5e9;border-radius:4px;animation:navPulse 1.5s ease-in-out infinite;margin-bottom:24px"></div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,140px);gap:10px">' +
      '<div style="height:44px;background:#e2e5e9;border-radius:6px;animation:navPulse 1.5s ease-in-out infinite"></div>'.repeat(3) +
      '<div style="height:44px;background:#e2e5e9;border-radius:6px;animation:navPulse 1.5s ease-in-out infinite"></div>'.repeat(3) +
    '</div>';
  document.body.appendChild(d);
  if (!document.getElementById('navPulseStyle')) {
    var s = document.createElement('style');
    s.id = 'navPulseStyle';
    s.textContent = '@keyframes navPulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}';
    document.head.appendChild(s);
  }
}
function hideNavLoading() {
  var el = document.getElementById('navOverlay');
  if (el) el.remove();
}
function btnLoading(btn, text) {
  if (!btn) return;
  btn.dataset.origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = text || 'กำลังบันทึก...';
}
function fmtCls(level, section) {
  if (!section || section === '1') return level || '';
  return (level || '') + '/' + section;
}
function uploadAvatar() {
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = function(e) {
    var file = e.target.files[0]; if (!file) return;
    if (file.size > 350000) { if (typeof showToast === 'function') showToast('ไฟล์รูปภาพใหญ่เกินไป (สูงสุด ~350KB)', 'error'); else alert('ไฟล์รูปภาพใหญ่เกินไป'); return; }
    var reader = new FileReader();
    reader.onload = function(ev) {
      var b64 = ev.target.result;
      if (typeof TOKEN !== 'undefined' && TOKEN && typeof google !== 'undefined') {
        google.script.run
          .withSuccessHandler(function(result) {
            if (result && result.error) { if (typeof showToast === 'function') showToast(result.error, 'error'); return; }
            var url = result.avatarUrl;
            var avatarEl = document.querySelector('.navbar-avatar');
            if (avatarEl && url) avatarEl.src = url;
            if (typeof showToast === 'function') showToast('อัพเดตรูปภาพสำเร็จ', 'success');
          })
          .withFailureHandler(function(err) { if (typeof showToast === 'function') showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
          .serverUploadAvatar(TOKEN, b64);
      }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
function btnReset(btn) {
  if (!btn) return;
  btn.disabled = false;
  btn.textContent = btn.dataset.origText || btn.textContent;
}
function injectBackBtn() {
  if (document.title.indexOf('หน้าหลัก') > -1) return;
  var h2 = document.querySelector('h2');
  if (!h2) return;
  var a = document.createElement('a');
  a.className = 'back-btn';
  a.href = '#';
  a.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> ย้อนกลับ';
  a.onclick = function(e) { e.preventDefault(); if (typeof navigate === 'function') navigate('dashboard'); };
  h2.parentNode.insertBefore(a, h2);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', injectBackBtn);
else injectBackBtn();

function initNavbarDropdown() {
  var trigger = document.querySelector('.navbar-user-trigger');
  var dropdown = document.querySelector('.navbar-dropdown');
  if (!trigger || !dropdown) return;
  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    if (!dropdown.contains(e.target) && !trigger.contains(e.target)) {
      dropdown.classList.remove('open');
    }
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNavbarDropdown);
else initNavbarDropdown();

function initNavbarAvatar() {
  if (typeof google === 'undefined' || !google.script) return;
  var el = document.querySelector('.navbar-avatar-placeholder');
  if (!el) return;
  if (typeof TOKEN === 'undefined' || !TOKEN) return;
  google.script.run
    .withSuccessHandler(function(profile) {
      if (!profile || profile.error || !profile.avatar) return;
      var ph = document.querySelector('.navbar-avatar-placeholder');
      if (!ph) return;
      var img = new Image();
      img.className = 'navbar-avatar';
      img.onload = function() { ph.parentNode.replaceChild(img, ph); };
      img.onerror = function() {};
      img.src = profile.avatar;
    })
    .withFailureHandler(function() {})
    .serverGetCurrentUserProfile(TOKEN);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNavbarAvatar);
else initNavbarAvatar();
</script>

<body>
<div class="navbar">

<div class="container wide">
  <h2 class="page-title" id="pageHeading">การเข้าเรียน</h2>

  <div class="week-nav">
    <button id="prevWeekBtn" onclick="changeWeek(-1)">&#8592; สัปดาห์ก่อน</button>
    <span class="week-label" id="weekLabel">สัปดาห์ที่ —</span>
    <button id="nextWeekBtn" onclick="changeWeek(1)">สัปดาห์ถัดไป &#8594;</button>
    <select id="weekJump" onchange="jumpToWeek(this.value)">
      <option value="">— ข้ามไปสัปดาห์ที่ —</option>
    </select>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-box slash"></span> / = มาเรียน</span>
    <span class="legend-item"><span class="legend-box la"></span> ล = ลา</span>
    <span class="legend-item"><span class="legend-box kho"></span> ข = ขาด</span>
    <span class="legend-item"><span class="legend-box empty"></span> ว่าง = ไม่มีเรียน</span>
  </div>

  <div id="readonlyNotice" class="readonly-notice" style="display:none">คุณมีสิทธิ์อ่านอย่างเดียว — เฉพาะครูผู้สอนหรือผู้ดูแลระบบแก้ไขได้</div>

  <div class="card">
    <div class="loading-msg" id="loadingMsg">
      <div class="skeleton-table">
        <div class="skeleton-table-row skeleton-table-head"><div class="skeleton-table-cell" style="width:6%"></div><div class="skeleton-table-cell" style="width:22%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:6%"></div><div class="skeleton-table-cell" style="width:22%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:6%"></div><div class="skeleton-table-cell" style="width:22%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:6%"></div><div class="skeleton-table-cell" style="width:22%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div><div class="skeleton-table-cell" style="width:8%"></div></div>
      </div>
    </div>
    <table id="attTable" style="display:none">
      <thead id="attHead"></thead>
      <tbody id="attBody"></tbody>
      <tfoot id="attFoot"></tfoot>
    </table>
  </div>

  <div class="save-bar" id="saveBar" style="display:none">
    <button class="btn-save" id="saveBtn" onclick="saveAttendance()">บันทึกการเข้าเรียน</button>
    <span id="saveStatus" style="font-size:13px;color:#888"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var CLASS_ID = '<?!= data.class_id || '' ?>';
var SUBJECT_ID = '<?!= data.subject_id || '' ?>';

var currentWeek = <?= data.week || 1 ?>;
var currentData = null;

// Status cycle order: '' -> '/' -> 'ล' -> 'ข' -> ''
var CYCLE = ['', '/', 'ล', 'ข'];
// Map cell values to class names
var STATUS_CLASS = { '/': 'status-slash', 'ล': 'status-la', 'ข': 'status-kho', '': 'status-empty' };

// Dirty tracking: cells changed but not yet saved
// Key: "student_id|date", value: status
var pendingChanges = {};

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

var THAI_DAYS_BY_DATE = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

// Build the week select dropdown options
function buildWeekSelect() {
  var sel = document.getElementById('weekJump');
  var maxWeeks = currentData && currentData.max_weeks ? Number(currentData.max_weeks) : 40;
  sel.innerHTML = '<option value="">— ข้ามไปสัปดาห์ที่ —</option>';
  for (var w = 1; w <= maxWeeks; w++) {
    var opt = document.createElement('option');
    opt.value = w;
    opt.textContent = 'สัปดาห์ที่ ' + w;
    if (w === currentWeek) opt.selected = true;
    sel.appendChild(opt);
  }
}

function loadAttendance() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('attTable').style.display = 'none';
  document.getElementById('saveBar').style.display = 'none';
  pendingChanges = {};

  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
  currentData = result;
      buildWeekSelect();
      renderGrid(result);
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingMsg').style.display = 'none';
      showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    })
    .getAttendanceData(TOKEN, CLASS_ID, SUBJECT_ID, currentWeek);
}

function renderGrid(data) {
  document.getElementById('loadingMsg').style.display = 'none';

  var cls = data.class_info || {};
  var subj = data.subject_info || {};
  document.getElementById('pageHeading').textContent =
    'การเข้าเรียน — ' + (cls.class_label || fmtCls(cls.level, cls.section)) + ' — ' + (subj.subject_name || '');
  document.getElementById('weekLabel').textContent = 'สัปดาห์ที่ ' + data.week;

  var readonlyNotice = document.getElementById('readonlyNotice');
  var saveBar = document.getElementById('saveBar');
  if (data.can_edit) {
    readonlyNotice.style.display = 'none';
    saveBar.style.display = 'flex';
  } else {
    readonlyNotice.style.display = 'block';
    saveBar.style.display = 'none';
  }

  // Build header
  var thead = document.getElementById('attHead');
  var headRow = '<tr><th class="seq-col">ที่</th><th class="name-col">ชื่อ-สกุล</th>';
  data.dates.forEach(function(dateStr) {
    var dt = new Date(dateStr + 'T00:00:00');
    var dayLabel = THAI_DAYS_BY_DATE[dt.getDay()];
    var dateLabel = typeof formatThaiBuddhistDate === 'function' ? formatThaiBuddhistDate(dateStr + 'T00:00:00') : (dt.getDate() + '/' + (dt.getMonth() + 1) + '/' + (dt.getFullYear() + 543));
    headRow += '<th>' + dayLabel + '<br><span style="font-weight:normal;font-size:11px">' + dateLabel + '</span></th>';
  });
  headRow += '<th>มา</th><th>ลา</th><th>ขาด</th><th>รวม<br>ชม.</th></tr>';
  thead.innerHTML = headRow;

  // Build body
  var tbody = document.getElementById('attBody');
  tbody.innerHTML = '';

  // Footer counters per day
  var dayTotals = data.dates.map(function() { return { slash: 0, la: 0, kho: 0 }; });

  data.students.forEach(function(student) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-student-id', student.student_id);
    var cells = '<td class="seq-col">' + escHtml(student.seq_no) + '</td>' +
                '<td class="name-col">' + escHtml(student.full_name) + '</td>';

    var presentCount = 0, leaveCount = 0, absentCount = 0;
    var yearData = (data.yearly && data.yearly[student.student_id]) || {};
    // Use yearly totals for footer columns
    presentCount = yearData.present || 0;
    leaveCount = yearData.leave || 0;
    absentCount = yearData.absent || 0;
    var totalHours = presentCount + leaveCount + absentCount;

    data.dates.forEach(function(dateStr, di) {
      var attForStudent = (data.attendance && data.attendance[student.student_id]) || {};
      var status = attForStudent[dateStr] || '';
      var cls_name = STATUS_CLASS[status] || 'status-empty';
      var display = status || '';

      if (data.can_edit) {
        cells += '<td><span class="att-cell ' + cls_name + '" ' +
          'data-student="' + escHtml(student.student_id) + '" ' +
          'data-date="' + escHtml(dateStr) + '" ' +
          'onclick="cycleCell(this)">' + escHtml(display) + '</span></td>';
      } else {
        cells += '<td><span class="att-cell ' + cls_name + ' readonly">' + escHtml(display) + '</span></td>';
      }

      // Day footer tallies (weekly view)
      if (status === '/') dayTotals[di].slash++;
      else if (status === 'ล') dayTotals[di].la++;
      else if (status === 'ข') dayTotals[di].kho++;
    });

    cells += '<td class="total-col present-count" data-student-present="' + student.student_id + '">' + presentCount + '</td>' +
             '<td class="total-col leave-count" data-student-leave="' + student.student_id + '">' + leaveCount + '</td>' +
             '<td class="total-col absent-count" data-student-absent="' + student.student_id + '">' + absentCount + '</td>' +
             '<td class="total-col">' + totalHours + '</td>';

    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });

  // Build footer (day-level totals)
  var tfoot = document.getElementById('attFoot');
  var footRow = '<tr><td colspan="2" style="text-align:right;font-size:12px">รวม (สัปดาห์นี้):</td>';
  dayTotals.forEach(function(dt) {
    footRow += '<td style="font-size:11px;line-height:1.4">' +
      '<span style="color:#1a7a1a">' + dt.slash + '</span>/' +
      '<span style="color:#856404">' + dt.la + '</span>/' +
      '<span style="color:#721c24">' + dt.kho + '</span>' +
      '</td>';
  });
  footRow += '<td></td><td></td><td></td><td></td></tr>';
  tfoot.innerHTML = footRow;

  document.getElementById('attTable').style.display = 'table';
}

function cycleCell(el) {
  var current = el.textContent.trim();
  var idx = CYCLE.indexOf(current);
  var next = CYCLE[(idx + 1) % CYCLE.length];
  el.textContent = next;
  el.className = 'att-cell ' + (STATUS_CLASS[next] || 'status-empty');

  var student = el.getAttribute('data-student');
  var date = el.getAttribute('data-date');
  pendingChanges[student + '|' + date] = { student_id: student, date: date, status: next };
}

function changeWeek(delta) {
  var newWeek = parseInt(currentWeek) + delta;
  var maxWeeks = currentData && currentData.max_weeks ? Number(currentData.max_weeks) : 40;
  if (newWeek < 1 || newWeek > maxWeeks) return;
  currentWeek = newWeek;
  buildWeekSelect();
  loadAttendance();
}

function jumpToWeek(val) {
  var w = parseInt(val);
  var maxWeeks = currentData && currentData.max_weeks ? Number(currentData.max_weeks) : 40;
  if (!w || w < 1 || w > maxWeeks) return;
  currentWeek = w;
  buildWeekSelect();
  loadAttendance();
}

function saveAttendance() {
  var cells = Object.values ? Object.values(pendingChanges) : Object.keys(pendingChanges).map(function(k) { return pendingChanges[k]; });
  if (cells.length === 0) {
    showToast('ไม่มีการเปลี่ยนแปลง', 'success');
    return;
  }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  document.getElementById('saveStatus').textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      if (result && result.error) { showToast(result.error, 'error'); return; }
      pendingChanges = {};
      showToast('บันทึกการเข้าเรียนสำเร็จ', 'success');
      loadAttendance(); // reload to get updated yearly totals
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverSaveAttendance(TOKEN, CLASS_ID, SUBJECT_ID, cells);
}

// Init
buildWeekSelect();
loadAttendance();
</script>
</body>
</html>

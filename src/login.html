  <?!= include('_styles') ?>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(180deg, #f6f9fe 0%, #eef4fb 100%); }
    .login-card { background: white; border-radius: 18px; padding: 38px 36px 36px; width: min(440px, calc(100vw - 32px)); box-shadow: 0 18px 50px rgba(26,86,160,0.14); border: 1px solid rgba(26,86,160,0.08); }
    .login-brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
    .login-logo-image { width: 96px; height: 96px; object-fit: contain; margin-bottom: 14px; }
    .login-logo { font-size: 24px; color: var(--brand); margin-bottom: 6px; text-align: center; font-weight: 700; line-height: 1.25; }
    .login-subtitle { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
    .form-group input { width: 100%; padding: 10px 12px; }
    .login-btn { width: 100%; padding: 11px; background: var(--brand); color: white; border: none; border-radius: 6px; font-size: 15px; font-family: inherit; cursor: pointer; margin-top: 8px; font-weight: 600; display: flex; justify-content: center; text-align: center; transition: background 0.15s; }
    .login-btn:hover { background: var(--brand-dark); }
    .login-btn:disabled { background: #93b8d8; cursor: not-allowed; }
    .error { background: #fdecea; color: var(--red-dark); padding: 10px 12px; border-radius: 5px; font-size: 13px; margin-bottom: 16px; display: none; border-left: 3px solid var(--red); }
    .error.show { display: block; }
    .login-card { display: none; }
    .login-card.visible { display: block; }
    .login-checking { text-align: center; color: var(--text-muted); font-size: 15px; padding: 40px; }
  </style>
</head>

    <p class="login-subtitle">
      โรงเรียนบ้านโพนแท่น<br>
      สำนักงานเขตพื้นที่การศึกษาประถมศึกษาร้อยเอ็ดเขต 2

    <div class="error" id="errBox">
      <? if (data.error) { ?><?= data.error ?><? } ?>
    </div>
    <div class="form-group">
      <label>ชื่อผู้ใช้ (Username)</label>
      <input type="text" id="username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>รหัสผ่าน (Password)</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
  <script>
    var errBox = document.getElementById('errBox');
    // Show server-side error passed via template (e.g. redirect after session expiry)
    if (errBox.textContent.trim()) errBox.classList.add('show');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.add('show');
    }

    // On load: if a valid token is in localStorage, go straight to dashboard
    (function() {
      var stored = localStorage.getItem('popo_token');
      if (stored) {
        var redirectPage = '<?= data.redirect_page || "" ?>';
        var classId = '<?= data.class_id || "" ?>';
        var subjectId = '<?= data.subject_id || "" ?>';
        
        var successHandler = function(html) {
          if (html) { document.open(); document.write(html); document.close(); }
          else { showLoginForm(); }
        };
        var errorHandler = function() {
          localStorage.removeItem('popo_token');
          showLoginForm();
        };

        if (redirectPage && redirectPage !== 'dashboard' && redirectPage !== 'login') {
          google.script.run
            .withSuccessHandler(successHandler)
            .withFailureHandler(errorHandler)
            .getPageHtmlWithParams(stored, redirectPage, classId, subjectId);
        } else {
          google.script.run
            .withSuccessHandler(successHandler)
            .withFailureHandler(errorHandler)
            .getDashboardHtml(stored);
        }
      } else {
        showLoginForm();
      }
    })();

    function showLoginForm() {
      var checking = document.getElementById('loginChecking');
      var card = document.getElementById('loginCard');
      if (checking) checking.style.display = 'none';
      if (card) card.classList.add('visible');
    }

    function doLogin() {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('loginBtn');

      if (!username || !password) {
        showError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังเข้าสู่ระบบ...';
      errBox.classList.remove('show');

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.error) {
            showError(result.error);
            btn.disabled = false;
            btn.textContent = 'เข้าสู่ระบบ';
          } else {
            localStorage.setItem('popo_token', result.token);
            if (result.session && result.session.must_change_pwd) {
              google.script.run
                .withSuccessHandler(function(html) {
                  document.open();
                  document.write(html);
                  document.close();
                })
                .withFailureHandler(function(err) {
                  showError('เกิดข้อผิดพลาด: ' + err.message);
                  btn.disabled = false;
                  btn.textContent = 'เข้าสู่ระบบ';
                })
                .getChangePasswordHtml(result.token);
            } else {
              var redirectPage = '<?= data.redirect_page || "" ?>';
              var classId = '<?= data.class_id || "" ?>';
              var subjectId = '<?= data.subject_id || "" ?>';
              
              var successHandler = function(html) {
                document.open();
                document.write(html);
                document.close();
              };
              var errorHandler = function(err) {
                showError('เกิดข้อผิดพลาด: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'เข้าสู่ระบบ';
              };

              if (redirectPage && redirectPage !== 'dashboard' && redirectPage !== 'login') {
                google.script.run
                  .withSuccessHandler(successHandler)
                  .withFailureHandler(errorHandler)
                  .getPageHtmlWithParams(result.token, redirectPage, classId, subjectId);
              } else {
                google.script.run
                  .withSuccessHandler(successHandler)
                  .withFailureHandler(errorHandler)
                  .getDashboardHtml(result.token);
              }
            }
          }
        })
        .withFailureHandler(function(err) {
          showError('เกิดข้อผิดพลาด: ' + err.message);
          btn.disabled = false;
          btn.textContent = 'เข้าสู่ระบบ';
        })
        .serverLogin(username, password);
    }

    // Allow pressing Enter to submit
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการวิชา — PopoWebApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f5f5f5; color: #333; }
    .navbar { background: #1a56a0; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .navbar-title { font-size: 18px; font-weight: bold; }
    .navbar a { color: white; text-decoration: none; font-size: 14px; cursor: pointer; }
    .container { max-width: 1000px; margin: 32px auto; padding: 0 20px; }
    h2 { font-size: 20px; color: #1a56a0; margin-bottom: 20px; }
    .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { font-size: 15px; color: #444; margin-bottom: 16px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 4px; min-width: 130px; }
    .form-group label { font-size: 12px; color: #555; }
    input[type="text"], input[type="number"], select, textarea {
      padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 13px; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1a56a0; }
    button {
      padding: 8px 18px; border: none; border-radius: 4px; font-size: 13px;
      font-family: inherit; cursor: pointer;
    }
    .btn-primary { background: #1a56a0; color: white; }
    .btn-primary:hover { background: #154880; }
    .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f0f4fa; padding: 10px 12px; text-align: left; border-bottom: 2px solid #ddd; }
    td { padding: 10px 12px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #fafcff; }
    .toast {
      position: fixed; top: 20px; right: 20px; padding: 12px 20px;
      border-radius: 6px; font-size: 14px; z-index: 1000;
      display: none; max-width: 320px;
    }
    .toast.success { background: #27ae60; color: white; }
    .toast.error { background: #c0392b; color: white; }
    .loading-msg { color: #888; font-size: 14px; padding: 12px 0; }
    .preseed-btn { margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="navbar">
  <span class="navbar-title">PopoWebApp</span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <a href="#" onclick="navigate('admin_school')">ข้อมูลโรงเรียน</a>
  <a href="#" onclick="navigate('admin_classes')">ชั้นเรียน</a>
  <a href="#" onclick="navigate('admin_subjects')">วิชา</a>
  <a href="#" onclick="navigate('admin_users')">ผู้ใช้</a>
  <span style="margin-left:auto;font-size:13px"><?= data.session ? data.session.full_name : '' ?></span>
</div>

<div class="container">
  <h2 id="pageHeading">จัดการวิชา</h2>

  <div class="card">
    <h3>เพิ่มวิชาใหม่</h3>
    <div class="form-row">
      <div class="form-group">
        <label>รหัสวิชา (subject_id)</label>
        <input type="text" id="newSubjectId" placeholder="เช่น subj_eng">
      </div>
      <div class="form-group">
        <label>ชื่อวิชา</label>
        <input type="text" id="newSubjectName" placeholder="ชื่อวิชา">
      </div>
      <div class="form-group">
        <label>รหัสสาระ</label>
        <input type="text" id="newSubjectCode" placeholder="เช่น T06">
      </div>
      <div class="form-group">
        <label>เวลาเรียน (ชม./ปี)</label>
        <input type="number" id="newHours" placeholder="80" min="0">
      </div>
      <div class="form-group">
        <label>กลุ่มวิชา</label>
        <select id="newWeightGroup">
          <option value="1">กลุ่ม 1 (70:30)</option>
          <option value="2">กลุ่ม 2 (80:20)</option>
        </select>
      </div>
      <div class="form-group" style="justify-content:flex-end">
        <button class="btn-primary" id="addSubjectBtn" onclick="addSubject()">เพิ่มวิชา</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>รายการวิชาทั้งหมด</h3>
    <button class="btn-primary preseed-btn" id="preseedBtn" onclick="preseedSubjects()">เพิ่มวิชาเริ่มต้น 11 วิชา</button>
    <p class="loading-msg" id="subjectsLoading">กำลังโหลด...</p>
    <table id="subjectsTable" style="display:none">
      <thead>
        <tr>
          <th>รหัสวิชา</th>
          <th>ชื่อวิชา</th>
          <th>รหัสสาระ</th>
          <th>เวลาเรียน</th>
          <th>กลุ่ม</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="subjectsBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadSubjects() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      renderSubjects((result && result.subjects) ? result.subjects : []);
    })
    .withFailureHandler(function(err) { showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error'); })
    .getSubjectsList(TOKEN);
}

function renderSubjects(subjects) {
  document.getElementById('subjectsLoading').style.display = 'none';
  var tbody = document.getElementById('subjectsBody');
  tbody.innerHTML = '';
  subjects.forEach(function(s) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-subject-id', s.subject_id);
    tr.innerHTML =
      '<td>' + escHtml(s.subject_id) + '</td>' +
      '<td>' + escHtml(s.subject_name) + '</td>' +
      '<td>' + escHtml(s.subject_code) + '</td>' +
      '<td>' + escHtml(s.hours_per_year) + ' ชม.</td>' +
      '<td>กลุ่ม ' + escHtml(s.weight_group) + '</td>' +
      '<td>' +
        '<button class="btn-primary" style="margin-right:6px" onclick="viewIndicators(\'' + escHtml(s.subject_id) + '\')">ตัวชี้วัด</button>' +
        '<button class="btn-danger" onclick="deleteSubject(\'' + escHtml(s.subject_id) + '\')">ลบ</button>' +
      '</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('subjectsTable').style.display = 'table';
}

function addSubject() {
  var subject_id = document.getElementById('newSubjectId').value.trim();
  var subject_name = document.getElementById('newSubjectName').value.trim();
  var subject_code = document.getElementById('newSubjectCode').value.trim();
  var hours = document.getElementById('newHours').value.trim();
  var weight_group = document.getElementById('newWeightGroup').value;

  if (!subject_id || !subject_name) { showToast('กรุณากรอก รหัสวิชา และ ชื่อวิชา', 'error'); return; }

  var btn = document.getElementById('addSubjectBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มวิชาสำเร็จ', 'success');
      document.getElementById('newSubjectId').value = '';
      document.getElementById('newSubjectName').value = '';
      document.getElementById('newSubjectCode').value = '';
      document.getElementById('newHours').value = '';
      document.getElementById('subjectsLoading').style.display = 'block';
      document.getElementById('subjectsTable').style.display = 'none';
      loadSubjects();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddSubject(TOKEN, subject_id, subject_name, subject_code, hours, weight_group, '');
}

function viewIndicators(subject_id) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getIndicatorsPageHtml(TOKEN, subject_id);
}

function deleteSubject(subject_id) {
  if (!confirm('ยืนยันการลบวิชา ' + subject_id + '?')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('ลบวิชาสำเร็จ', 'success');
      loadSubjects();
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .serverDeleteSubject(TOKEN, subject_id);
}

function preseedSubjects() {
  var btn = document.getElementById('preseedBtn');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มวิชาเริ่มต้นสำเร็จ', 'success');
      document.getElementById('subjectsLoading').style.display = 'block';
      document.getElementById('subjectsTable').style.display = 'none';
      loadSubjects();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .preseedSubjects();
}

loadSubjects();
</script>
</body>
</html>

<body>

<div class="container">
  <h2 class="page-title" id="pageHeading">จัดการวิชา</h2>

  <div class="card">
    <h3>เพิ่มวิชาใหม่</h3>
    <div class="form-row">
      <div class="form-group">
        <label>รหัสวิชา (ไม่บังคับ)</label>
        <input type="text" id="newSubjectCode" placeholder="เช่น ท11101">
      </div>
      <div class="form-group">
        <label>ชื่อวิชา</label>
        <input type="text" id="newSubjectName" placeholder="ชื่อวิชา">
      </div>
      <div class="form-group">
        <label>เวลาเรียน (ชม./ปี)</label>
        <input type="number" id="newHours" placeholder="80" min="0">
      </div>
      <div class="form-group" style="justify-content:flex-end">
        <button class="btn-primary" id="addSubjectBtn" onclick="addSubject()">เพิ่มวิชา</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>รายการวิชาทั้งหมด</h3>
    <button class="btn-primary preseed-btn" id="preseedBtn" onclick="preseedSubjects()">เพิ่มวิชาเริ่มต้น 11 วิชา</button>
    <div class="loading-msg" id="subjectsLoading">
      <div class="skeleton-table">
        <div class="skeleton-table-row skeleton-table-head"><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
      </div>
    </div>
    <table id="subjectsTable" style="display:none">
      <thead>
        <tr>
          <th>รหัสระบบ</th>
          <th>รหัสวิชา</th>
          <th>ชื่อวิชา</th>
          <th>เวลาเรียน</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="subjectsBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadSubjects() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      renderSubjects((result && result.subjects) ? result.subjects : []);
    })
    .withFailureHandler(function(err) { showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error'); })
    .getSubjectsList(TOKEN);
}

function renderSubjects(subjects) {
  document.getElementById('subjectsLoading').style.display = 'none';
  var tbody = document.getElementById('subjectsBody');
  tbody.innerHTML = '';
  subjects.forEach(function(s) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-subject-id', s.subject_id);
    tr.innerHTML =
      '<td>' + escHtml(s.subject_id) + '</td>' +
      '<td>' + escHtml(s.subject_code || '—') + '</td>' +
      '<td>' + escHtml(s.subject_name) + '</td>' +
      '<td>' + escHtml(s.hours_per_year) + ' ชม.</td>' +
      '<td>' +
        '<button class="btn-primary" style="margin-right:6px;font-size:12px;padding:5px 12px" onclick="viewIndicators(\'' + escHtml(s.subject_id) + '\')">ตัวชี้วัด</button>' +
        '<button class="btn-danger" onclick="deleteSubject(\'' + escHtml(s.subject_id) + '\')" style="font-size:12px;padding:5px 12px">ลบ</button>' +
      '</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('subjectsTable').style.display = 'table';
}

function addSubject() {
  var subject_name = document.getElementById('newSubjectName').value.trim();
  var subject_code = document.getElementById('newSubjectCode').value.trim();
  var hours = document.getElementById('newHours').value.trim();

  if (!subject_name) { showToast('กรุณากรอก ชื่อวิชา', 'error'); return; }

  var btn = document.getElementById('addSubjectBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มวิชาสำเร็จ', 'success');
      document.getElementById('newSubjectName').value = '';
      document.getElementById('newSubjectCode').value = '';
      document.getElementById('newHours').value = '';
      document.getElementById('subjectsLoading').style.display = 'block';
      document.getElementById('subjectsTable').style.display = 'none';
      loadSubjects();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddSubject(TOKEN, '', subject_name, subject_code, hours, '1', '');
}

function viewIndicators(subject_id) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getIndicatorsPageHtml(TOKEN, subject_id);
}

function deleteSubject(subject_id) {
  if (!confirm('ยืนยันการลบวิชา ' + subject_id + '?')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('ลบวิชาสำเร็จ', 'success');
      loadSubjects();
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .serverDeleteSubject(TOKEN, subject_id);
}

function preseedSubjects() {
  var btn = document.getElementById('preseedBtn');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มวิชาเริ่มต้นสำเร็จ', 'success');
      document.getElementById('subjectsLoading').style.display = 'block';
      document.getElementById('subjectsTable').style.display = 'none';
      loadSubjects();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .preseedSubjects();
}

loadSubjects();
</script>
</body>
</html>

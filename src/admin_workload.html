<div class="container">
  <div class="card">
    <h2>ภาระงานครู (Workload)</h2>
    <div id="workloadContent" class="loading-msg">
      <div class="skeleton-table">
        <div class="skeleton-table-row skeleton-table-head"><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
        <div class="skeleton-table-row"><div class="skeleton-table-cell" style="width:30%"></div><div class="skeleton-table-cell" style="width:15%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:20%"></div><div class="skeleton-table-cell" style="width:15%"></div></div>
      </div>
    </div>
    <div class="drill-panel" id="drillPanel">
      <h3 id="drillTitle"></h3>
      <table id="drillTable">
        <thead><tr><th>ชั้น</th><th>วิชา</th><th>ลิงก์</th></tr></thead>
        <tbody id="drillBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var TOKEN = '<?= data.token ?>';
var WEB_APP_URL = '<?= data.web_app_url || ScriptApp.getService().getUrl() ?>';

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); alert('เกิดข้อผิดพลาด: ' + err.message); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

loadWorkload();

function loadWorkload() {
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error) { document.getElementById('workloadContent').textContent = 'เกิดข้อผิดพลาด: ' + data.error; return; }
      renderWorkload(data.teachers || []);
    })
    .withFailureHandler(function(err) { document.getElementById('workloadContent').textContent = 'Error: ' + err.message; })
    .clientGetWorkloadData(TOKEN);
}

function renderWorkload(teachers) {
  // teachers already arrive sorted descending by pair_count from the server
  if (teachers.length === 0) {
    document.getElementById('workloadContent').textContent = 'ไม่พบครูในระบบ';
    return;
  }
  var html = '<table id="workloadTable">' +
    '<thead><tr>' +
    '<th>ชื่อครู</th>' +
    '<th>จำนวน (class, subject)</th>' +
    '<th>รายวิชาที่สอน</th>' +
    '<th>จำนวนนักเรียนรวม</th>' +
    '</tr></thead>' +
    '<tbody id="workloadBody">';
  teachers.forEach(function(t, idx) {
    html += '<tr id="row-' + esc(t.user_id) + '" data-idx="' + idx + '" onclick="showDrill(this, ' + idx + ')">' +
      '<td class="teacher-name">' + esc(t.full_name) + '</td>' +
      '<td class="pair-count">' + t.pair_count + '</td>' +
      '<td class="subject-names">' + esc(t.subject_names) + '</td>' +
      '<td class="student-count">' + t.student_count + '</td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('workloadContent').innerHTML = html;
  document.workloadTeachers = teachers;
}

function showDrill(row, idx) {
  var t = document.workloadTeachers[idx];
  if (!t) return;

  // Toggle active highlight
  var rows = document.querySelectorAll('#workloadBody tr');
  rows.forEach(function(r) { r.classList.remove('active'); });
  row.classList.add('active');

  document.getElementById('drillTitle').textContent = t.full_name + ' — รายละเอียด (' + t.pair_count + ' คู่)';
  var tbody = document.getElementById('drillBody');
  tbody.innerHTML = '';

  if (!t.pairs || t.pairs.length === 0) {
    var emptyRow = document.createElement('tr');
    emptyRow.innerHTML = '<td colspan="3">ไม่มีข้อมูล</td>';
    tbody.appendChild(emptyRow);
  } else {
    t.pairs.forEach(function(p) {
      var tr = document.createElement('tr');
      var gradeLink = WEB_APP_URL + '?page=gradebook&class_id=' + encodeURIComponent(p.class_id) +
        '&subject_id=' + encodeURIComponent(p.subject_id) + '&token=' + encodeURIComponent(TOKEN);
      tr.innerHTML =
        '<td class="drill-class">' + esc(p.class_label) + '</td>' +
        '<td class="drill-subject">' + esc(p.subject_name) + '</td>' +
        '<td><a href="' + gradeLink + '" class="drill-link">เปิดเกรดบุ๊ก</a></td>';
      tbody.appendChild(tr);
    });
  }

  var panel = document.getElementById('drillPanel');
  panel.classList.add('open');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>

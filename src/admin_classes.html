<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var teachersMap = {};

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadTeachers() {
  var sel = document.getElementById('newHomeroomTeacher');
  var editSel = document.getElementById('editHomeroomTeacher');
  google.script.run
    .withSuccessHandler(function(result) {
      (result.teachers || []).forEach(function(t) {
        var cleanId = (t.user_id || '').trim();
        teachersMap[cleanId] = t.full_name;
        
        var opt = document.createElement('option');
        opt.value = cleanId;
        opt.textContent = t.full_name;
        sel.appendChild(opt);

        var optEdit = document.createElement('option');
        optEdit.value = cleanId;
        optEdit.textContent = t.full_name;
        editSel.appendChild(optEdit);
      });
      loadClasses();
    })
    .withFailureHandler(function() { loadClasses(); })
    .getTeachersList(TOKEN);
}

function loadClasses() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      renderClasses((result && result.classes) ? result.classes : []);
    })
    .withFailureHandler(function(err) { showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error'); })
    .getClassesList(TOKEN);
}

function renderClasses(classes) {
  document.getElementById('classesLoading').style.display = 'none';
  var tbody = document.getElementById('classesBody');
  tbody.innerHTML = '';
  classes.forEach(function(c) {
    var rawTeacherId = (c.homeroom_teacher_user_id || '').trim();
    var teacherName = teachersMap[rawTeacherId] || '—';
    var tr = document.createElement('tr');
    tr.setAttribute('data-class-id', c.class_id);
    tr.innerHTML =
      '<td>' + escHtml(c.class_id) + '</td>' +
      '<td>' + escHtml(c.level) + '</td>' +
      '<td>' + escHtml(c.section) + '</td>' +
      '<td>' + escHtml(teacherName) + '</td>' +
      '<td>' +
      '<button class="btn-secondary" onclick="viewStudents(\'' + escHtml(c.class_id) + '\')" style="margin-right:6px;background:#1a56a0;color:white;font-size:12px;padding:5px 12px">นักเรียน</button>' +
      '<button class="btn-secondary" onclick="openEditModal(\'' + escHtml(c.class_id) + '\', \'' + escHtml(c.level) + '\', \'' + escHtml(c.section) + '\', \'' + escHtml(rawTeacherId) + '\')" style="margin-right:6px;font-size:12px;padding:5px 12px">แก้ไข</button>' +
      '<button class="btn-danger" onclick="deleteClass(\'' + escHtml(c.class_id) + '\')" style="font-size:12px;padding:5px 12px">ลบ</button>' +
      '</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('classesTable').style.display = 'table';
}

function addClass() {
  var level = document.getElementById('newLevel').value;
  var section = document.getElementById('newSection').value.trim();
  var homeroom = document.getElementById('newHomeroomTeacher').value;

  if (!level || !section) { showToast('กรุณาระบุระดับชั้นและห้อง', 'error'); return; }

  var btn = document.getElementById('addClassBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มชั้นเรียนสำเร็จ (' + result.class_id + ')', 'success');
      document.getElementById('newSection').value = '';
      document.getElementById('classesLoading').style.display = 'block';
      document.getElementById('classesTable').style.display = 'none';
      loadClasses();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddClass(TOKEN, '', level, section, homeroom);
}

function openEditModal(classId, level, section, homeroomTeacherUserId) {
  document.getElementById('editTargetClassId').textContent = classId;
  document.getElementById('editClassId').value = classId;
  document.getElementById('editLevel').value = level;
  document.getElementById('editSection').value = section;
  document.getElementById('editHomeroomTeacher').value = homeroomTeacherUserId || '';
  document.getElementById('editModal').classList.add('open');
  document.getElementById('confirmEditBtn').disabled = false;
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
}

function confirmEdit() {
  var classId = document.getElementById('editClassId').value;
  var level = document.getElementById('editLevel').value;
  var section = document.getElementById('editSection').value.trim();
  var homeroom = document.getElementById('editHomeroomTeacher').value;

  if (!level || !section) { showToast('กรุณาระบุระดับชั้นและห้อง', 'error'); return; }

  var btn = document.getElementById('confirmEditBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังแก้ไข';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      btn.textContent = 'บันทึก';
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('แก้ไขชั้นเรียนสำเร็จ', 'success');
      closeEditModal();
      document.getElementById('classesLoading').style.display = 'block';
      document.getElementById('classesTable').style.display = 'none';
      loadClasses();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = 'บันทึก';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverUpdateClass(TOKEN, classId, level, section, homeroom);
}

function deleteClass(class_id) {
  if (!confirm('ยืนยันการลบชั้น ' + class_id + '?')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('ลบชั้นเรียนสำเร็จ', 'success');
      loadClasses();
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .serverDeleteClass(TOKEN, class_id);
}

function viewStudents(class_id) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getClassStudentsPageHtml(TOKEN, class_id);
}

loadTeachers();
</script>

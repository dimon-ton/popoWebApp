<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการชั้นเรียน — PopoWebApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f5f5f5; color: #333; }
    .navbar { background: #1a56a0; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .navbar-title { font-size: 18px; font-weight: bold; }
    .navbar a { color: white; text-decoration: none; font-size: 14px; cursor: pointer; }
    .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
    h2 { font-size: 20px; color: #1a56a0; margin-bottom: 20px; }
    .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { font-size: 15px; color: #444; margin-bottom: 16px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
    .form-group label { font-size: 12px; color: #555; }
    input[type="text"], select {
      padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 13px; font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: #1a56a0; }
    button {
      padding: 8px 18px; border: none; border-radius: 4px; font-size: 13px;
      font-family: inherit; cursor: pointer;
    }
    .btn-primary { background: #1a56a0; color: white; }
    .btn-primary:hover { background: #154880; }
    .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f0f4fa; padding: 10px 12px; text-align: left; border-bottom: 2px solid #ddd; }
    td { padding: 10px 12px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #fafcff; }
    .toast {
      position: fixed; top: 20px; right: 20px; padding: 12px 20px;
      border-radius: 6px; font-size: 14px; z-index: 1000;
      display: none; max-width: 320px;
    }
    .toast.success { background: #27ae60; color: white; }
    .toast.error { background: #c0392b; color: white; }
    .loading-msg { color: #888; font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>
<div class="navbar">
  <span class="navbar-title">PopoWebApp</span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <a href="#" onclick="navigate('admin_school')">ข้อมูลโรงเรียน</a>
  <a href="#" onclick="navigate('admin_classes')">ชั้นเรียน</a>
  <a href="#" onclick="navigate('admin_subjects')">วิชา</a>
  <a href="#" onclick="navigate('admin_users')">ผู้ใช้</a>
  <span style="margin-left:auto;font-size:13px"><?= data.session ? data.session.full_name : '' ?></span>
</div>

<div class="container">
  <h2 id="pageHeading">จัดการชั้นเรียน</h2>

  <div class="card">
    <h3>เพิ่มชั้นเรียนใหม่</h3>
    <div class="form-row">
      <div class="form-group">
        <label>รหัสชั้น (class_id)</label>
        <input type="text" id="newClassId" placeholder="เช่น class_p1_1">
      </div>
      <div class="form-group">
        <label>ระดับชั้น</label>
        <select id="newLevel">
          <option value="ป.1">ป.1</option>
          <option value="ป.2">ป.2</option>
          <option value="ป.3">ป.3</option>
          <option value="ป.4">ป.4</option>
          <option value="ป.5">ป.5</option>
          <option value="ป.6">ป.6</option>
        </select>
      </div>
      <div class="form-group">
        <label>ห้อง</label>
        <input type="text" id="newSection" placeholder="1">
      </div>
      <div class="form-group">
        <label>ครูประจำชั้น</label>
        <select id="newHomeroomTeacher">
          <option value="">— ไม่ระบุ —</option>
        </select>
      </div>
      <div class="form-group" style="justify-content:flex-end">
        <button class="btn-primary" id="addClassBtn" onclick="addClass()">เพิ่มชั้นเรียน</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>รายการชั้นเรียน</h3>
    <p class="loading-msg" id="classesLoading">กำลังโหลด...</p>
    <table id="classesTable" style="display:none">
      <thead>
        <tr>
          <th>รหัสชั้น</th>
          <th>ระดับชั้น</th>
          <th>ห้อง</th>
          <th>ครูประจำชั้น</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="classesBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var teachersMap = {};

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadTeachers() {
  google.script.run
    .withSuccessHandler(function(result) {
      var sel = document.getElementById('newHomeroomTeacher');
      (result.teachers || []).forEach(function(t) {
        teachersMap[t.user_id] = t.full_name;
        var opt = document.createElement('option');
        opt.value = t.user_id;
        opt.textContent = t.full_name;
        sel.appendChild(opt);
      });
    })
    .withFailureHandler(function() {})
    .getTeachersList(TOKEN);
}

function loadClasses() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      renderClasses((result && result.classes) ? result.classes : []);
    })
    .withFailureHandler(function(err) { showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error'); })
    .getClassesList(TOKEN);
}

function renderClasses(classes) {
  document.getElementById('classesLoading').style.display = 'none';
  var tbody = document.getElementById('classesBody');
  tbody.innerHTML = '';
  classes.forEach(function(c) {
    var teacherName = teachersMap[c.homeroom_teacher_user_id] || c.homeroom_teacher_user_id || '—';
    var tr = document.createElement('tr');
    tr.setAttribute('data-class-id', c.class_id);
    tr.innerHTML =
      '<td>' + escHtml(c.class_id) + '</td>' +
      '<td>' + escHtml(c.level) + '</td>' +
      '<td>' + escHtml(c.section) + '</td>' +
      '<td>' + escHtml(teacherName) + '</td>' +
      '<td>' +
      '<button class="btn-secondary" onclick="viewStudents(\'' + escHtml(c.class_id) + '\')" style="margin-right:6px;background:#1a56a0;color:white;font-size:12px;padding:5px 12px">นักเรียน</button>' +
      '<button class="btn-danger" onclick="deleteClass(\'' + escHtml(c.class_id) + '\')">ลบ</button>' +
      '</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('classesTable').style.display = 'table';
}

function addClass() {
  var class_id = document.getElementById('newClassId').value.trim();
  var level = document.getElementById('newLevel').value;
  var section = document.getElementById('newSection').value.trim();
  var homeroom = document.getElementById('newHomeroomTeacher').value;

  if (!class_id) { showToast('กรุณากรอกรหัสชั้น', 'error'); return; }

  var btn = document.getElementById('addClassBtn');
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('เพิ่มชั้นเรียนสำเร็จ', 'success');
      document.getElementById('newClassId').value = '';
      document.getElementById('newSection').value = '';
      document.getElementById('classesLoading').style.display = 'block';
      document.getElementById('classesTable').style.display = 'none';
      loadClasses();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverAddClass(TOKEN, class_id, level, section, homeroom);
}

function deleteClass(class_id) {
  if (!confirm('ยืนยันการลบชั้น ' + class_id + '?')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('ลบชั้นเรียนสำเร็จ', 'success');
      loadClasses();
    })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .serverDeleteClass(TOKEN, class_id);
}

function viewStudents(class_id) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getClassStudentsPageHtml(TOKEN, class_id);
}

loadTeachers();
loadClasses();
</script>
</body>
</html>

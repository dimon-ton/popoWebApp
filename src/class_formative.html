<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คะแนนตัวชี้วัด — PopoWebApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f5f5f5; color: #333; }
    .navbar { background: #1a56a0; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .navbar-title { font-size: 18px; font-weight: bold; }
    .navbar a { color: white; text-decoration: none; font-size: 14px; cursor: pointer; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    h2 { font-size: 18px; color: #1a56a0; margin-bottom: 16px; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
    .readonly-notice {
      font-size: 13px; color: #888; margin-bottom: 12px; padding: 10px;
      background: #fff8e1; border-radius: 4px; border-left: 3px solid #f0a500;
    }
    table { border-collapse: collapse; font-size: 13px; width: 100%; }
    th {
      background: #f0f4fa; padding: 8px 6px; text-align: center;
      border: 1px solid #ddd; font-size: 12px; white-space: nowrap; min-width: 46px;
    }
    th.name-col { text-align: left; min-width: 140px; }
    th.total-col { background: #e8f0fe; }
    td {
      padding: 4px 3px; border: 1px solid #eee; text-align: center;
      vertical-align: middle;
    }
    td.name-col { text-align: left; padding-left: 8px; white-space: nowrap; }
    td.seq-col { text-align: center; color: #888; width: 36px; }
    td.total-col { font-weight: bold; color: #1a56a0; background: #f4f8ff; }
    td.avg-col { font-style: italic; color: #888; background: #f9f9f9; }
    input.score-input {
      width: 38px; text-align: center; border: 1px solid #ccc; border-radius: 3px;
      padding: 3px 2px; font-size: 13px; font-family: inherit;
    }
    input.score-input:focus { border-color: #1a56a0; outline: none; }
    input.score-input:invalid { border-color: #c0392b; }
    tfoot td { background: #f0f4fa; font-size: 12px; color: #666; }
    tfoot td.avg-row { font-style: italic; }
    .save-bar {
      display: flex; gap: 10px; align-items: center; margin-top: 12px;
    }
    .btn-save {
      padding: 9px 24px; background: #27ae60; color: white; border: none;
      border-radius: 4px; font-size: 14px; font-family: inherit; cursor: pointer;
    }
    .btn-save:hover { background: #219150; }
    .btn-save:disabled { background: #aaa; cursor: not-allowed; }
    .toast {
      position: fixed; top: 20px; right: 20px; padding: 12px 20px;
      border-radius: 6px; font-size: 14px; z-index: 1000;
      display: none; max-width: 320px;
    }
    .toast.success { background: #27ae60; color: white; }
    .toast.error { background: #c0392b; color: white; }
    .loading-msg { color: #888; font-size: 14px; padding: 12px 0; }
    .no-indicators { color: #888; font-size: 14px; padding: 16px 0; }
  </style>
</head>
<body>
<div class="navbar">
  <span class="navbar-title">PopoWebApp</span>
  <a href="#" onclick="navigate('dashboard')">หน้าหลัก</a>
  <span style="margin-left:auto;font-size:13px"><?= data.session ? data.session.full_name : '' ?></span>
</div>

<div class="container">
  <h2 id="pageHeading">คะแนนตัวชี้วัด (คะแนน1)</h2>

  <div id="readonlyNotice" class="readonly-notice" style="display:none">
    คุณมีสิทธิ์อ่านอย่างเดียว — เฉพาะครูผู้สอนหรือผู้ดูแลระบบแก้ไขได้
  </div>

  <div class="card">
    <p class="loading-msg" id="loadingMsg">กำลังโหลด...</p>
    <p class="no-indicators" id="noIndicatorsMsg" style="display:none">
      ยังไม่มีตัวชี้วัดสำหรับวิชานี้ — กรุณาเพิ่มตัวชี้วัดในหน้าจัดการก่อน
    </p>
    <table id="formativeTable" style="display:none">
      <thead id="formativeHead"></thead>
      <tbody id="formativeBody"></tbody>
      <tfoot id="formativeFoot"></tfoot>
    </table>
  </div>

  <div class="save-bar" id="saveBar" style="display:none">
    <button class="btn-save" id="saveBtn" onclick="saveFormative()">บันทึกคะแนน</button>
    <span id="saveStatus" style="font-size:13px;color:#888"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';
var CLASS_ID = '<?= data.class_id || '' ?>';
var SUBJECT_ID = '<?= data.subject_id || '' ?>';

var currentData = null;

function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadFormative() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('formativeTable').style.display = 'none';
  document.getElementById('noIndicatorsMsg').style.display = 'none';
  document.getElementById('saveBar').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.error) { showToast(result.error, 'error'); return; }
      currentData = result;
      renderGrid(result);
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingMsg').style.display = 'none';
      showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    })
    .getFormativeData(TOKEN, CLASS_ID, SUBJECT_ID);
}

function renderGrid(data) {
  document.getElementById('loadingMsg').style.display = 'none';

  var cls = data.class_info || {};
  var subj = data.subject_info || {};
  document.getElementById('pageHeading').textContent =
    'คะแนนตัวชี้วัด — ' + (cls.level || '') + '/' + (cls.section || '') + ' — ' + (subj.subject_name || '');

  var readonlyNotice = document.getElementById('readonlyNotice');
  var saveBar = document.getElementById('saveBar');
  if (data.can_edit) {
    readonlyNotice.style.display = 'none';
    saveBar.style.display = 'flex';
  } else {
    readonlyNotice.style.display = 'block';
    saveBar.style.display = 'none';
  }

  if (!data.indicators || data.indicators.length === 0) {
    document.getElementById('noIndicatorsMsg').style.display = 'block';
    return;
  }

  var indicators = data.indicators;
  var students = data.students || [];
  var scores = data.scores || {};

  // Build header row
  var thead = document.getElementById('formativeHead');
  var headRow = '<tr><th class="seq-col">ที่</th><th class="name-col">ชื่อ-สกุล</th>';
  indicators.forEach(function(ind) {
    headRow += '<th title="' + escHtml(ind.description || ind.code) + '">' +
      escHtml(ind.code) + '<br><span style="font-weight:normal;font-size:11px">/' + escHtml(ind.max_score) + '</span></th>';
  });
  headRow += '<th class="total-col">รวม</th></tr>';
  thead.innerHTML = headRow;

  // Build body
  var tbody = document.getElementById('formativeBody');
  tbody.innerHTML = '';

  // Column sums for averages
  var colSums = indicators.map(function() { return 0; });
  var studentCount = students.length;

  students.forEach(function(student) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-student-id', student.student_id);

    var studentScores = scores[student.student_id] || {};
    var rowTotal = 0;

    var cells = '<td class="seq-col">' + escHtml(student.seq_no) + '</td>' +
                '<td class="name-col">' + escHtml(student.full_name) + '</td>';

    indicators.forEach(function(ind, i) {
      var score = studentScores[ind.indicator_id];
      var scoreVal = (score !== undefined && score !== '') ? Number(score) : '';
      if (scoreVal !== '') rowTotal += scoreVal;
      if (scoreVal !== '') colSums[i] += scoreVal;

      if (data.can_edit) {
        cells += '<td><input class="score-input" type="number" min="0" max="' + escHtml(ind.max_score) + '" ' +
          'step="1" value="' + (scoreVal !== '' ? escHtml(scoreVal) : '') + '" ' +
          'data-student="' + escHtml(student.student_id) + '" ' +
          'data-indicator="' + escHtml(ind.indicator_id) + '" ' +
          'data-max="' + escHtml(ind.max_score) + '" ' +
          'oninput="updateRowTotal(this)" ' +
          'onchange="clampScore(this)"></td>';
      } else {
        cells += '<td>' + (scoreVal !== '' ? escHtml(scoreVal) : '') + '</td>';
      }
    });

    cells += '<td class="total-col" id="row-total-' + escHtml(student.student_id) + '">' + rowTotal + '</td>';

    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });

  // Build footer with column averages
  var tfoot = document.getElementById('formativeFoot');
  var footRow = '<tr><td colspan="2" style="text-align:right;font-size:12px">เฉลี่ย:</td>';
  indicators.forEach(function(ind, i) {
    var avg = studentCount > 0 ? (colSums[i] / studentCount).toFixed(1) : '-';
    footRow += '<td class="avg-row" id="col-avg-' + escHtml(ind.indicator_id) + '">' + avg + '</td>';
  });
  footRow += '<td></td></tr>';
  tfoot.innerHTML = footRow;

  document.getElementById('formativeTable').style.display = 'table';
}

// Live update row total when a score input changes
function updateRowTotal(input) {
  var tr = input.closest('tr');
  if (!tr) return;
  var studentId = tr.getAttribute('data-student-id');
  var inputs = tr.querySelectorAll('input.score-input');
  var total = 0;
  inputs.forEach(function(inp) {
    var v = parseFloat(inp.value);
    if (!isNaN(v)) total += v;
  });
  var totalCell = document.getElementById('row-total-' + studentId);
  if (totalCell) totalCell.textContent = total;

  // Update column average
  updateColAverage(input.getAttribute('data-indicator'));
}

function clampScore(input) {
  var max = parseFloat(input.getAttribute('data-max'));
  var v = parseFloat(input.value);
  if (!isNaN(v)) {
    if (v < 0) input.value = 0;
    if (!isNaN(max) && v > max) input.value = max;
  }
  updateRowTotal(input);
}

function updateColAverage(indicatorId) {
  if (!currentData) return;
  var students = currentData.students || [];
  var sum = 0; var count = 0;
  students.forEach(function(student) {
    var input = document.querySelector(
      'input[data-student="' + student.student_id + '"][data-indicator="' + indicatorId + '"]'
    );
    if (input) {
      var v = parseFloat(input.value);
      if (!isNaN(v)) { sum += v; count++; }
    }
  });
  var avgCell = document.getElementById('col-avg-' + indicatorId);
  if (avgCell) avgCell.textContent = count > 0 ? (sum / count).toFixed(1) : '-';
}

function saveFormative() {
  if (!currentData) return;

  var rows = [];
  var inputs = document.querySelectorAll('input.score-input');
  inputs.forEach(function(input) {
    var studentId = input.getAttribute('data-student');
    var indicatorId = input.getAttribute('data-indicator');
    var score = input.value !== '' ? parseFloat(input.value) : 0;
    if (studentId && indicatorId) {
      rows.push({ student_id: studentId, indicator_id: indicatorId, score: isNaN(score) ? 0 : score });
    }
  });

  if (rows.length === 0) {
    showToast('ไม่มีข้อมูลที่จะบันทึก', 'success');
    return;
  }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  document.getElementById('saveStatus').textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('บันทึกคะแนนสำเร็จ', 'success');
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      document.getElementById('saveStatus').textContent = '';
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverSaveFormative(TOKEN, CLASS_ID, SUBJECT_ID, rows);
}

// Init
loadFormative();
</script>
</body>
</html>

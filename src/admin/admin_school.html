<div class="container narrow">
  <h2 class="page-title" id="pageHeading">ข้อมูลโรงเรียน</h2>

  <div class="card">
    <h3>ตั้งค่าข้อมูลโรงเรียน</h3>
    <div class="form-group">
      <label>ชื่อโรงเรียน</label>
      <input type="text" id="schoolName" placeholder="ชื่อโรงเรียน">
    </div>
    <div class="form-group">
      <label>อำเภอ</label>
      <input type="text" id="district" placeholder="อำเภอ">
    </div>
    <div class="form-group">
      <label>จังหวัด</label>
      <input type="text" id="province" placeholder="จังหวัด">
    </div>
    <div class="form-group">
      <label>ที่อยู่โรงเรียน</label>
      <input type="text" id="schoolAddress" placeholder="ที่อยู่โรงเรียน">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>เบอร์โทรศัพท์</label>
        <input type="text" id="phoneNumber" placeholder="เบอร์โทรศัพท์">
      </div>
      <div class="form-group">
        <label>เขตพื้นที่การศึกษา</label>
        <input type="text" id="educationArea" placeholder="เช่น สพป.ร้อยเอ็ด เขต 2">
      </div>
    </div>
    <div class="form-group">
      <label>ปีการศึกษา</label>
      <input type="text" id="academicYear" placeholder="เช่น 2567">
    </div>
    <div class="form-group">
      <label>ภาคเรียน</label>
      <input type="text" id="semester" placeholder="เช่น 1 หรือ 2">
    </div>
    <div class="form-group">
      <label>วันเปิดภาคเรียน / วันเริ่มนับเวลาเรียน</label>
      <div class="thai-date-picker" data-thai-date-picker>
        <input type="hidden" id="semesterStartDate" data-thai-date-value>
        <input type="text" class="thai-date-display" data-thai-date-display placeholder="เลือกวันที่" readonly>
      </div>
    </div>
    <div class="form-group">
      <label>จำนวนวันเรียนที่ต้องนับ</label>
      <input type="number" id="requiredAttendanceDays" min="1" max="260" placeholder="เช่น 200">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>หัวหน้างานวัดผลและประเมินผล</label>
        <input type="text" id="measurementHeadName" placeholder="ชื่อ-สกุล">
      </div>
      <div class="form-group">
        <label>หัวหน้างานวิชาการ</label>
        <input type="text" id="academicHeadName" placeholder="ชื่อ-สกุล">
      </div>
    </div>
    <div class="form-group">
      <label>ผู้อำนวยการโรงเรียน</label>
      <input type="text" id="directorName" placeholder="ชื่อ-สกุล">
    </div>
    <div class="form-group">
      <label>โลโก้โรงเรียน</label>
      <input type="file" id="schoolLogoFile" accept="image/*">
      <input type="hidden" id="schoolLogo">
      <div style="display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <img id="schoolLogoPreview" alt="ตัวอย่างโลโก้โรงเรียน" style="display:none;width:80px;height:80px;object-fit:contain;border:1px solid var(--border);border-radius:6px;background:#fff;padding:4px">
        <button type="button" class="btn-secondary" onclick="clearSchoolLogo()">ลบโลโก้</button>
      </div>
    </div>
    <button class="btn-primary" id="saveSchoolBtn" onclick="saveSchoolInfo()">บันทึก</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = '<?= data.token || '' ?>';

function navigate(page) {
  showNavLoading();
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(err) { hideNavLoading(); showToast('เกิดข้อผิดพลาด: ' + err.message, 'error'); })
    .getPageHtml(TOKEN, page);
}

function doLogout() {
  var btn = document.getElementById('logoutBtn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('popo_token');
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() { document.open(); document.write('<p>กำลังออกจากระบบ...</p>'); document.close(); })
        .getLoginHtml();
    })
    .withFailureHandler(function() {
      localStorage.removeItem('popo_token');
      location.reload();
    })
    .serverLogout(TOKEN);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 4000);
}

function loadSchoolInfo() {
  google.script.run
    .withSuccessHandler(function(info) {
      if (!info) return;
      document.getElementById('schoolName').value = info.school_name || '';
      document.getElementById('district').value = info.district || '';
      document.getElementById('province').value = info.province || '';
      document.getElementById('schoolAddress').value = info.school_address || '';
      document.getElementById('phoneNumber').value = info.phone_number || '';
      document.getElementById('educationArea').value = info.education_area || '';
      document.getElementById('academicYear').value = info.academic_year || '';
      document.getElementById('semester').value = info.semester || '';
      if (typeof setThaiDatePickerValue === 'function') setThaiDatePickerValue(document.getElementById('semesterStartDate'), info.semester_start_date || '');
      else document.getElementById('semesterStartDate').value = info.semester_start_date || '';
      document.getElementById('requiredAttendanceDays').value = info.required_attendance_days || '';
      document.getElementById('measurementHeadName').value = info.measurement_head_name || '';
      document.getElementById('academicHeadName').value = info.academic_head_name || '';
      document.getElementById('directorName').value = info.director_name || '';
      setLogoPreview(info.school_logo || '');
    })
    .withFailureHandler(function(err) { showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error'); })
    .getSchoolInfo();
}

function saveSchoolInfo() {
  var btn = document.getElementById('saveSchoolBtn');
  btn.disabled = true;
  var school_name = document.getElementById('schoolName').value.trim();
  var district = document.getElementById('district').value.trim();
  var province = document.getElementById('province').value.trim();
  var school_address = document.getElementById('schoolAddress').value.trim();
  var phone_number = document.getElementById('phoneNumber').value.trim();
  var education_area = document.getElementById('educationArea').value.trim();
  var academic_year = document.getElementById('academicYear').value.trim();
  var semester = document.getElementById('semester').value.trim();
  var semester_start_date = document.getElementById('semesterStartDate').value.trim();
  var required_attendance_days = document.getElementById('requiredAttendanceDays').value.trim();
  if (semester_start_date && !/^\d{4}-\d{2}-\d{2}$/.test(semester_start_date)) {
    btn.disabled = false;
    showToast('กรุณาเลือกวันเปิดภาคเรียนใหม่', 'error');
    return;
  }
  var attendanceDays = Number(required_attendance_days);
  if (required_attendance_days && (!Number.isInteger(attendanceDays) || attendanceDays < 1 || attendanceDays > 260)) {
    btn.disabled = false;
    showToast('จำนวนวันเรียนต้องอยู่ระหว่าง 1 ถึง 260', 'error');
    return;
  }

  var extra = {
    semester: semester,
    school_address: school_address,
    phone_number: phone_number,
    education_area: education_area,
    school_logo: document.getElementById('schoolLogo').value,
    measurement_head_name: document.getElementById('measurementHeadName').value.trim(),
    academic_head_name: document.getElementById('academicHeadName').value.trim(),
    director_name: document.getElementById('directorName').value.trim()
  };

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result && result.error) { showToast(result.error, 'error'); return; }
      showToast('บันทึกข้อมูลโรงเรียนสำเร็จ', 'success');
      loadSchoolInfo();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .serverSaveSchoolInfo(TOKEN, school_name, district, province, academic_year, semester_start_date, required_attendance_days, extra);
}

function setLogoPreview(value) {
  document.getElementById('schoolLogo').value = value || '';
  var img = document.getElementById('schoolLogoPreview');
  if (value) {
    img.src = value;
    img.style.display = 'block';
  } else {
    img.removeAttribute('src');
    img.style.display = 'none';
  }
}

function clearSchoolLogo() {
  document.getElementById('schoolLogoFile').value = '';
  setLogoPreview('');
}

document.getElementById('schoolLogoFile').addEventListener('change', function() {
  var file = this.files && this.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type)) {
    showToast('กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'error');
    this.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    google.script.run
      .withSuccessHandler(function(result) { setLogoPreview(result.school_logo || e.target.result); })
      .withFailureHandler(function(err) { showToast('อัปโหลดโลโก้ไม่สำเร็จ: ' + err.message, 'error'); })
      .serverUploadSchoolLogo(TOKEN, e.target.result, file.name);
  };
  reader.readAsDataURL(file);
});

loadSchoolInfo();
</script>
</body>
